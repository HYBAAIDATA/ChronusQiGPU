error_budget_policy:
  rule: error budgets manage release cadence; they never excuse an R0 integrity failure or authorise fabricated success
  on_exhausted: freeze non-safety releases for the affected service until owner-approved recovery

# ---------------------------------------------------------------------------
# Resilience mechanics (§10-13)
# ---------------------------------------------------------------------------
timeout_retry_policy:
  rules:
    - never auto-retry an irreversible operation whose outcome is unknown
    - never auto-retry mining.submit unless protocol semantics make the duplicate safe
    - duplicate custody requests are deterministic/idempotent (content-addressed put)
    - read-only queries may use controlled bounded retry
    - retry storms are impossible: bounded attempts + backoff + jitter
    - timeout never becomes success
  defaults:
    read: {max_attempts: 3, backoff: exponential, jitter: true}
    mutation: {max_attempts: 1, idempotency: required-for-any-retry}
    irreversible: {max_attempts: 1}
  http_idempotency:
    header: Idempotency-Key
    behaviour: mutating POST/PUT routes honour a caller Idempotency-Key — a repeated key inside the retention window returns the recorded outcome without re-executing the mutation
    retention_window_s: 300
    implementation: chronus/mla1517_platform/python/control_api.py::_IDEMPOTENCY_RECORDS

circuit_breakers:
  - dependency: chronus.remote_opencl_v2
    implementation: chronus/mla1517/remote_gpu.py::RemoteCircuitBreaker
    states: [CLOSED, OPEN, HALF_OPEN]
    failure_threshold: 3 consecutive failures per endpoint
    recovery_timeout_s: 30
    rule: prevents repeated failing calls; grants no fallback authority; re-verification still applies to every result
  - dependency: stratum.v1
    implementation: chronus/mla1517_platform/python/manifold_pool_coordinator.py::ManifoldPoolCoordinator (reconnect_delay budget, stale-work rejection)
    states: [CLOSED, OPEN]
    rule: submit gate stays closed through reconnect storms

bulkheads:
  - resource: HTTP worker threads
    separation: ThreadingHTTPServer threads are request-scoped; SSE consumers hold one thread each and are capped client-side; mining never waits on HTTP threads
    proof: tests/test_fault_injection.py telemetry storm vs mining independence
  - resource: remote execution lane
    separation: remote_opencl_v2 failures are isolated to the remote lane; local solver lanes unaffected
    proof: chronus/mla1517_platform/python/test_remote_gpu.py
  - resource: tenant quotas
    separation: hyba_db is tenant-scoped; cross-tenant bleed is a defect class tested in the store contract
    proof: tests/test_production_api_contract.py::test_hyba_db_store_contract
  - resource: durable custody
    separation: THESEUS writes are independent of specialist computation failures; a failed TURING workload cannot block custody
    proof: tests/test_fault_injection.py

backpressure:
  - interface: pythia.telemetry.stream
    type: stream
    capacity: per-client thread
    high_water: n/a — SSE events are generated per tick, not queued authoritatively
    drop_policy: non-authoritative events may be skipped under overload; drops are counted and exposed
    authoritative_rule: never silently drop authoritative events
    exposed: [dropped_count, window, reason]
  - interface: pythia.worker_heartbeat
    type: filesystem queue (sidecar files)
    capacity: one file per worker
    drop_policy: stale files excluded; nothing silently dropped
    exposed: [staleness, exclusion]
  - interface: stratum.v1
    type: wire queue
    drop_policy: stale jobs rejected by generation, not dropped silently
    exposed: [stale_count in worker metrics]

# ---------------------------------------------------------------------------
# Schema governance + lifecycle (§14-15)
# ---------------------------------------------------------------------------
lifecycle_states: [EXPERIMENTAL, ACTIVE, STABLE, DEPRECATED, RETIRED, RESERVED, LEGACY]

schema_governance:
  versioning: major.minor per schema_version string; unknown trailing fields are additive-minor
  breaking_change_definition: removing/renaming a field, changing a field type, changing a verdict or failure-class meaning, changing authority
  unknown_field_handling: readers ignore unknown fields; writers never emit undeclared semantics
  unknown_major_handling: VERSION_UNSUPPORTED failure class — never silent downgrade
  deprecation_period: owner-declared; recorded on the registry entry
  removal_approval: canonical owner approval required; consumer inventory must be empty or migrated in the same change
  rules:
    - no silent endpoint removal
    - no silent reuse of an old endpoint for new semantics
    - breaking changes require owner approval and a compatibility-window declaration

deprecation_required_fields: [replacement, announcement_date, removal_criteria, compatibility_period, consumer_inventory]

# ---------------------------------------------------------------------------
# Correlation, observability, health (§17-20)
# ---------------------------------------------------------------------------
correlation_envelope:
  http_headers:
    inbound: [X-Request-Id, X-Correlation-Id, X-Causation-Id, Idempotency-Key]
    outbound: [X-Request-Id, X-Correlation-Id]
  fields: [request_id, correlation_id, causation_id, tenant_id, actor_id, operation, schema_version]
  mining_fields: [connection_id, session_id, job_id, job_generation, search_plan_id, lease_id, execution_id, candidate_id, verified_proof_id, submission_id, pool_outcome_id]
  rule: one production event is traceable across the entire system; malformed inbound correlation ids are replaced with fresh ids, never trusted

observability_standard:
  required_fields: [api_id, caller, callee, tenant, correlation_id, operation, start_time, end_time, elapsed, result_class, dependency_status, retry_count, evidence_ref]
  forbidden: [secrets, private_keys, credentials, raw_entitlement_secrets]
  rule: observability reports what authoritative systems did; it is never the source of authority

golden_signals:
  universal: [latency, traffic, errors, saturation]
  domain_truth: [authorisation_denies, custody_failures, stratum_reconnects, stale_jobs, chronus_execution_failures, turing_certificate_failures, ovid_equivalence_failures, salamander_rollback_count]

health_model:
  LIVENESS: process serving — pythia.health
  READINESS: declared dependency/config readiness — pythia.readiness components
  DEPENDENCY_HEALTH: per-component truth inside readiness (guardian, boot_audit, worker_heartbeat_dir, stratum, theseus where mounted)
  DOMAIN_READINESS: capability readiness — pythia.ready_to_mine
  rule: never collapse these into healthy=true

# ---------------------------------------------------------------------------
# Graceful degradation matrix (§21). No undocumented fallback exists.
# ---------------------------------------------------------------------------
degradation_matrix:
  - dependency: theseus.custody
    on_unavailable: durable authoritative operation stops
    affected: [pythia.mining.control, turing.vqc_pipeline, ovid.transform, kellogg.tensor.runtime, kellogg.tensor.execute, chronus.execution, salamander.control_plane, salamander.fault, euclid.orchestration]
    impersonation_allowed: false
  - dependency: al_haras.guardian
    on_unavailable: privileged operation stops — guardian-mediated routes deny
    affected: [pythia.mining.control, pythia.mining.evidence, al_haras.security.status, al_haras.security.subscribe, al_haras.security.evaluate, kellogg.tensor.capabilities, kellogg.tensor.execute, toe.collapse, namespace.policy, namespace.worker, namespace.recovery, namespace.admin, namespace.quantum, namespace.scale, namespace.assembly]
    impersonation_allowed: false
  - dependency: turing.vqc_pipeline
    on_unavailable: return typed unavailable to PYTHIA/EUCLID plan; plan may select another authorised lane
    affected: [euclid.orchestration]
    impersonation_allowed: false
  - dependency: kellogg.tensor.runtime
    on_unavailable: tensor-dependent operation unavailable or authorised alternative expressly selected
    affected: [euclid.orchestration, kellogg.tensor.capabilities, kellogg.tensor.execute]
    impersonation_allowed: false
  - dependency: ovid.transform
    on_unavailable: transform-dependent operation reports typed failure to the plan
    affected: [euclid.orchestration]
    impersonation_allowed: false
  - dependency: chronus.execution
    on_unavailable: execution-dependent operation fails bounded; no fake execution
    affected: [euclid.orchestration, pythia.gpu, pythia.hardware.status]
    impersonation_allowed: false
  - dependency: chronus.remote_opencl_v2
    on_unavailable: remote lane reports unavailable; local lanes continue; circuit breaker bounds retries
    affected: [chronus.execution]
    impersonation_allowed: false
  - dependency: stratum.v1
    on_unavailable: preserve state, bounded reconnect, invalidate stale work correctly
    affected: [pythia.mining.control, pythia.stratum.status, pythia.telemetry, pythia.telemetry.stream, pythia.metrics, pythia.status, pythia.ready_to_mine, pythia.agentic, pythia.cli.miner]
    impersonation_allowed: false
  - dependency: euclid.orchestration
    on_unavailable: intelligence surfaces report unavailable; control POSTs refused
    affected: [pythia.intelligence.status, pythia.intelligence.selftest, pythia.intelligence.maintenance, pythia.intelligence.autonomous, pythia.intelligence.engineer, pythia.intelligence.cognition_solve, pythia.agentic, pythia.campaign, pythia.knowledge, pythia.system.verify.read, pythia.system.verify.start, toe.collapse]
    impersonation_allowed: false
  - dependency: hyba_db.store
    on_unavailable: tenant-scoped security state unavailable → guardian posture fails closed
    affected: [al_haras.guardian, al_haras.security.status, al_haras.security.subscribe, al_haras.security.evaluate]
    impersonation_allowed: false
  - dependency: pythia.worker_heartbeat
    on_unavailable: worker-derived surfaces degrade to unavailable sections; counters never fabricated
    affected: [pythia.readiness, pythia.ready_to_mine, pythia.metrics, pythia.status, pythia.mining.control, pythia.mining.evidence, pythia.telemetry, pythia.telemetry.stream, pythia.agentic, pythia.campaign]
    impersonation_allowed: false
  - dependency: pythia.boot_audit
    on_unavailable: audit reads show empty tail; mutations that must audit fail rather than proceed silently
    affected: [pythia.readiness, pythia.status, pythia.audit.tail, pythia.system.map, pythia.config.update, pythia.intelligence.selftest, pythia.intelligence.maintenance, pythia.system.verify.start, pythia.cli.api]
    impersonation_allowed: false
  - dependency: pythia.runtime_config_file
    on_unavailable: config surfaces report not_configured; updates reject atomically
    affected: [pythia.config.read, pythia.config.update]
    impersonation_allowed: false
  - dependency: salamander.control_plane
    on_unavailable: fault remediation commands refuse; healing stops, it does not improvise
    affected: [salamander.fault]
    impersonation_allowed: false
  - dependency: pythia.health
    on_unavailable: the serving process itself is down; every surface fails by connection refusal, never a body lie
    affected: [legacy.api_health]
    impersonation_allowed: false

# ---------------------------------------------------------------------------
# Recovery objectives (§23) — measure first; unmeasured is declared, not set.
# ---------------------------------------------------------------------------
recovery_objectives:
  R0:
    rto: owner-approved after measurement — currently UNMEASURED
    rpo: zero for committed records (append-only/content-addressed)
    restart_behavior: state reconstructed from durable records; verify() before serving custody truth
    replay: deterministic replay from records required
    state_source: THESEUS store + boot audit
  R1:
    rto: UNMEASURED — measure current recovery first
    rpo: worker metrics granularity (sidecar ttl 30s)
    restart_behavior: boot audit + worker respawn; stratum reconnect bounded
    replay: session rebuild from pool notify stream; no replayed share submits
    state_source: runtime_config_file + sidecars + pool session
  R2:
    rto: UNMEASURED
    rpo: per-request
    restart_behavior: stateless recomputation; certificates re-verify
    replay: replayable deterministic requests
    state_source: caller request + THESEUS custody
  R3:
    rto: UNMEASURED
    rpo: per-remediation record
    restart_behavior: bounded remediation with rollback path
    replay: remediation steps re-verifiable
    state_source: THESEUS evidence + control plane state
  R4:
    rto: n/a — projections rebuild
    rpo: n/a
    restart_behavior: reproject from authoritative sources
    replay: n/a
    state_source: authoritative services

# ---------------------------------------------------------------------------
# Resilience maturity model (§29)
# ---------------------------------------------------------------------------
resilience_maturity:
  levels:
    LEVEL_0: unknown
    LEVEL_1: implemented
    LEVEL_2: monitored
    LEVEL_3: tested recovery
    LEVEL_4: fault-injected / resilient by design
  target: R0/R1 critical journeys at LEVEL_3 minimum, LEVEL_4 where safely testable
  rule: an interface is not resilient merely because it has a retry loop

# ---------------------------------------------------------------------------
# Evidence classes (§35). A claim is valid only at a class actually observed.
# ---------------------------------------------------------------------------
evidence_classes:
  - SOURCE_PRESENT
  - SOURCE_WIRED
  - LOCAL_TEST_PASSED
  - LOCAL_HTTP_E2E_EXECUTED
  - LOCAL_CROSS_SERVICE_EXECUTED
  - FAULT_INJECTION_EXECUTED
  - RECOVERY_EXECUTED
  - INSTALLED_ARTIFACT_EXECUTED
  - M3_RUNTIME_OBSERVED
  - CI_EXECUTED
  - LIVE_POOL_OBSERVED
  - PHYSICAL_DEVICE_OBSERVED
  - PERFORMANCE_MEASURED
  - POOL_ACCEPTANCE_OBSERVED
unavailable_markers:
  - CI_UNAVAILABLE      # not pass and not fail
  - M3_UNAVAILABLE      # no M3 device in this environment
  - LIVE_POOL_NOT_OBSERVED

# ---------------------------------------------------------------------------
# Fault-injection scenario register (§22). Docs and tests read the same
# register: a scenario without a passing proof test renders as UNPROVEN,
# never as success. proof_test is file::Class.method.
# ---------------------------------------------------------------------------
fault_injection_scenarios:
  - id: fi.guardian.deny_mutation
    target: al_haras.guardian
    injection: privileged POST arrives with no subscription credentials
    expected: signed denial receipt, failure_class FORBIDDEN or UNAUTHORISED, zero mutation committed
    proof_test: tests/test_fault_injection.py::WireFaultInjectionTests.test_fi_guardian_deny_mutation
    status: EXECUTED
  - id: fi.theseus.custody_absent
    target: theseus.custody
    injection: custody store not mounted in the serving environment
    expected: custody component reports not_mounted; no false custody completion
    proof_test: tests/test_fault_injection.py::WireFaultInjectionTests.test_fi_theseus_custody_absent
    status: EXECUTED
  - id: fi.stratum.disconnect
    target: stratum.v1
    injection: configured pool endpoint is unreachable
    expected: stratum component reports disconnected; no fabricated mining progress
    proof_test: tests/test_fault_injection.py::WireFaultInjectionTests.test_fi_stratum_disconnect
    status: EXECUTED
  - id: fi.remote_gpu.breaker_opens
    target: chronus.remote_opencl_v2
    injection: remote endpoint unreachable for consecutive calls
    expected: RemoteCircuitBreaker opens at threshold; calls fail fast DEPENDENCY_UNAVAILABLE; no fallback authority is granted
    proof_test: tests/test_fault_injection.py::CircuitBreakerTests.test_fi_remote_gpu_breaker_opens
    status: EXECUTED
  - id: fi.remote_gpu.half_open_probe
    target: chronus.remote_opencl_v2
    injection: endpoint still dead when recovery timeout elapses
    expected: exactly one half-open probe is admitted; failure re-opens the breaker
    proof_test: tests/test_fault_injection.py::CircuitBreakerTests.test_fi_remote_gpu_half_open_probe
    status: EXECUTED
  - id: fi.request.duplicate
    target: pythia.control_api
    injection: identical Idempotency-Key submitted twice inside the retention window
    expected: recorded outcome replayed with idempotent_replay; no re-execution
    proof_test: tests/test_fault_injection.py::WireFaultInjectionTests.test_fi_request_duplicate
    status: EXECUTED
  - id: fi.request.oversized
    target: pythia.control_api
    injection: request body beyond _TOE_MAX_BODY_BYTES
    expected: 413 with failure_class INVALID_REQUEST
    proof_test: tests/test_fault_injection.py::WireFaultInjectionTests.test_fi_request_oversized
    status: EXECUTED
  - id: fi.request.malformed_json
    target: pythia.control_api
    injection: invalid JSON body on a mutating route
    expected: 400 with failure_class INVALID_REQUEST
    proof_test: tests/test_fault_injection.py::WireFaultInjectionTests.test_fi_request_malformed_json
    status: EXECUTED
  - id: fi.request.broken_correlation
    target: pythia.control_api
    injection: malformed correlation id in request headers
    expected: id replaced by a minted one — never trusted as-is
    proof_test: tests/test_service_constitution.py::ConstitutionWireTests.test_correlation_envelope_is_complete
    status: EXECUTED
  - id: fi.backend.unconfigured
    target: kellogg.tensor.runtime
    injection: specialist backend not configured in this environment
    expected: routes report NOT_CONFIGURED/DEPENDENCY_UNAVAILABLE — no fabricated specialist answer
    proof_test: tests/test_fault_injection.py::WireFaultInjectionTests.test_fi_backend_unconfigured
    status: EXECUTED
  - id: fi.telemetry.reordered
    target: pythia.telemetry.stream
    injection: client replays a stale last_seq cursor
    expected: only events with seq > last_seq are emitted; reordered/duplicate frames never re-delivered
    proof_test: tests/test_fault_injection.py::WireFaultInjectionTests.test_fi_telemetry_reordered
    status: EXECUTED
  - id: fi.turing.unavailable
    target: turing.vqc_pipeline
    injection: TURING pipeline absent from the serving environment
    expected: consumers receive typed unavailable — no turing answer is fabricated
    proof_test: tests/test_fault_injection.py::WireFaultInjectionTests.test_fi_turing_refusal
    status: EXECUTED
  - id: fi.m3.runtime
    target: chronus.remote_opencl_v2
    injection: M3 hardware acceleration path
    expected: —
    proof_test: none
    status: M3_UNAVAILABLE

recovery_scenarios:
  - id: rc.restart.clean
    target: pythia.control_api
    injection: control API restarted over the same state directory
    expected: readiness/stratum/custody components report the same honest post-restart truth; no state invented
    proof_test: tests/test_stateful_recovery.py::StatefulRecoveryTests.test_rc_restart_clean
    status: EXECUTED
  - id: rc.partial_write.config
    target: pythia.runtime_config_file
    injection: runtime config file contains truncated/corrupt JSON
    expected: config surface reports the corruption; readiness degrades honestly; no crash, no silent default
    proof_test: tests/test_stateful_recovery.py::StatefulRecoveryTests.test_rc_partial_write_config
    status: EXECUTED
  - id: rc.duplicate_delivery
    target: pythia.control_api
    injection: same mutating request re-delivered inside the idempotency window
    expected: replay returns the recorded outcome without re-execution
    proof_test: tests/test_stateful_recovery.py::StatefulRecoveryTests.test_rc_duplicate_delivery
    status: EXECUTED
  - id: rc.reordered_delivery
    target: pythia.telemetry.stream
    injection: event cursor rewound (stale last_seq)
    expected: seq-gated emission — duplicates are not re-sent
    proof_test: tests/test_stateful_recovery.py::StatefulRecoveryTests.test_rc_reordered_delivery
    status: EXECUTED
  - id: rc.atomic_write.ports
    target: pythia.control_api
    injection: shared port file rewritten while readers race it
    expected: tmp+os.replace atomic publication; readers never see a torn write
    proof_test: tests/test_stateful_recovery.py::StatefulRecoveryTests.test_rc_atomic_write_ports
    status: EXECUTED
  - id: rc.m3.recovery
    target: chronus.remote_opencl_v2
    injection: M3 host failover
    expected: —
    proof_test: none
    status: M3_UNAVAILABLE
