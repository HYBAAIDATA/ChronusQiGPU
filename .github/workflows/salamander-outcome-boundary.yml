name: Salamander outcome boundary (contract evidence only)
on:
  pull_request:
    paths:
      - 'salamander/**'
      - 'tests/test_salamander_autonomic.py'
      - 'tests/test_salamander_outcome_evidence.py'
      - 'scripts/salamander_evidence_mutation.py'
      - '.github/workflows/salamander-outcome-boundary.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract-and-planted-defects:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pytest==9.1.1
      - run: python -m pytest -q tests/test_salamander_autonomic.py tests/test_salamander_outcome_evidence.py
      - run: python scripts/salamander_evidence_mutation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: salamander-contract-evidence-not-production-qualification
          path: reports/salamander_evidence_mutations.json
