name: Azure packaging
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Bicep without deploying resources
        run: az bicep build --file deploy/azure/main.bicep --outfile /tmp/pythia-arm.json
  container:
    name: Docker live smoke — deploy image against a scripted pool
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build Azure control image
        run: docker build -f deploy/azure/Dockerfile -t pythia-control:ci .
      - name: Live smoke (boot, operator start, pool session, device path, evidence)
        run: python3 scripts/docker_smoke.py --image pythia-control:ci --seconds 150 --out smoke-artifacts
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-live-smoke
          path: smoke-artifacts/
          if-no-files-found: warn
