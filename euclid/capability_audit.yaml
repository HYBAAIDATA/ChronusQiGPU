# Capability audit for the intelligence-elevation programme (initial pass).
# Classification vocabulary: CANONICAL | ADAPT | MERGE | SUPERSEDE |
# RESEARCH_ONLY | REMOVE_FROM_ACTIVE_PATH | UNAUDITED.
# Rule: nothing is deleted; unique capability is never removed without an
# equivalence proof.  UNAUDITED modules keep their current status and are
# listed so the next audit pass has an explicit queue.
schema: euclid.capability-audit/1
base_sha: bf6972f928b38f3a3f9c5ff2618970ef913e3e15
audited_by: intelligence-elevation stage-1 (evidence-backed where cited)

capabilities:
