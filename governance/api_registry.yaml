# ---------------------------------------------------------------------------
# Wire protocols — external transports, distinct from the HTTP control API.
# ---------------------------------------------------------------------------
  - api_id: stratum.v1
    owner: POOL
    interface_type: WIRE_PROTOCOL
    implementation_path: chronus/mla1517_platform/python/manifold_pool_coordinator.py::StratumClient
    consumers: [agentic-mining worker]
    method: 'mining.subscribe → mining.authorize → mining.notify (+ set_difficulty) → job → mining.submit → literal pool result'
    path: 'stratum+tcp:// / stratum+ssl:// endpoint from pool catalog'
    request_schema: 'JSON-RPC Stratum V1 methods'
    response_schema: 'literal pool replies; submit result is a boolean verdict'
    schema_version: stratum.v1
    authentication_class: WIRE_TOKEN
    authorisation_authority: POOL
    truth_class: VERDICT
    side_effects: submits shares only via the SHA256d proof boundary
    custody_requirement: submission/pool-outcome evidence in worker metrics
    timeout: per-request transport timeout
    idempotency: mining.submit is NEVER auto-retried — an unknown prior outcome cannot be safely replayed without protocol idempotency
    retry: 'subscribe/authorize/notify handling retry via reconnect; submit only by explicit canonical resubmission policy'
    failure_semantics: StratumProtocolError/StratumAuthorizationError; malformed reply/duplicate or unknown request id/job replacement all handled explicitly
    availability_semantics: pool acceptance is established ONLY by the literal pool response — never by socket write or local SHA256d pass
    stability: stable
    deprecation_state: CANONICAL
    tests: [chronus/mla1517_platform/python/test_pool_only_mining.py, tests/test_b_pool_outcomes.py]

  - api_id: chronus.remote_opencl_v2
    owner: CHRONUS
    interface_type: WIRE_PROTOCOL
    implementation_path: chronus/mla1517/remote_gpu.py (client) + chronus/mla1517/remote_gpu_agent.py (server)
    consumers: [chronus.delivery cloud_instance, hybrid solver]
    transport: HTTP(S)
    method: 'GET /v1/health; GET /v1/devices; GET /v1/telemetry; POST /v1/ladder; POST /v1/sha256d'
    path: 'MLA1517_REMOTE_GPU_ENDPOINT / HYBA_REMOTE_OPENCL_ENDPOINTS'
    request_schema: 'remote_opencl_v2 envelopes; sha256d window ≤2^24 nonces, batch ≤2^20'
    response_schema: '{protocol: remote_opencl_v2, ...}; attestation token binds sha256d results to the job'
    schema_version: remote_opencl_v2
    authentication_class: WIRE_TOKEN
    authorisation_authority: CHRONUS
    truth_class: EVIDENCE
    side_effects: remote device execution
    custody_requirement: re-derived exact verification is the evidence
    timeout: 'DEFAULT_TIMEOUT_S=5 probes; SHA256D_DEFAULT_TIMEOUT_S=300 scans'
    idempotency: ladder/sha256d are pure computations — replay safe
    retry: probe_first_reachable rotates endpoints; results always re-verified
    failure_semantics: wrong protocol version rejected; tampered results fail re-verification; unreachable/deviceless endpoints report honest unavailability — no fabricated devices, no silent fallback
    availability_semantics: imported devices are measured, never declared
    stability: stable
    deprecation_state: CANONICAL
    tests: [chronus/mla1517_platform/python/test_remote_gpu.py, tests/test_chronus_delivery.py, tests/test_remote_hasher.py]

