name: EUCLID swarm leader qualification

on:
  pull_request:
    paths:
      - "euclid/swarm_evolution.py"
      - "euclid/quantum_supposition.py"
      - "tests/test_euclid_quantum_supposition.py"
      - "euclid/commercial/team_orchestrator.py"
      - "euclid/swarm_curriculum.py"
      - "tests/test_euclid_swarm_*.py"
      - ".github/workflows/euclid-swarm-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swarm-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install in-tree enterprise dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy sympy PyYAML "cryptography>=46,<51" pytest hypothesis
          python -m pip install --no-deps -e ./turing_universal_quantum_computer
      - name: Compile EUCLID swarm and qualification tests
        run: python -m compileall -q euclid/swarm_evolution.py euclid/swarm_curriculum.py tests/test_euclid_swarm_*.py
      - name: Unit, adversarial, property, restart, integration and end-to-end tests
        run: python -m pytest -q tests/test_euclid_swarm_evolution.py tests/test_euclid_swarm_curriculum.py tests/test_euclid_swarm_property.py tests/test_euclid_swarm_signed_registry.py tests/test_euclid_swarm_commercial.py tests/test_euclid_quantum_supposition.py
