# PYTHIA on Docker Desktop + WSL2: one supervisor, every pool.
#   docker compose -f docker-compose.pools.yml up -d --build
# pythia-main runs the control API and supervises the mining, Salamander and
# discovery workers in-process. The pool comes from the env file
# (PYTHIA_POOL_PROFILE, and PYTHIA_POOLS for failover order; see
# pool_catalog.py). One supervisor per device keeps one hashrate governor,
# so the operator cap and the 1%-of-network cap hold for the whole host.
# Credentials are supplied by the ignored env file referenced below.
#
# WSL2/dxgkrnl caveat: a docker stop that lands while an OpenCL op is in flight
# leaves the worker in uninterruptible sleep and wedges the container + device.
# Always drain through the control API before stopping:
#   curl -X POST http://127.0.0.1:${PYTHIA_CONTROL_HOST_PORT:-8377}/api/v1/mining/stop
#   (workers finish their window and stop; /readyz then reports not ready)
#   docker stop pythia-main
x-main-common: &main-common
  build:
    context: .
    dockerfile: Dockerfile
  init: true
  # External watcher for pythia-main only; worker restarts remain in-process.
  restart: "on-failure:5"
  working_dir: /app
  devices:
    - "/dev/dxg:/dev/dxg"
  volumes:
    - "/usr/lib/wsl:/usr/lib/wsl:ro"
  environment:
    PYTHIA_HOST: 0.0.0.0
    PYTHIA_PORT: 3000
    PYTHIA_HASH_BACKEND: opencl
    PYTHIA_AUTOSTART_WORKERS: "1"
    MLA1517_MMIO_DEVICE: /dev/dxg
    MLA1517_MODE: mla1517_gpu
    MLA1517_GPU_BACKEND: opencl
    MLA1517_SALAMANDER_ENABLE: "1"
    MLA1517_EUCLIDCORE_ENABLE: "1"
    HYBA_REQUIRE_HYBA: "1"
    LD_LIBRARY_PATH: /usr/lib/wsl/lib
    # Docker Desktop/WSL2 commonly presents overlayfs/bind mounts: tolerate
    # EINVAL from directory fsync while retaining file fsync + atomic rename.
    PYTHIA_DIR_FSYNC_POLICY: LENIENT
  healthcheck:
    test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/readyz')"]
    interval: 10s
    timeout: 5s
    start_period: 30s
    retries: 3
  command: ["python3", "main.py", "--host", "0.0.0.0", "--port", "3000", "--web-root", "/app/dist/public"]

services:
  pythia-main:
    <<: *main-common
    container_name: pythia-main
    ports:
      - "${PYTHIA_CONTROL_HOST_PORT:-8377}:3000"
    env_file:
      - ${PYTHIA_MAIN_ENV_FILE:-.env.braiins}
    volumes:
      - "/usr/lib/wsl:/usr/lib/wsl:ro"
      - pythia_main_data:/app/data
      - pythia_hb:/run/pythia/hb

volumes:
  pythia_main_data:
    driver: local
  pythia_hb:
    driver: local
