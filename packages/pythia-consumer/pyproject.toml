[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
# Consumer surface for the PYTHIA substrate: node census, receipt
# verification, and the three-tab operator console.
#
# BUNDLE: this wheel is self-contained. `build_bundle.py` stages the
# sibling substrate sources (aethel/THESEUS, hyba_db/OVID,
# chronos_one_igpu/iGPU) into src/ at build time because they are not yet
# published distributions. The wheel must NOT be co-installed with the
# singular sibling wheels — top-level namespaces (aethel, hyba_db,
# chronos_one_igpu) would collide on file ownership.
# NOTE: distribution name follows the owner-approved `hyba-<system>-<capability>`
# rule and is registered in packaging/publication_catalog.json.
# First public release is 1.0.0 (owner decision 2026-10-07).
name = "hyba-pythia-consumer"
version = "1.0.0"
description = "PYTHIA consumer console — node census, receipt verification, intelligence surface, bundled substrate"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "HYBA Software Limited"}]
requires-python = ">=3.10"
dependencies = ["numpy>=2.1,<3", "sympy>=1.14,<2"]
classifiers = ["Programming Language :: Python :: 3", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13", "Topic :: Scientific/Engineering :: Mathematics"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["pythia_consumer*", "aethel*", "hyba_db*", "chronus*"]

[tool.setuptools.package-data]
pythia_consumer = ["console.html", "bundled_products.json", "companion/*"]
chronus = ["igpu/spec/*.json", "igpu/spec/*.md", "igpu/kernels/*.cl", "igpu/spec/source_notes/*.txt", "igpu/spec/source_notes/*.json", "igpu/native/*.c"]

[project.optional-dependencies]
apple = ["mlx>=0.25; platform_system == 'Darwin' and platform_machine == 'arm64'", "coremltools>=8.3; platform_system == 'Darwin'"]
dev = ["pytest>=8,<10", "build>=1.2,<2", "twine>=6,<7"]

[project.scripts]
pythia = "pythia_consumer.cli:main"

[project.urls]
Homepage = "https://github.com/QuantumPhiRedux/PhiMiner"
Issues = "https://github.com/QuantumPhiRedux/PhiMiner/issues"
