apiVersion: apps/v1
kind: Deployment
metadata:
  name: igpu-data-ingestion
  namespace: phienterprise
spec:
  replicas: 2
  selector:
    matchLabels:
      app: igpu-data-ingestion
  template:
    metadata:
      labels:
        app: igpu-data-ingestion
    spec:
      containers:
        - name: ingestion
          image: phienterprise/igpu-core:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: IGPU_MODE
              value: "data_ingestion"
            - name: AETHEL_STORE
              value: "/var/lib/phienterprise/aethel"
          volumeMounts:
            - name: aethel-data
              mountPath: /var/lib/phienterprise/aethel
      volumes:
        - name: aethel-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: igpu-data-ingestion
  namespace: phienterprise
spec:
  selector:
    app: igpu-data-ingestion
  ports:
    - name: http
      port: 8081
      targetPort: 8081
