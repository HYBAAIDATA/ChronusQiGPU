[project]
name = "turing-universal-quantum-computer"
version = "1.0.0"
description = "Turing Virtual Quantum Computer — exact-math VQC with bounded exact Clifford+T state vectors, arbitrary-width exact Clifford tableaux, admitted sparse/closed-form quantum mathematics, fail-closed representation and QPU boundaries, verifiable run witnesses, and an operator console."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "HYBA Software Limited" }]
keywords = ["turing", "quantum", "exact-math", "vqc", "pythia", "mla1517"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]

dependencies = [
    "numpy>=1.26,<3",
    "sympy>=1.12,<2",
    # Kellogg owns the tensor mathematics TURING executes on: exact fields,
    # state vectors, the exact MPS behind the mps_exact backend, surface-code
    # algebra. TURING consumes it instead of carrying a fork.
    "kellogg-tensor>=1.0",
]

[project.optional-dependencies]
discovery = [
    "scipy>=1.11",
    "networkx>=3.0",
]
hardware = [
    "pyopencl>=2024.1",
]
dev = [
    "pytest>=7.4,<10",
]

[project.scripts]
turing-vqc = "turing_universal_quantum_computer.console:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "turing_universal_quantum_computer",
    "turing_universal_quantum_computer.backends",
    "turing_universal_quantum_computer.turing_core",
    "turing_universal_quantum_computer.lucas",
]

[tool.setuptools.package-data]
turing_universal_quantum_computer = ["py.typed"]
