[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hyba-turing-service-control"
version = "0.2.0"
description = "Governed TURING enterprise service delivery, API, administration and metering"
requires-python = ">=3.11"
classifiers = ["Development Status :: 3 - Alpha", "Private :: Do Not Upload"]

[project.optional-dependencies]
test = ["pytest>=7.4,<10", "httpx>=0.27,<1"]
server = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "PyJWT[crypto]>=2.10,<3", "cryptography>=43,<47"]

[project.scripts]
turing-service = "hyba_turing_service.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
hyba_turing_service = ["static/*.html", "static/*.css", "static/*.js"]
