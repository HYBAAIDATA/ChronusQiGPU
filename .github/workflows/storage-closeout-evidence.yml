name: Storage and fold closeout reference
on:
  pull_request:
    paths:
      - 'src/chronus/storage/**'
      - 'src/chronus/math/fold_ledger.py'
      - 'src/chronus/research/paradigm_seal.py'
      - 'src/chronus/research/torus_certificate.py'
      - 'tests/test_paradigm_closure.py'
      - 'tests/test_chrn_frame.py'
      - 'tests/test_chrn_rs257.py'
      - 'tests/vectors/chrn_rs257_v11.json'
      - 'scripts/benchmarks/chrn_recovery_drill.py'
      - 'src/chronus/security/al_haras/reed_solomon.py'
      - 'tests/vectors/chrn_framing_provisional.json'
      - 'scripts/ci/check_paradigm_closure.py'
      - 'evidence/storage/paradigm_findings.json'
      - 'scripts/benchmarks/storage_closeout.py'
      - 'tests/test_storage_research_closeout.py'
      - 'docs/production/STORAGE_RESEARCH_CLOSEOUT_20261116.md'
      - '.github/workflows/storage-closeout-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  storage-fold-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install project and pytest
        run: python -m pip install -e '.[test]'
      - name: Run storage, triad and research closeout tests
        run: python -m pytest -q tests/test_storage_research_closeout.py tests/test_storage.py tests/test_triad_production.py tests/test_prime_codec.py tests/test_pulvini_research_locked.py
      - name: Run exact paradigm closure evidence gate
        run: python scripts/ci/check_paradigm_closure.py --report-only --output reference-evidence/paradigm-closure.json
      - name: Run controlled reference on this commit
        run: python scripts/benchmarks/storage_closeout.py --records 64 --payload-bytes 1024 --elements 10648 --depth 20 --output-json reference-evidence/storage-fold-reference.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: storage-fold-reference
          path: |
            reference-evidence/storage-fold-reference.json
            reference-evidence/paradigm-closure.json
          if-no-files-found: error

  chrn-recovery-drill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install project and pytest
        run: python -m pip install -e '.[test]'
      - name: Protected frame acceptance
        run: python -m pytest -q -rs tests/test_chrn_frame.py tests/test_chrn_rs257.py
      - name: Measure exact-head recovery
        run: python scripts/benchmarks/chrn_recovery_drill.py --output-dir recovery-evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: chrn-recovery-drill
          path: recovery-evidence/chrn_recovery_*.json
          if-no-files-found: error
