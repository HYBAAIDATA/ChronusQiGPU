name: One-shot scratch clean-up (removed in the same pull request)

# Runs once, on the push that adds this file to cowork-systems/restore-main-ci-20261111.
# It removes the scratch directories that #27, #31 and #32 merged into main, then
# this file is deleted in the same pull request. Workflow files cannot be removed
# with the job token, so the two scratch workflows are removed through the API.

on:
  push:
    branches: [cowork-systems/restore-main-ci-20261111]
    paths: ['.github/workflows/cleanup-scratch.yml']

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: cowork-systems/restore-main-ci-20261111
          fetch-depth: 0
      - name: Remove scratch directories merged into main by #27, #31 and #32
        run: |
          git config user.name "hybadatadevops1"
          git config user.email "devops@hybadata.ae"
          git rm -r -q --ignore-unmatch .workbench .payload .supervisor
          if git diff --cached --quiet; then
            echo "nothing to remove"
            exit 0
          fi
          git commit -q -m "Remove scratch files merged into main by #27, #31 and #32" \
            -m "Scratch directories .workbench/ (#27, #31), .payload/ (#31) and .supervisor/ (#32) were merged into main with their branches. They are working material for scratch branches that were never meant to merge; the branches themselves keep their copies."
          git push origin HEAD:cowork-systems/restore-main-ci-20261111
          git log --oneline -3
