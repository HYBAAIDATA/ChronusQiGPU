[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hyba-chronus"
dynamic = ["version"]
description = "Chronus: the HYBA Data exact-computation platform (internal distribution; TURING ships separately as hyba-turing)"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Private :: Do Not Upload",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    # 48.0 is the first release whose wheels provide ML-DSA (FIPS 204), used by
    # AL HARAS receipts and the v36 receipt signer.
    "cryptography>=48.0",
    "fastapi>=0.162.2,<0.163",
    "starlette>=1.3.1,<2",
    "httpx>=0.28,<1",
    "pydantic>=2.9,<3",
    "uvicorn[standard]>=0.27",
    "pyyaml>=6,<7",
    "PyJWT[crypto]>=2.8,<3",
    "opentelemetry-api>=1.25,<2",
    "opentelemetry-sdk>=1.25,<2",
    "SQLAlchemy>=2.0,<3",
    "greenlet>=3.0.0",
    "numpy>=1.26,<3",
    "scipy>=1.10,<2",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "tomli>=1.1; python_version < '3.11'",
]
mining = ["hyba-turing==0.2.0.dev0"]
# Optional local mathematical workbench, dependent on the separately built
# TURING distribution; install its wheel in the environment first.
workbench = [
    "hyba-turing==0.2.0.dev0",
    "ipywidgets>=8,<9",
    "ipython>=8,<10",
    "matplotlib>=3.8,<4",
]
dev = [
    "prometheus-client>=0.20,<1",
    "pyyaml>=6,<7",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "tomli>=1.1; python_version < '3.11'",
    "hypothesis>=6.100",
    "PyYAML>=6,<7",
    "numpy>=1.26,<3",
    "joblib>=1.3",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    # Lets tests/test_wiring_entrypoints.py replay migrations against store metadata.
    "alembic>=1.13",
]
ml = [
    "joblib>=1.3",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
]
postgres = [
    "asyncpg>=0.29",
    "alembic>=1.13",
]
accelerator = [
    "numpy>=1.26,<3",
    "pyopencl>=2024.1",
]
fleet-metal = [
    "mlx>=0.25; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
fleet-metal-pyobjc = [
    "pyobjc-framework-Metal>=10; sys_platform == 'darwin'",
]
fleet-opencl = [
    "pyopencl>=2024.1",
]

[project.scripts]
chronus-fleet = "chronus.fleet.cli:main"
ga-api = "ga.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "chronus.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["chronus*", "ga*"]

[tool.setuptools.package-data]
"chronus.kernels" = ["*.cl"]
"chronus.licensing" = ["trust_store.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "packages/turing/src"]
addopts = "--basetemp=.pytest_temp"
markers = [
    "real: executes production code without mocked behaviour; not hardware/deployment proof",
    "simulated: uses test doubles, synthetic harnesses or controlled fakes; not runtime evidence",
]
