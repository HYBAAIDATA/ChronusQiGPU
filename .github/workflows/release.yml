name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-attest-release:
    name: Build, attest and publish release
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      actions: read
      contents: write       # create the GitHub Release
      id-token: write       # Sigstore/Fulcio OIDC signing
      attestations: write   # publish in-toto attestations
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Install build tooling
        run: python -m pip install -e . build twine cyclonedx-bom

      - name: Enforce signed, commit-matched PASS qualification
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/ci/require_release_qualification.py
          --repository '${{ github.repository }}'
          --commit '${{ github.sha }}'
          --verified-verdict-output qualification-evidence/ci-verdict.json
          --provenance-output qualification-evidence/attestation-verification-receipt.json

      - name: Build distribution
        run: python -m build

      - name: Verify distribution metadata
        run: twine check dist/*

      - name: Generate CycloneDX SBOM
        run: cyclonedx-py environment --of JSON -o sbom.cdx.json

      - name: Assemble qualification dossier
        run: |
          set -euo pipefail
          mkdir -p dossier
          # Include only the exact signed verdict checked above, not stale checkout manifests.
          test -s qualification-evidence/ci-verdict.json
          test -s qualification-evidence/attestation-verification-receipt.json
          cp -r qualification-evidence dossier/qualification-evidence
          cp sbom.cdx.json dossier/
          (cd dist && sha256sum *) | tee dossier/SHA256SUMS.txt
          tar -czf chronus-${{ github.ref_name }}-qualification-dossier.tar.gz -C dossier .

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      # Keyless Sigstore signing works on private repos today (public Fulcio
      # certificate + Rekor transparency log entry per artifact).
      - name: Sign release artifacts with Sigstore keyless
        run: |
          set -euo pipefail
          for artifact in dist/* sbom.cdx.json chronus-${{ github.ref_name }}-qualification-dossier.tar.gz; do
            cosign sign-blob --yes --bundle "${artifact}.sigstore.json" "${artifact}"
          done

      # Missing release provenance is a failed release, not a green warning.
      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: |
            dist/*
            sbom.cdx.json
            chronus-${{ github.ref_name }}-qualification-dossier.tar.gz

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Chronus ${{ github.ref_name }}" \
            --generate-notes \
            --verify-tag \
            dist/* \
            sbom.cdx.json \
            sbom.cdx.json.sigstore.json \
            chronus-${{ github.ref_name }}-qualification-dossier.tar.gz \
            chronus-${{ github.ref_name }}-qualification-dossier.tar.gz.sigstore.json
