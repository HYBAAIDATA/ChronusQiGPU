name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install HYBA MCP minimal dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy>=1.26,<3"
          python --version
          python -c "from hyba_mcp.server import HybaMCPServer; s=HybaMCPServer(); print(s.handle_request({'jsonrpc':'2.0','id':1,'method':'tools/list','params':{}}))"
