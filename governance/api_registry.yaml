# PYTHIA canonical API & service-communication registry.
#
# This file is the authoritative machine-readable contract for every
# production API/service interface in the repository.  It is the contract
# against which implementation is tested (tests/test_production_api_contract.py
# enumerates it); it is not generated from route scraping — routes and
# interfaces are tested against what is declared here.
#
# Ownership model is the frozen canonical authority register (section 0 of
# the production API closure spec); no entry here may move it.

schema: pythia.api_registry/1
repository: QuantumPhi2/PhiMiner
baseline_sha: f50f2e97fb850f83dc68c2b0713d6fcfd75e53e8

authority_register:
  EUCLID: intelligence orchestration
  PYTHIA: predictive/causal intelligence, mining intelligence, final SearchPlan
  TURING: independent VQC
  KELLOGG: tensor capability
  CHRONUS: heterogeneous execution
  THESEUS: durable custody, integrity, continuity, records, recovery, provenance
  OVID: representation/state transformation and transform lineage
  SALAMANDER: bounded self-healing and optimisation
  AL_HARAS: security, identity, capability, authorisation, governance
  SHA256D_VERIFIER: candidate validity
  POOL: external share acceptance
  HYBA_DB: tenant-scoped ontology/query/projection persistence

interface_types:
  - HTTP_PUBLIC          # unauthenticated read-only operational truth
  - HTTP_OPERATOR        # operator-console surface; mutations need operator auth
  - HTTP_PRIVILEGED      # AL HARAS guardian-mediated
  - INTERNAL_PYTHON      # typed in-process contract; no transport
  - WIRE_PROTOCOL        # external wire protocol (Stratum V1, remote_opencl_v2)
  - EVENT_STREAM         # SSE stream
  - FILE/ARTIFACT_CONTRACT  # on-disk contract between processes
  - CLI                  # command-line entrypoint
  - RESERVED_NAMESPACE   # secured prefix reserved by design; no implementation
  - LEGACY               # compatibility alias kept for older clients

authentication_classes:
  NONE: no credential required (read-only operational truth)
  OPERATOR_PRINCIPAL: PYTHIA_OPERATOR_PRINCIPALS_JSON principal, or EUCLID_ADMIN_API_KEY bearer, or PYTHIA_ALLOW_UNAUTHENTICATED_CONTROL dev flag
  AL_HARAS_SUBSCRIPTION: X-HYBA-Tenant + X-HYBA-Actor + Bearer subscription token issued by SubscriptionAuthority, mediated by pythia_guardian_api
  WIRE_TOKEN: transport credential of the wire protocol (bearer token / stratum worker credentials)
  TYPED_CALL: in-process typed interface — authority model carried by the caller
  TENANT_SCOPED: tenant-scoped persistence boundary (HYBA_DB)
  FILESYSTEM: OS file permissions on the artifact path
  HMAC_SIDECAR: HMAC-signed heartbeat sidecar (PYTHIA_IDENTITY_HMAC_SECRET)
  ENVIRONMENT: process environment of the CLI

truth_classes:
  - LIVENESS              # process serving
  - READINESS             # declared dependency/config readiness
  - RUNTIME_OBSERVATION   # measured runtime state; unavailable stays unavailable
  - COMMAND_ACCEPTANCE    # request accepted by the authority; not an outcome claim
  - VERDICT               # an authority's decision on a request
  - EVIDENCE              # custody-grade evidence record
  - CONFIGURATION         # declared (not observed) configuration

# ---------------------------------------------------------------------------
# HTTP control-plane surface (chronus/mla1517_platform/python/control_api.py)
# ---------------------------------------------------------------------------
apis:

  - api_id: pythia.health
    owner: PYTHIA
    interface_type: HTTP_PUBLIC
    implementation_path: chronus/mla1517_platform/python/control_api.py::_route_get
    consumers: [operator-console, load-balancer]
    transport: HTTP
    method: GET
    path: /api/v1/healthz
    routes: ["GET /api/v1/healthz", "GET /api/health", "GET /healthz"]
    aliases:
      - path: /api/health
        status: LEGACY
      - path: /healthz
        status: LEGACY
    request_schema: none
    response_schema: '{schema_version, status, generated_at}'
    schema_version: chronus.mla1517.status/1
    authentication_class: NONE
    authorisation_authority: none
    truth_class: LIVENESS
    side_effects: none
    custody_requirement: none
    timeout: immediate
    idempotency: read-only
    retry: freely retryable
    failure_semantics: process down = connection refused; never a body lie
    availability_semantics: serving process implies live
    stability: stable
    deprecation_state: CANONICAL
    tests: [tests/test_production_api_contract.py]

