version: "3.8"

services:
  # Chronus Quantum iGPU CIaaS Service
  chronus-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chronus-quantum-igpu-api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - THESISUS_DB_HOST=postgres
      - THESISUS_DB_PORT=5432
      - THESISUS_DB_DATABASE=chronus_quantum
      - THESISUS_DB_USERNAME=chronus
      - THESISUS_DB_PASSWORD=chronus
      - THESISUS_POOL_SIZE=20
      - THESISUS_MAX_OVERFLOW=10
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - chronus_data:/app/data
    networks:
      - chronus-network

  # PostgreSQL Database (Thesus)
  postgres:
    image: postgres:15-alpine
    container_name: chronus-postgres
    restart: always
    environment:
      - POSTGRES_USER=chronus
      - POSTGRES_PASSWORD=chronus
      - POSTGRES_DB=chronus_quantum
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/chronus/database/migrations:/docker-entrypoint-initdb.d
    networks:
      - chronus-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chronus -d chronus_quantum"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (Cache & Rate Limiting)
  redis:
    image: redis:7-alpine
    container_name: chronus-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - chronus-network
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

  # Prometheus (Metrics)
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: chronus-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
    networks:
      - chronus-network

  # Grafana (Dashboards)
  grafana:
    image: grafana/grafana:10.1.0
    container_name: chronus-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=chronus123
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - chronus-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  chronus-network:
    driver: bridge
