name: Chronos M5 bounded installed contract checks
on:
  pull_request:
    paths:
      - 'chronus/m5_ultra.py'
      - 'packages/chronos-one-igpu/**'
      - '.github/workflows/chronos-m5-package.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installed-package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
        variant: [native, portable]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'build>=1.2,<2' 'twine>=6,<7'
      - run: python packages/chronos-one-igpu/scripts/verify_m5_package.py --variant ${{ matrix.variant }} --skip-benchmark --contract-rc-sha ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chronos-m5-${{ matrix.python }}-${{ matrix.variant }}-${{ github.sha }}
          path: packages/chronos-one-igpu/dist/m5-${{ matrix.variant }}/
# No registry credentials or publication step. These are scoped package checks,
# not the whole-product production-certification gate.

  cross-runner-replay:
    needs: installed-package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: chronos-m5-3.13-portable-${{ github.sha }}
          path: incoming
      - name: Install previously built portable artifact
        run: python -m pip install incoming/*.whl
      - name: Replay producer evidence on another runner context
        run: |
          HASH=$(sha256sum incoming/wheel-ultra-contract.json | cut -d' ' -f1)
          python -I packages/chronos-one-igpu/scripts/replay_m5_ultra_evidence.py --source-report incoming/wheel-ultra-contract.json --report-sha256 "$HASH" --rc-sha "${{ github.sha }}" --output cross-runner-replay.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chronos-cross-runner-replay-${{ github.sha }}
          path: cross-runner-replay.json
# Cross-runner replay validates arithmetic and producer identity bindings. It is
# not INTERNAL_INDEX installation or trusted release-key signing evidence.
