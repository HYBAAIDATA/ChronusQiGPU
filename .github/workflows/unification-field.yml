name: Unification field prototype
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  field:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install 'pytest>=7' 'pytest-cov>=4' 'hypothesis>=6.100'
      - name: Field prototype tests and branch coverage
        env:
          PYTHONPATH: src
        run: python -m pytest tests/unification -v --cov=hyba.unification.field --cov-branch --cov-fail-under=90 --cov-report=term-missing --cov-report=xml:unification-field-coverage.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: unification-field-coverage
          path: unification-field-coverage.xml
          if-no-files-found: warn
