name: PULVINI Research Contract
on:
  pull_request:
    paths:
      - 'src/chronus/pulvini/**'
      - 'tests/test_pulvini_research_locked.py'
      - 'tools/verify_pulvini_lock.py'
      - 'docs/research/PULVINI_V3_FOLD_AUTHORITY.md'
      - '.github/CODEOWNERS'
      - '.github/workflows/pulvini-research-guard.yml'
  push:
    branches: [main]
    paths:
      - 'src/chronus/pulvini/**'
      - 'tests/test_pulvini_research_locked.py'
      - 'tools/verify_pulvini_lock.py'
      - 'docs/research/PULVINI_V3_FOLD_AUTHORITY.md'
      - '.github/CODEOWNERS'
      - '.github/workflows/pulvini-research-guard.yml'
permissions:
  contents: read
jobs:
  pulvini-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded test dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'pytest>=8,<10'
      - name: Verify immutable research operator digest
        run: python tools/verify_pulvini_lock.py
      - name: Run PULVINI research contract
        run: PYTHONPATH=src python -m pytest -q tests/test_pulvini_research_locked.py
