[project]
name = "pythia-mla1517"
version = "0.1.0"
description = "PYTHIA operational mining backend with the canonical MLA1517 execution path."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "PYTHIA Contributors" }]
keywords = ["mining", "stratum", "opencl", "mla1517", "verification"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "numpy>=1.26,<3",
    "pyyaml>=6.0,<7",
    "sympy>=1.12,<2",
    # The virtual quantum computer (in-tree: turing_universal_quantum_computer/)
    # is part of the miner: the Hendrix nonce order and the VQC policy audit.
    # Install it beside this package: pip install ./turing_universal_quantum_computer .
    "turing-universal-quantum-computer>=1.0",
]

[project.scripts]
pythia = "main:main"
pythia-api = "control_api:main"
pythia-mine = "mining_runtime:main"
pythia-gpu-readiness = "gpu.readiness:main"
pythagoras-v12 = "pythagoras.run_pythagoras:main"

[project.optional-dependencies]
hardware = [
    "pyopencl>=2024.1",
]
# Salamander's opt-in LLM repair stage (HYBA_SELF_REPAIR_LLM_ENABLED=true).
llm = [
    "anthropic>=0.45",
]
# Apple silicon accelerators (Intelligence/apple_features.py, hyba/inventory.py); macOS only.
apple = [
    "coremltools>=7.0; sys_platform == 'darwin'",
    "metalcompute>=0.2; sys_platform == 'darwin'",
    "mlx>=0.18; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
# Intelligence.asi.manifold_bridge.adjacency_to_digraph's networkx view.
graph = [
    "networkx>=3.0",
]
ml = [
    "nltk>=3.8",
    "scikit-learn>=1.3",
    # millennium.millennium_reasoning_service imports fastapi at module load.
    "fastapi>=0.110",
]
dev = [
    "pytest>=7.4,<10",
    "pytest-asyncio>=0.24,<3",
    "hypothesis>=6.0,<7",
    "black>=24.0,<27",
    "flake8>=7.0,<8",
    # self_repair measures coverage when pytest-cov is present.
    "pytest-cov>=6.1",
    "ruff>=0.8",
    "radon>=6.0",
    "mypy>=1.11",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = false
package-dir = {"" = "chronus/mla1517_platform/python", "euclid" = "euclid", "Intelligence" = "Intelligence", "mining" = "mining", "aethel" = "aethel", "gpu" = "gpu", "hyba" = "hyba", "kellogg" = "kellogg", "toe" = "toe", "python_backend" = "python_backend", "al_haras" = "al_haras", "chronus" = "chronus", "chronos" = "chronos", "quantum_compute_substrate" = "quantum_compute_substrate", "l_hras" = "l_hras", "lucas" = "lucas", "millennium" = "millennium", "tensor" = "tensor", "hyba_profiles" = "hyba_profiles", "hyba_contracts" = "hyba_contracts", "hyba_services" = "hyba_services"}
packages = ["euclid", "euclid.core", "euclid.search", "euclid.discovery", "euclid.transfer", "euclid.validation", "euclid.geometry", "euclid.surrogate", "euclid.agents", "euclid.enterprise", "euclid.benchmarks", "euclid.tests", "euclid.cognition", "Intelligence", "mining", "lucas", "millennium", "aethel", "gpu", "gpu.backends", "hyba", "hyba.hybrid", "hyba.math_ir", "hyba.operating_model", "kellogg", "toe", "toe.intelligences", "toe.unified", "python_backend", "python_backend.pythia_mining", "python_backend.mathematical_foundation", "python_backend.hyba", "python_backend.hyba.runtime", "python_backend.core_modules", "al_haras", "chronus", "chronos", "chronos.academic", "quantum_compute_substrate", "chronus.seam", "chronus.mla1517", "chronus.mla1517.mining", "chronus.v33", "chronus.v33.academic", "chronus.v33.compression", "chronus.v33.control", "chronus.v33.environment", "chronus.v33.fields", "chronus.v33.graphics", "chronus.v33.memory", "chronus.v33.theory", "chronus.v33.benchmarks", "chronus.v33.examples", "l_hras", "l_hras.foundations", "l_hras.experimental", "l_hras.experimental.blueprint", "l_hras.experimental.blueprint.core", "l_hras.experimental.blueprint.substrate", "l_hras.experimental.blueprint.fold", "l_hras.experimental.blueprint.intelligences", "l_hras.experimental.blueprint.modes", "l_hras.experimental.blueprint.modules", "l_hras.experimental.blueprint.layers", "l_hras.experimental.blueprint.floor", "l_hras.experimental.blueprint.aethel", "l_hras.experimental.blueprint.guardian", "l_hras.experimental.blueprint.mining", "l_hras.experimental.blueprint.security", "l_hras.experimental.blueprint.asic", "l_hras.experimental.blueprint.blueprint_tests", "tensor", "tensor.backends", "hyba_profiles", "hyba_contracts", "hyba_services"]
py-modules = [
    "al_haras_pythia",
    "autonomous_supervisor",
    "control_api",
    "coordinator",
    "discovery_runtime",
    "euclid_core",
    "extended_algebra",
    "headless_miner",
    "main",
    "manifold_pool_coordinator",
    "mining_runtime",
    "policy_bench",
    "pool_catalog",
    "worker_lifecycle",
    "runtime_config",
    "turing_core",
    "pythia_turing_math",
    "startup_contract",
    "system_fabric",
    "reference_test",
    "run_conformance",
    "run_cpp_host_overlay",
    "salamander_control",
    "salamander_engine",
    "telemetry_daemon",
]

[tool.setuptools.package-data]
"chronus.mla1517" = ["seeds/*.yaml"]
aethel = ["py.typed", "*.md", "capabilities.json"]
gpu = ["py.typed", "README.md", "BLUEPRINT_AUDIT.md"]
chronus = ["py.typed", "README.md", "GPU_CAPABILITY_MANIFEST.json", "kernels/*.cl", "deploy/*.yml", "spec/*.json"]
chronos = ["README.md"]
"chronus.v33" = ["CAPABILITY_MANIFEST.json", "docs/*.md", "benchmarks/*.json"]
kellogg = ["py.typed", "CAPABILITY_MANIFEST.json"]
hyba_db = ["CAPABILITY_MANIFEST.json"]
tensor = ["py.typed", "README.md", "CAPABILITY_MANIFEST.md"]
l_hras = ["py.typed", "README.md", "config.example.toml"]
toe = ["py.typed", "default_propagators.json"]
millennium = ["*.ts", "rtl/*.sv", "docs/*.md"]
python_backend = ["*.csv"]
pythagoras = ["README.md"]

[tool.pytest.ini_options]
testpaths = ["chronus/mla1517_platform/python", "tests"]

[tool.black]
line-length = 100
target-version = ["py312"]
# Vendored skill grafts are kept byte-exact (Intelligence/skill_graft.py).
extend-exclude = "Intelligence/skills/"
exclude = '''
/(
    \.git
  | \.pytest_cache
  | __pycache__
  | node_modules
  | dist
  | models
  | logs
  | legacy
  | \.venv
  | venv
)/
'''
