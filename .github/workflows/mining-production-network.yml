name: Production Mining Network Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-mining-network-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}/chronus/mla1517_platform/python:${{ github.workspace }}:${{ github.workspace }}/chronus

jobs:
  protocol-and-transport:
    name: Stratum protocol, failover, backpressure, submission, and EUCLID gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project test dependencies
        run: bash scripts/ci_install.sh "dev"
      - name: Compile canonical mining runtime
        run: >-
          python -m py_compile
          chronus/mla1517_platform/python/mining_runtime.py
          chronus/mla1517/mining/production_transport.py
          chronus/mla1517/mining/stratum_v2_transport.py
          chronus/mla1517/mining/retarget_telemetry.py
          chronus/mla1517/mining/euclid_support.py
      - name: Production transport hardening
        run: >-
          python -m unittest discover
          -s chronus/mla1517_platform/python
          -p test_production_transport.py
          -v
      - name: EUCLID mining authority boundary
        run: >-
          python -m unittest discover
          -s chronus/mla1517_platform/python
          -p test_euclid_mining_support.py
          -v
      - name: Retarget-window telemetry truth boundaries
        run: >-
          python -m unittest discover
          -s chronus/mla1517_platform/python
          -p test_retarget_telemetry.py
          -v
      - name: Canonical Stratum V1 session
        run: >-
          python -m unittest discover
          -s chronus/mla1517_platform/python
          -p test_stratum_session.py
          -v
      - name: Stratum proof and target-transition contracts
        run: >-
          python -m unittest discover
          -s chronus/mla1517_platform/python
          -p test_stratum_adapter.py
          -v
      - name: Share lifecycle and pool-only production contracts
        run: >-
          python -m pytest
          chronus/mla1517_platform/python/test_share_lifecycle.py
          chronus/mla1517_platform/python/test_pool_only_mining.py
          tests/test_mining_contract_audit.py
          -q
      - name: Stratum V1 live-session harness
        run: python -m pytest tests/test_stratum_live_session.py -q
      - name: Production identity and live-smoke safety
        run: >-
          python -m pytest
          tests/test_startup_contract.py
          tests/test_live_pool_smoke_safety.py
          -q
      - name: Stratum V2 Mining Protocol contracts
        run: python -m pytest tests/test_stratum_v2.py tests/test_braiins_sv2.py -q
      - name: Deterministic mining transport chaos
        run: python -m pytest tests/test_mining_transport_chaos.py -q
      - name: PYTHAGORAS transactional meta-evolution
        run: python -m pytest tests/test_pythagoras.py -q
