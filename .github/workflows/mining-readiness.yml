name: Mining regression checks
on:
  pull_request:
    paths:
      - src/chronus/**
      - tests/**
      - packages/hyba_mine/**
      - deploy/hyba-mine/**
      - pyproject.toml
      - Dockerfile
      - .dockerignore
      - packages/turing/**
      - tools/verify_galois_invariant.py
      - rules/ast-grep/**
      - .coderabbit.yaml
      - benchmarks/benchmark_mining.py
      - .github/workflows/mining-readiness.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e packages/turing -e '.[dev,mining]'
      - name: Authored search and Stratum regression tests (synthetic work only)
        run: >-
          python -m pytest -q tests/test_mining_env_config.py tests/test_mining_readiness.py tests/test_behavioral_live_runner.py
          tests/test_behavioral_stratum_lifecycle.py tests/test_stratum_replay.py
          tests/test_stratum_pool.py tests/test_gatekeeper.py tests/test_bip310.py
          tests/test_mining_wire_custody.py tests/test_mining_submission_policy.py
          tests/test_sharding.py tests/test_endian_engine.py tests/test_rate_limiter.py
          tests/test_geometric_galois_miner.py tests/test_extension_search.py tests/test_hendrix_galois.py
          tests/test_hendrix_oracles.py tests/test_hendrix_structured.py
          tests/test_turing.py packages/turing/tests tests/test_scaling_paths.py
          tests/test_pv_scale_fleet.py tests/test_fleet_adapters.py tests/test_lattice.py
          tests/test_folded_state.py
      - name: Exact Galois parity and measured scale arithmetic
        run: python tools/verify_galois_invariant.py --output "$RUNNER_TEMP/mining-galois-invariant.json"
      - name: Retain measured Galois parity evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mining-galois-python-${{ matrix.python }}
          path: ${{ runner.temp }}/mining-galois-invariant.json
          if-no-files-found: error
      - run: python deploy/hyba-mine/bist.py
  image-selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: docker build --target miner-runtime -t mining-base .
      - run: docker build -f deploy/hyba-mine/Dockerfile --build-arg BASE_IMAGE=mining-base -t mining-test .
      - name: Known-answer self-test with networking disabled
        run: docker run --rm --network none mining-test python /opt/hyba-mine/bist.py
      - name: Build local Stratum validation image
        run: docker build --target mining-check -t mining-check .
      - name: Synthetic Stratum and runtime checks with external networking disabled
        run: docker run --rm --network none mining-check

  paired-current-mainnet:
    name: Paired current search on 500 historical mainnet headers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -e packages/turing -e '.[dev,mining]'
      - name: Execute actual current search and independent baseline
        run: |
          python benchmarks/benchmark_mining.py --mainnet-corpus tests/vectors/mainnet_975565_976064.json --candidates 4096 --workers 1 --out "$RUNNER_TEMP/paired-current-mainnet.json"
          sha256sum "$RUNNER_TEMP/paired-current-mainnet.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: paired-current-mainnet
          path: ${{ runner.temp }}/paired-current-mainnet.json
          if-no-files-found: error
