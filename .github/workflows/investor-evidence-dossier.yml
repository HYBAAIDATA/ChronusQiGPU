name: Investor evidence dossier

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: dossier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dossier:
    name: Benchmark, certify and attest executive dossier
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write     # Sigstore/Fulcio OIDC signing
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install RTL toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y -qq yosys iverilog

      - name: Run silicon RTL known-answer testbenches
        run: |
          set -euo pipefail
          iverilog -g2012 -o tb_phi hw/tb_qigpu_phi_alu.sv hw/zeckendorf_norm_alu.sv
          ./tb_phi | tee rtl-testbench.log
          iverilog -g2012 -o tb_32lane hw/tb_zeckendorf_alu_32lane.sv hw/zeckendorf_alu_32lane.sv
          ./tb_32lane | tee -a rtl-testbench.log
          iverilog -g2012 -o tb_pv hw/tb_pv_scale_32lane.sv hw/pv_scale_32lane.sv
          ./tb_pv | tee -a rtl-testbench.log

      - name: Install Chronus v36 and report tooling
        run: python -m pip install -e . fpdf2

      - name: Execute live benchmarks and render dossier
        run: python scripts/generate_investor_dossier.py --rtl-log rtl-testbench.log --out-dir dossier

      - uses: actions/upload-artifact@v4
        with:
          name: investor-evidence-dossier
          path: |
            dossier/Chronus_v36_Sovereign_Investor_Dossier.pdf
            dossier/telemetry.json
            dossier/summary.md
            dossier/report.html
            rtl-testbench.log
          if-no-files-found: error

      - name: Attest dossier provenance (SLSA)
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: |
            dossier/Chronus_v36_Sovereign_Investor_Dossier.pdf
            dossier/telemetry.json
