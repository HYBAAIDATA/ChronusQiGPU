name: Partner build

# Proves two private distributions. Neither is ever published to a public registry.
# 1. The native (Cython) profile used inside the sealed appliance image: defence
#    in depth only, never a participant deliverable on its own.
# 2. The participant client (hyba-client): transport, auth hooks and schemas only.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - setup.py
      - packaging/**
      - src/chronus/licensing/**
      - .github/workflows/partner-build.yml
      - tests/test_licensing_lease.py
      - packages/hyba-client/**

permissions:
  contents: read

concurrency:
  group: partner-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-wheel:
    name: Native wheel, inspection and installed-wheel tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install build tooling
        run: python -m pip install "cython>=3.1" build setuptools wheel
      - name: Build the native wheel
        env:
          HYBA_NATIVE_BUILD: '1'
        run: python -m build --wheel --no-isolation
      - name: Inspect the wheel
        shell: python
        run: |
          import importlib.util, json, os, re, subprocess, sys, zipfile
          from pathlib import Path

          spec = importlib.util.spec_from_file_location("native_modules", "packaging/partner/native_modules.py")
          helper = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = helper
          spec.loader.exec_module(helper)
          modules = helper.resolve_native_modules(Path.cwd(), helper.read_patterns(helper.CONFIG_PATH))

          wheels = sorted(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              sys.exit(f"expected exactly one wheel in dist/, found {[wheel.name for wheel in wheels]}")
          wheel = wheels[0]
          failures = []
          if wheel.name.endswith("-none-any.whl"):
              failures.append(f"{wheel.name} is a pure-Python wheel; no extension was compiled")
          extract = Path(os.environ["RUNNER_TEMP"], "native-wheel")
          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())
              archive.extractall(extract)
          for module in modules:
              stem = module.name.replace(".", "/")
              compiled = [name for name in names if re.fullmatch(re.escape(stem) + r"\.[^/]+\.so", name)]
              if len(compiled) != 1:
                  failures.append(f"{module.name}: expected one compiled extension, found {compiled}")
              for suffix in (".py", ".pyi", ".c", ".pyx"):
                  if stem + suffix in names:
                      failures.append(f"{module.name}: source {stem + suffix} is in the wheel")
              for library in compiled:
                  described = subprocess.run(["file", "-b", str(extract / library)], capture_output=True, text=True).stdout
                  if "not stripped" in described:
                      failures.append(f"{library} still carries its symbol table")
          generated = sorted(name for name in names if name.endswith((".c", ".cpp", ".pyx", ".pxd", ".html")))
          if generated:
              failures.append(f"generated or Cython sources in the wheel: {generated}")
          store_name = "chronus/licensing/trust_store.json"
          if store_name not in names:
              failures.append(f"{store_name} is missing")
          else:
              store = json.loads((extract / store_name).read_text(encoding="utf-8"))
              if set(store) != {"schema", "keys"} or store["schema"] != "hyba.trust-store/1":
                  failures.append(f"{store_name} is not a hyba.trust-store/1 document")
              else:
                  print(f"trust store pins {len(store['keys'])} key(s); an empty store fails every verification closed")
          dist_info = next(name.split("/")[0] for name in names if name.endswith(".dist-info/METADATA"))
          metadata = (extract / dist_info / "METADATA").read_text(encoding="utf-8")
          if "Classifier: Private :: Do Not Upload" not in metadata.splitlines():
              print("::warning::wheel METADATA lacks the 'Private :: Do Not Upload' classifier (owned by pyproject.toml)")
          for name in sorted(names):
              if name.startswith(dist_info + "/") and "licen" in name.lower():
                  text = (extract / name).read_text(encoding="utf-8", errors="replace")
                  if "MIT License" in text or "Permission is hereby granted" in text:
                      print(f"::warning::{name} carries a permissive open-source licence text; resolve before any delivery")
          remaining = sorted(name for name in names if name.endswith(".py"))
          print(f"{wheel.name}: {len(modules)} compiled modules checked; {len(remaining)} Python source files remain (not listed in native-modules.txt)")
          Path(os.environ["RUNNER_TEMP"], "native-modules.json").write_text(json.dumps([module.name for module in modules]))
          if failures:
              for failure in failures:
                  print(f"::error::{failure}")
              sys.exit(1)
      - name: Install the wheel into a fresh virtual environment
        run: |
          python -m venv "$RUNNER_TEMP/partner-venv"
          "$RUNNER_TEMP/partner-venv/bin/python" -m pip install --quiet dist/*.whl pytest
      - name: Smoke-import compiled modules and run the licensing tests outside the source tree
        run: |
          set -euo pipefail
          workdir="$RUNNER_TEMP/partner-wheel-tests"
          mkdir -p "$workdir"
          cp tests/test_licensing_lease.py "$RUNNER_TEMP/native-modules.json" "$workdir/"
          : > "$workdir/pytest.ini"
          cd "$workdir"
          "$RUNNER_TEMP/partner-venv/bin/python" - <<'PY'
          import importlib, json
          from pathlib import Path
          import chronus
          site_root = Path(chronus.__file__).resolve().parent.parent
          assert "site-packages" in site_root.parts, f"chronus imported from {chronus.__file__}, not the installed wheel"
          modules = json.loads(Path("native-modules.json").read_text())
          assert modules, "no compiled modules recorded"
          for name in modules:
              module = importlib.import_module(name)
              origin = Path(module.__file__).resolve()
              assert origin.suffix == ".so", f"{name} imported from {origin}, not a compiled extension"
              assert site_root in origin.parents, f"{name} imported from outside the installed wheel: {origin}"
          print(f"{len(modules)} compiled modules import as extension modules from {site_root}")
          PY
          "$RUNNER_TEMP/partner-venv/bin/python" -m pytest -q -c pytest.ini --rootdir . -p no:cacheprovider test_licensing_lease.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: partner-native-wheel
          path: dist/*.whl
          retention-days: 7
          if-no-files-found: error

  participant-client:
    name: Participant client wheel (no engine code)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install build tooling
        run: python -m pip install build
      - name: Build hyba-client
        run: python -m build --wheel --outdir dist-client packages/hyba-client
      - name: Inspect the client wheel
        shell: python
        run: |
          import sys, zipfile
          from pathlib import PurePosixPath, Path

          wheels = sorted(Path("dist-client").glob("*.whl"))
          if len(wheels) != 1:
              sys.exit(f"expected exactly one client wheel, found {[wheel.name for wheel in wheels]}")
          with zipfile.ZipFile(wheels[0]) as archive:
              names = archive.namelist()
              metadata = archive.read(next(name for name in names if name.endswith(".dist-info/METADATA"))).decode("utf-8")
          problems = [name for name in names if not (name.startswith("hyba_client/") or name.split("/")[0].endswith(".dist-info"))]
          problems += [name for name in names if {"chronus", "turing"} & set(PurePosixPath(name).parts)]
          lines = metadata.splitlines()
          if "Classifier: Private :: Do Not Upload" not in lines:
              problems.append("METADATA lacks the 'Private :: Do Not Upload' classifier")
          problems += [line for line in lines if line.startswith("Requires-Dist:")]
          if problems:
              sys.exit("client wheel check failed: " + "; ".join(problems))
          print(f"{wheels[0].name}: {len(names)} members, private classifier present, no dependencies")
      - name: Import the installed client outside the source tree
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/client-venv"
          "$RUNNER_TEMP/client-venv/bin/python" -m pip install --quiet dist-client/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/client-venv/bin/python" -c "import sys, hyba_client; assert not {'chronus', 'turing'} & {name.split('.')[0] for name in sys.modules}; print('hyba_client', hyba_client.__version__)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: participant-client-wheel
          path: dist-client/*.whl
          retention-days: 7
          if-no-files-found: error
