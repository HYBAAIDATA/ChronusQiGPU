services:
  api:
    image: chronus-api:local
    pull_policy: never
    build:
      context: .
      dockerfile: Dockerfile
      target: api-runtime
    ports:
      - "127.0.0.1:18000:8000"
    environment:
      CHRONUS_WORKLOAD_DB_PATH: /var/lib/chronus/workloads.sqlite3
      CHRONUS_PROCUREMENT_LEDGER: /var/lib/chronus/procurement_ledger.jsonl
      CHRONUS_TENANT_TOKENS: ${CHRONUS_TENANT_TOKENS:-{}}
    volumes:
      - chronus_data:/var/lib/chronus

    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true

  web:
    image: chronus-web:local
    pull_policy: never
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:13000:3000"
    environment:
      CHRONUS_BACKEND_URL: http://api:8000
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    security_opt:
      - no-new-privileges:true

  miner:
    image: chronus-miner:local
    pull_policy: never
    profiles: [miner]
    build:
      context: .
      dockerfile: Dockerfile
      target: miner-runtime
    env_file:
      - .env
    environment:
      MINING_MAX_SECONDS: ${MINING_MAX_SECONDS:-}
    restart: "no"

volumes:
  chronus_data:
