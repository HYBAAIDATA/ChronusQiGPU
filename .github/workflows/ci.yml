name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  PYTHONUNBUFFERED: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  node:
    name: Node — typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - name: Typecheck (tsc --noEmit)
        run: npm run lint
      - name: Unit tests (tsx --test)
        run: npm run test:ts
      - name: Build (vite + esbuild server bundle)
        run: npm run build

  python:
    name: Python — lint, unit tests, compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[ml,dev]"
      - name: Lint (flake8)
        run: python -m flake8 --count
      - name: Unit tests (pytest)
        run: python -m pytest tests/ -x -q
      - name: Quantum compute substrate suite (1,488 gates)
        run: python -X utf8 run_tests.py
      - name: Byte-compile all Python sources
        run: python -m compileall -q Intelligence core_engine mining hyba lucas pythagoras quantum_compute_substrate scripts tests mla1517_platform_v3.4/python

  python-selftest:
    name: Python — Intelligence self-test (ML stack)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies with ML extras
        run: pip install -e ".[ml]"
      - name: Fetch NLTK resources (vader_lexicon for toe.PredictiveEngine)
        run: python -c "import nltk; nltk.download('vader_lexicon', quiet=True)"
      - name: Run Intelligence self-test
        run: python -u -X utf8 -m Intelligence.self_test
