name: EUCLID evidence, training, genetic mining and healing

on:
  pull_request:
    paths:
      - "euclid/**"
      - "chronus/seam/**"
      - "chronus/mla1517/mining/euclid_support.py"
      - "tests/test_euclid_training_genetic_healing.py"
      - "tests/test_euclid_training_readiness.py"
      - "tests/test_salamander_agentic.py"
      - ".github/workflows/euclid-evidence.yml"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  evidence-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        # Tests import chronus.mla1517.* which needs the declared project
        # dependencies (numpy, pyyaml, sympy, in-tree VQC); installing only
        # numpy+pytest left the training-readiness suite erroring on import.
        run: |
          bash scripts/ci_install.sh ""
          python -m pip install pytest
      - name: Compile
        run: python -m compileall -q euclid chronus/seam tests/test_euclid_training_genetic_healing.py tests/test_euclid_training_readiness.py
      - name: EUCLID evidence and training gates
        run: python -m unittest -v tests.test_euclid_training_genetic_healing
      - name: EUCLID training readiness gates
        run: python -m unittest -v tests.test_euclid_training_readiness
      - name: Genetic mining layer contracts
        run: python -m pytest -q tests/test_layer_verdicts.py
      - name: Salamander self-healing safety
        run: python -m pytest -q tests/test_salamander_agentic.py