name: Hardware Acceptance
on:
  workflow_dispatch:
    inputs:
      device_id: {required: true, type: string}
      commit_sha: {required: true, type: string}
concurrency:
  group: hardware-acceptance-${{ inputs.device_id }}
  cancel-in-progress: true
permissions:
  contents: read
  checks: write
  statuses: write
jobs:
  strict-hardware:
    runs-on: [self-hosted, opencl, '${{ inputs.device_id }}']
    timeout-minutes: 45
    environment: hardware-acceptance
    steps:
      - uses: actions/checkout@v7
        with: {ref: '${{ inputs.commit_sha }}'}
      - id: strict_hardware
        run: MLA1517_STRICT_HARDWARE_CI=1 MLA1517_GPU_BACKEND=opencl make strict-hardware-gate
      - name: Build and install the exact wheel under acceptance
        run: |
          rm -rf dist /tmp/pythia-hardware-wheel
          python -m pip wheel . --no-deps --wheel-dir dist
          python -m venv --system-site-packages /tmp/pythia-hardware-wheel
          /tmp/pythia-hardware-wheel/bin/pip install --no-deps dist/*.whl
      - id: chronus_measurement
        name: Generate authenticated real-device endpoint evidence
        run: |
          TOKEN=$(python -c 'import secrets; print(secrets.token_hex(32))')
          export MLA1517_REMOTE_GPU_TOKEN="$TOKEN"
          export MLA1517_REMOTE_GPU_ATTESTATION_KEY="$TOKEN"
          export MLA1517_HARDWARE_REPORT="$GITHUB_WORKSPACE/results/remote_gpu_report.json"
          cd /tmp
          /tmp/pythia-hardware-wheel/bin/python             "$GITHUB_WORKSPACE/scripts/remote_gpu_hardware_acceptance.py"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: 'strict-hardware-report-${{ inputs.device_id }}'
          path: |
            results/strict_hardware_report.json
            results/remote_gpu_report.json
      - run: python scripts/publish_check_runs.py
        env: {GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
      - name: Enforce hardware acceptance result
        if: always()
        run: |
          test '${{ steps.strict_hardware.outcome }}' = 'success'
          test '${{ steps.chronus_measurement.outcome }}' = 'success'
