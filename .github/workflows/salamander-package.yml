name: SALAMANDER package preparation (no publication)
on:
  pull_request:
    paths:
      - 'salamander/**'
      - 'al_haras/**'
      - 'packaging/salamander/**'
      - 'LICENSE'
      - '.github/workflows/salamander-package.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installed-artifact:
    name: Package gates / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Allocate fresh output outside the checkout
        run: echo "OUT=$RUNNER_TEMP/salamander-$GITHUB_SHA-${{ matrix.python }}" >> "$GITHUB_ENV"
      - name: Unit and packaging-regression tests (not production qualification)
        run: |
          python -m pip install pytest==9.1.1
          python -m pytest -q packaging/salamander/tests
      - name: Build sdist, wheel from sdist, and clean installed verification
        run: python packaging/salamander/build_and_verify.py --out-dir "$OUT"
      - name: Preserve verdict even when gates fail
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: salamander-package-verdict-${{ github.sha }}-py${{ matrix.python }}
          path: ${{ env.OUT }}/hyba-salamander-release-verdict.json
          if-no-files-found: warn
      - name: Preserve installable candidate (not authorised for publication)
        uses: actions/upload-artifact@v7
        with:
          name: salamander-unpublished-candidate-${{ github.sha }}-py${{ matrix.python }}
          path: |
            ${{ env.OUT }}/*.whl
            ${{ env.OUT }}/*.tar.gz
            ${{ env.OUT }}/hyba-salamander-release-verdict.json
          if-no-files-found: error
