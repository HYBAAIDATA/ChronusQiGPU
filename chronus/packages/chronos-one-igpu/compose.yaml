services:
  chronos-igpu:
    build: .
    environment:
      CHRONOS_SERVICE_TOKEN: ${CHRONOS_SERVICE_TOKEN:?Set a private token of at least 32 characters}
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    command: ["--host", "0.0.0.0", "--port", "8632", "--mining-backend", "native", "--db-path", "/var/lib/chronos/prime.db", "--tls-cert", "/run/chronos/tls/cert.pem", "--tls-key", "/run/chronos/tls/key.pem"]
    ports: ["127.0.0.1:8632:8632"]
    volumes:
      - chronos-data:/var/lib/chronos
      - ${CHRONOS_TLS_DIR:?Set directory containing cert.pem and key.pem}:/run/chronos/tls:ro
    read_only: true
    tmpfs: [/tmp]
    stop_grace_period: 30s
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,ssl; urllib.request.urlopen('https://127.0.0.1:8632/health',context=ssl.create_default_context(cafile='/run/chronos/tls/cert.pem'),timeout=3).read()"]
      interval: 30s
      timeout: 5s
volumes:
  chronos-data:
