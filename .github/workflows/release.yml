name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-attest-release:
    name: Build, attest and publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the GitHub Release
      id-token: write       # Sigstore/Fulcio OIDC signing
      attestations: write   # publish in-toto attestations
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install build tooling
        run: python -m pip install -e . build twine cyclonedx-bom

      - name: Build distribution
        run: python -m build

      - name: Verify distribution metadata
        run: twine check dist/*

      - name: Generate CycloneDX SBOM
        run: cyclonedx-py environment --of JSON -o sbom.cdx.json

      - name: Assemble qualification dossier
        run: |
          set -euo pipefail
          mkdir -p dossier
          cp -r manifests dossier/manifests
          cp sbom.cdx.json dossier/
          (cd dist && sha256sum *) | tee dossier/SHA256SUMS.txt
          tar -czf chronus-${{ github.ref_name }}-qualification-dossier.tar.gz -C dossier .

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*
            sbom.cdx.json
            chronus-${{ github.ref_name }}-qualification-dossier.tar.gz

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Chronus ${{ github.ref_name }}" \
            --generate-notes \
            --verify-tag \
            dist/* \
            sbom.cdx.json \
            chronus-${{ github.ref_name }}-qualification-dossier.tar.gz
