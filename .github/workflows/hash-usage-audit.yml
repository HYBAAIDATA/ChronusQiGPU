name: Advisory hash usage audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Test audit tooling without project dependencies
        run: python -m unittest discover -s tests -p test_hash_usage_audit.py -v
      - name: Inventory tracked source locations (no source snippets)
        run: python scripts/hash_usage_audit.py --output artifacts/hash-usage-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: hash-usage-audit
          path: artifacts/hash-usage-audit.json
          if-no-files-found: error
          retention-days: 7
