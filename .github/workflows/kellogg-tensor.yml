name: hyba-kellogg-tensor

on:
  pull_request:
    paths:
      - "packaging/verify_registry_release.py"
      - "tests/test_registry_release_protocol.py"
      - "kellogg/**"
      - "tests/test_kellogg*.py"
      - "tests/test_canonical_tensor_ownership.py"
      - "tests/test_exact_tensor_parity.py"
      - "tests/test_geodesic_tensor_*.py"
      - "tests/test_toe_tensor_ml.py"
      - "benchmarks/tensor/**"
      - "packaging/kellogg-tensor/**"
      - "LICENSE"
      - ".github/workflows/kellogg-tensor.yml"
  workflow_dispatch:
    inputs:
      rc_sha:
        description: Full frozen release-candidate commit; must equal dispatch head
        required: true
        type: string
      publish:
        description: "Publish the exact verified release artefacts"
        type: choice
        options: [none, testpypi, pypi]
        default: none

permissions:
  contents: read

env:
  RC_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  preflight:
    name: Freeze and verify source identity
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ env.RC_SHA }}
    - name: Require exact requested RC
      run: "test \"$(git rev-parse HEAD)\" = \"$RC_SHA\"\nif [ \"${{ github.event_name }}\" = workflow_dispatch ]; then\n  test\
        \ \"${{ inputs.rc_sha }}\" = \"${{ github.sha }}\"\nfi\npython -m unittest discover -s tests -p test_registry_release_protocol.py\
        \ -v"

  verify-wheel:
    name: Installed wheel / Python ${{ matrix.python }}
    needs: preflight
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RC_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install release tooling
        run: python -m pip install --disable-pip-version-check build twine
      - name: Build wheel + sdist and verify from clean installs
        run: python packaging/kellogg-tensor/build_and_verify.py
      - name: Retain interpreter evidence
        uses: actions/upload-artifact@v4
        with:
          name: kellogg-fixture-${{ matrix.python }}
          path: |
            packaging/kellogg-tensor/dist/artifact-verdict.json
            packaging/kellogg-tensor/dist/canonical-fixture.json
            packaging/kellogg-tensor/dist/wheel-manifest.json
          if-no-files-found: error
      - name: Retain canonical release archives
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: kellogg-tensor-dist
          path: |
            packaging/kellogg-tensor/dist/hyba_kellogg_tensor-1.0.0-py3-none-any.whl
            packaging/kellogg-tensor/dist/hyba_kellogg_tensor-1.0.0.tar.gz
            packaging/kellogg-tensor/dist/artifact-verdict.json
            packaging/kellogg-tensor/dist/wheel-manifest.json
          if-no-files-found: error

  source-gate:
    name: KELLOGG source tests + full benchmarks
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RC_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check "numpy>=1.26,<3" "pytest>=7.4,<10"
      - name: Execute release test and benchmark gate
        run: python packaging/kellogg-tensor/run_release_gate.py
      - name: Retain source and benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: kellogg-source-evidence
          path: |
            packaging/kellogg-tensor/release-evidence/**
            benchmarks/tensor/results/latest.json
            benchmarks/tensor/results/archive/**
          if-no-files-found: error

  cross-version:
    name: Cross-version deterministic fixtures
    needs: verify-wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: kellogg-fixture-*
          path: fixtures
          merge-multiple: false
      - name: Compare 3.11/3.12/3.13/3.14 fixtures
        shell: python
        run: |
          import json
          from pathlib import Path

          files = sorted(Path("fixtures").glob("**/canonical-fixture.json"))
          if len(files) != 4:
              raise SystemExit(f"expected 4 fixture records, found {len(files)}: {files}")
          rows = [json.loads(p.read_text(encoding="utf-8")) for p in files]
          versions = {row["python"].split(".")[:2][0] + "." + row["python"].split(".")[:2][1] for row in rows}
          expected = {"3.11", "3.12", "3.13", "3.14"}
          if versions != expected:
              raise SystemExit(f"interpreter matrix mismatch: {versions}")
          keys = ("canonical_digest", "certificate_digest", "attestation_digest")
          comparisons = {key: sorted({row[key] for row in rows}) for key in keys}
          if any(len(values) != 1 for values in comparisons.values()):
              raise SystemExit(f"cross-version deterministic fixture mismatch: {comparisons}")
          verdict = {
              "product": "hyba-kellogg-tensor",
              "version": "1.0.0",
              "python_versions": sorted(versions),
              "comparisons": comparisons,
              "cross_version_verified": True,
          }
          out = Path("cross-version.json")
          out.write_text(json.dumps(verdict, indent=2, sort_keys=True), encoding="utf-8")
          print(out.read_text())
      - uses: actions/upload-artifact@v4
        with:
          name: kellogg-cross-version
          path: cross-version.json
          if-no-files-found: error

  release-verdict:
    name: Compose release verdict
    needs: [verify-wheel, source-gate, cross-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RC_SHA }}
      - uses: actions/download-artifact@v4
        with:
          name: kellogg-tensor-dist
          path: verified-dist
      - uses: actions/download-artifact@v4
        with:
          name: kellogg-source-evidence
          path: source-evidence
      - uses: actions/download-artifact@v4
        with:
          name: kellogg-cross-version
          path: cross-version
      - name: Verify PyPI project-name state
        shell: python
        run: |
          import json
          import urllib.error
          import urllib.request
          from pathlib import Path

          url = "https://pypi.org/pypi/hyba-kellogg-tensor/json"
          try:
              with urllib.request.urlopen(url, timeout=20) as response:
                  payload = json.load(response)
              state = {
                  "http_status": 200,
                  "registered": True,
                  "existing_versions": sorted(payload.get("releases", {})),
              }
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise
              state = {"http_status": 404, "registered": False, "existing_versions": []}
          # A first release is valid while unregistered. If somebody has already
          # published 1.0.0, fail closed rather than overwrite release identity.
          if "1.0.0" in state["existing_versions"]:
              raise SystemExit("hyba-kellogg-tensor 1.0.0 already exists on PyPI")
          Path("pypi-state.json").write_text(
              json.dumps(state, indent=2, sort_keys=True), encoding="utf-8"
          )
          print(json.dumps(state, indent=2, sort_keys=True))
      - name: Create final machine-readable release verdict
        shell: python
        run: |
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          dist = Path("verified-dist")
          artifact = json.loads((dist / "artifact-verdict.json").read_text())
          source = json.loads(next(Path("source-evidence").glob("**/source-gate.json")).read_text())
          cross = json.loads((Path("cross-version") / "cross-version.json").read_text())
          pypi = json.loads(Path("pypi-state.json").read_text())

          wheel = dist / "hyba_kellogg_tensor-1.0.0-py3-none-any.whl"
          sdist = dist / "hyba_kellogg_tensor-1.0.0.tar.gz"
          digest = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          if digest(wheel) != artifact["wheel"]["sha256"]:
              raise SystemExit("wheel digest changed after verification")
          if digest(sdist) != artifact["sdist"]["sha256"]:
              raise SystemExit("sdist digest changed after verification")

          sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if artifact["git_sha"] != sha or source["git_sha"] != sha or source["tests"]["git_sha"] != sha:
              raise SystemExit("stale KELLOGG evidence")
          tests = source["tests"]
          if tests["returncode"] != 0 or tests["skipped"] or tests["failed"] or tests["errors"] or tests["passed"] <= 0:
              raise SystemExit("KELLOGG full product suite must pass with zero skipped")
          verdict = {
              "product": "hyba-kellogg-tensor",
              "version": "1.0.0",
              "repository": "QuantumPhiRedux/PhiMiner",
              "git_sha": sha,
              "package_metadata_valid": True,
              "standalone_boundary_verified": artifact["standalone_boundary_verified"],
              "registry_verified": artifact["registry_verified"],
              "tests_passed": source["tests_passed"],
              "benchmarks_completed": source["benchmarks_completed"],
              "attestation_verified": artifact["attestation_verified"],
              "certificate_verification_passed": artifact["certificate_verification_passed"],
              "cross_version_verified": cross["cross_version_verified"],
              "wheel_built": artifact["wheel_built"],
              "wheel_clean_install_verified": artifact["wheel_clean_install_verified"],
              "sdist_verified": artifact["sdist_verified"],
              "artifact_secret_scan_passed": artifact["artifact_secret_scan_passed"],
              "pypi_metadata_valid": True,
              "pypi_registry_state": pypi,
              "trusted_publishing_workflow_valid": True,
              "wheel": artifact["wheel"],
              "sdist": artifact["sdist"],
              "tested_python_versions": cross["python_versions"],
              "tests": source["tests"],
              "benchmarks": source["benchmarks"],
              "testpypi_verified": False,
              "publishable": True,
              "published": False,
          }
          Path("release-verdict.json").write_text(
              json.dumps(verdict, indent=2, sort_keys=True), encoding="utf-8"
          )
          print(json.dumps(verdict, indent=2, sort_keys=True))
      - name: Assemble exact verified publication bundle
        run: |
          cp release-verdict.json verified-dist/release-verdict.json
          cp pypi-state.json verified-dist/pypi-state.json
      - uses: actions/upload-artifact@v4
        with:
          name: kellogg-tensor-verified-release
          path: verified-dist/*
          if-no-files-found: error

  publish-testpypi:
    name: OIDC upload exact archives to TestPyPI
    needs:
    - release-verdict
    if: github.event_name == 'workflow_dispatch' && inputs.publish != 'none'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ env.RC_SHA }}
    - uses: actions/download-artifact@v4
      with:
        name: kellogg-tensor-verified-release
        path: release
    - name: Stage exact RC-bound qualified archives
      run: |-
        python - <<'PYCODE'
        import sys, shutil
        from pathlib import Path
        sys.path.insert(0, "packaging")
        from verify_registry_release import qualification, file_digest, require
        row = qualification("release/release-verdict.json", "${{ env.RC_SHA }}", "hyba-kellogg-tensor")
        Path("upload").mkdir()
        for key in ("wheel", "sdist"):
            item = row[key]
            src = Path("release") / item["file"]
            require(file_digest(src) == item["sha256"], "archive digest mismatch")
            shutil.copy2(src, Path("upload") / src.name)
        PYCODE
    - uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: upload/
        repository-url: https://test.pypi.org/legacy/
  testpypi-smoke:
    name: Clean testpypi execution / Python ${{ matrix.python }}
    needs: publish-testpypi
    if: github.event_name == 'workflow_dispatch' && inputs.publish != 'none'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python:
        - '3.11'
        - '3.12'
        - '3.13'
        - '3.14'
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ env.RC_SHA }}
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python }}
    - uses: actions/download-artifact@v4
      with:
        name: kellogg-tensor-verified-release
        path: release
    - name: Execute fresh registry install, import, CLI and replay
      run: python packaging/verify_registry_release.py --product hyba-kellogg-tensor --registry testpypi --sha "$RC_SHA"
        --verdict release/release-verdict.json --out receipts
    - uses: actions/upload-artifact@v4
      with:
        name: kellogg-testpypi-smoke-${{ matrix.python }}
        path: receipts/
        if-no-files-found: error
  testpypi-verified:
    name: Seal executed testpypi matrix
    needs: testpypi-smoke
    if: github.event_name == 'workflow_dispatch' && inputs.publish != 'none'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ env.RC_SHA }}
    - uses: actions/download-artifact@v4
      with:
        name: kellogg-tensor-verified-release
        path: release
    - uses: actions/download-artifact@v4
      with:
        pattern: kellogg-testpypi-smoke-*
        path: receipts
    - run: python packaging/verify_registry_release.py --product hyba-kellogg-tensor --registry testpypi --sha "$RC_SHA"
        --verdict release/release-verdict.json --receipts receipts --out publication.json
    - uses: actions/upload-artifact@v4
      with:
        name: kellogg-testpypi-verified
        path: publication.json
        if-no-files-found: error
  pypi-smoke:
    name: Clean pypi execution / Python ${{ matrix.python }}
    needs: publish-pypi
    if: github.event_name == 'workflow_dispatch' && inputs.publish == 'pypi'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python:
        - '3.11'
        - '3.12'
        - '3.13'
        - '3.14'
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ env.RC_SHA }}
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python }}
    - uses: actions/download-artifact@v4
      with:
        name: kellogg-tensor-verified-release
        path: release
    - name: Execute fresh registry install, import, CLI and replay
      run: python packaging/verify_registry_release.py --product hyba-kellogg-tensor --registry pypi --sha "$RC_SHA" --verdict
        release/release-verdict.json --out receipts
    - uses: actions/upload-artifact@v4
      with:
        name: kellogg-pypi-smoke-${{ matrix.python }}
        path: receipts/
        if-no-files-found: error
  pypi-verified:
    name: Seal executed pypi matrix
    needs: pypi-smoke
    if: github.event_name == 'workflow_dispatch' && inputs.publish == 'pypi'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ env.RC_SHA }}
    - uses: actions/download-artifact@v4
      with:
        name: kellogg-tensor-verified-release
        path: release
    - uses: actions/download-artifact@v4
      with:
        pattern: kellogg-pypi-smoke-*
        path: receipts
    - run: python packaging/verify_registry_release.py --product hyba-kellogg-tensor --registry pypi --sha "$RC_SHA" --verdict
        release/release-verdict.json --receipts receipts --out publication.json
    - uses: actions/upload-artifact@v4
      with:
        name: kellogg-pypi-verified
        path: publication.json
        if-no-files-found: error
  publish-pypi:
    name: OIDC promote the same TestPyPI-verified bytes
    needs: testpypi-verified
    if: github.event_name == 'workflow_dispatch' && inputs.publish == 'pypi'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ env.RC_SHA }}
    - uses: actions/download-artifact@v4
      with:
        name: kellogg-tensor-verified-release
        path: release
    - uses: actions/download-artifact@v4
      with:
        name: kellogg-testpypi-verified
        path: promotion
    - name: Require executed TestPyPI gate for this RC and archive pair
      run: |-
        python - <<'PYCODE'
        import sys, os
        sys.path.insert(0,"packaging")
        from verify_registry_release import load, qualification, require
        base = qualification("release/release-verdict.json", os.environ["RC_SHA"], "hyba-kellogg-tensor")
        promotion = load("promotion/publication.json")
        require(promotion["git_sha"] == os.environ["RC_SHA"] and promotion["testpypi_verified"] is True, "missing executed TestPyPI gate")
        require(promotion["wheel"] == base["wheel"] and promotion["sdist"] == base["sdist"], "promotion rebuilt/substituted archives")
        PYCODE
    - name: Stage exact RC-bound qualified archives
      run: |-
        python - <<'PYCODE'
        import sys, shutil
        from pathlib import Path
        sys.path.insert(0, "packaging")
        from verify_registry_release import qualification, file_digest, require
        row = qualification("release/release-verdict.json", "${{ env.RC_SHA }}", "hyba-kellogg-tensor")
        Path("upload").mkdir()
        for key in ("wheel", "sdist"):
            item = row[key]
            src = Path("release") / item["file"]
            require(file_digest(src) == item["sha256"], "archive digest mismatch")
            shutil.copy2(src, Path("upload") / src.name)
        PYCODE
    - uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: upload/
  github-release:
    name: Publish evidence-linked standalone GitHub release
    needs: pypi-verified
    if: github.event_name == 'workflow_dispatch' && inputs.publish == 'pypi'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ env.RC_SHA }}
    - uses: actions/download-artifact@v4
      with:
        name: kellogg-tensor-verified-release
        path: release
    - uses: actions/download-artifact@v4
      with:
        name: kellogg-pypi-verified
        path: final
    - uses: actions/download-artifact@v4
      with:
        name: kellogg-testpypi-verified
        path: test
    - uses: actions/download-artifact@v4
      with:
        pattern: kellogg-*-smoke-*
        path: execution-logs
    - name: Retain complete publication evidence and create release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |-
        python - <<'PYCODE'
        import json, os
        from pathlib import Path
        row = json.load(open("final/publication.json"))
        test = json.load(open("test/publication.json"))
        if not row["published"] or not test["testpypi_verified"]:
            raise SystemExit("missing executed registry evidence")
        row["testpypi_verified"] = True
        row["testpypi_receipts"] = test["registry_receipts"]
        Path("publication.json").write_text(json.dumps(row, indent=2, sort_keys=True))
        Path("release-notes.md").write_text(
            "Standalone hyba-kellogg-tensor 1.0.0\n\nRC: " + os.environ["RC_SHA"] +
            "\nCI: " + os.environ["CI_RUN_URL"] +
            "\n\nBoth registries used the same wheel/sdist SHA-256 archives; attached publication.json contains executed receipts. "
            "Full command/install/custody logs are attached. This release does not certify CHRONUS/iGPU or the whole HYBA platform.\n")
        PYCODE
        tar -czf registry-execution-logs.tar.gz execution-logs
        gh release create kellogg-tensor-v1.0.0 --target "$RC_SHA" --title "hyba-kellogg-tensor 1.0.0" --notes-file release-notes.md release/*.whl release/*.tar.gz publication.json registry-execution-logs.tar.gz
    - uses: actions/upload-artifact@v4
      with:
        name: kellogg-final-publication
        path: publication.json
        if-no-files-found: error
