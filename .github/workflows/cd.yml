name: Azure foundation deployment

on:
  workflow_dispatch:
    inputs:
      resource_group:
        description: Existing Azure resource group
        required: true
        type: string
      location:
        description: Azure region selected for the deployment
        required: true
        type: string
        default: uaenorth
      environment:
        description: Environment classification
        required: true
        type: choice
        options: [dev, test, prod]

permissions:
  contents: read
  id-token: write

jobs:
  foundation:
    name: Review and deploy Azure foundation
    runs-on: ubuntu-latest
    environment: azure-foundation
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Validate and show proposed changes
        env:
          RESOURCE_GROUP: ${{ inputs.resource_group }}
          LOCATION: ${{ inputs.location }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          az deployment group validate --resource-group "$RESOURCE_GROUP" --template-file infra/azure/main.bicep --parameters location="$LOCATION" environment="$ENVIRONMENT"
          az deployment group what-if --resource-group "$RESOURCE_GROUP" --template-file infra/azure/main.bicep --parameters location="$LOCATION" environment="$ENVIRONMENT"
      - name: Deploy foundation
        env:
          RESOURCE_GROUP: ${{ inputs.resource_group }}
          LOCATION: ${{ inputs.location }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: az deployment group create --resource-group "$RESOURCE_GROUP" --template-file infra/azure/main.bicep --parameters location="$LOCATION" environment="$ENVIRONMENT"
