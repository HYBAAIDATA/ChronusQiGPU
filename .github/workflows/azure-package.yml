name: Azure packaging
on:
  pull_request:
  push:
    branches: [main, codex/mining-lifecycle-integration]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Bicep without deploying resources
        run: az bicep build --file deploy/azure/main.bicep --outfile /tmp/pythia-arm.json
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Azure control image
        run: docker build -f deploy/azure/Dockerfile -t pythia-control:ci .
      - name: Check process health and honest mining readiness
        shell: bash
        run: |
          set -euo pipefail
          # The control plane fails closed without a Stratum identity, so boot it
          # with placeholder, non-secret values and an unreachable pool.
          docker run -d --name pythia-ci -p 127.0.0.1:3000:3000 \
            -e MLA1517_STRATUM_USER=ci-smoke \
            -e MLA1517_STRATUM_PASSWORD=ci-smoke \
            -e MLA1517_STRATUM_ENDPOINT=127.0.0.1:1 \
            pythia-control:ci
          trap 'docker logs pythia-ci; docker rm -f pythia-ci' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/healthz > /tmp/health.json; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:3000/healthz
          # Every durable path must sit on the writable volume for uid 10001:
          # the share log that prevents re-submits, the causal ledger, agentic
          # state and the intelligence's Aethel memory.
          docker exec pythia-ci sh -c 'for p in "$PYTHIA_MINING_SESSION_PATH" "$PYTHIA_CAUSAL_LOG_PATH" "$PYTHIA_AGENTIC_STATE_PATH" "$PYTHIA_INTELLIGENCE_DIR/x"; do d=$(dirname "$p"); mkdir -p "$d" && test -w "$d" || { echo "not writable: $d"; exit 1; }; done'
          curl --fail --silent http://127.0.0.1:3000/ > /tmp/index.html
          test -s /tmp/index.html
          # Not-ready is reported as HTTP 503 with a JSON body, so --fail must not be used here.
          ready_status=$(curl --silent --output /tmp/ready.json --write-out '%{http_code}' http://127.0.0.1:3000/api/v1/ready-to-mine)
          test "$ready_status" = 503
          python - <<'PY'
          import json
          ready = json.load(open('/tmp/ready.json'))
          assert ready['ready'] is False, ready
          PY
