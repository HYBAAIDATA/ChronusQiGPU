# PYTHIA service fabric — machine-readable companion to the service
# constitution (governance/api_registry.yaml, schema pythia.api_registry/2).
#
# This file declares the elevation-pass governance surface: reliability
# tiers, the canonical failure-class enum, the dependency graph, critical
# journeys, SLO/error-budget policy, resilience mechanics (timeouts, retries,
# idempotency, circuit breakers, bulkheads, backpressure), schema/lifecycle
# governance, correlation, observability, health model, graceful
# degradation, recovery objectives, resilience maturity, and evidence
# classes.
#
# tests/test_service_constitution.py enforces consistency between this file
# and api_registry.yaml (dependency lists vs edges, tier rules, failure
# classes emitted by the code vs this enum, lifecycle values, journey
# references). Nothing here is decorative: unexplained divergence fails the
# gate.

schema: pythia.service_fabric/1
registry_ref: governance/api_registry.yaml
baseline_sha: f50f2e97fb850f83dc68c2b0713d6fcfd75e53e8

# ---------------------------------------------------------------------------
# Reliability tiers (§4). tier_of(owner) is a default; the registry entry's
# reliability_tier is authoritative per interface.
# ---------------------------------------------------------------------------
reliability_tiers:
  R0:
    name: constitutional / fail-closed
    owners: [AL_HARAS, THESEUS, SHA256D_VERIFIER]
    requirements:
      - no semantic fallback
      - no optimistic success
      - no silent bypass
      - explicit unavailable state
      - durable evidence of failure
    rule: if unavailable, the affected privileged operation stops
    error_budget: null   # R0 integrity failures are never excused by budget
  R1:
    name: mining-critical
    owners: [PYTHIA, CHRONUS, POOL, EUCLID, HYBA_DB]
    requirements:
      - bounded recovery
      - connection/session continuity
      - stale-work rejection
      - reconnect semantics
      - job-generation integrity
      - no fabricated execution state
    error_budget: release-managed
  R2:
    name: specialist computation
    owners: [TURING, KELLOGG, OVID]
    requirements:
      - explicit availability
      - typed failure
      - bounded timeout
      - fallback only if PYTHIA/EUCLID plan expressly permits
      - provenance preserved
    rule: unavailability never causes another subsystem to impersonate the missing authority
    error_budget: release-managed
  R3:
    name: healing and optimisation
    owners: [SALAMANDER]
    requirements:
      - bounded remediation
      - independent postcondition verification
      - rollback
      - evidence retention
      - authority preservation
    error_budget: release-managed
  R4:
    name: experience / projections
    requirements:
      - graceful degradation
      - truth preservation
      - no synthetic backend state
    rule: loss of R4 must not corrupt R0-R2 semantics
    error_budget: release-managed

# ---------------------------------------------------------------------------
# Canonical failure classes (§9). The runtime enum lives in
# chronus/mla1517_platform/python/failure_taxonomy.py; the constitution suite
# proves the two are identical sets and that control_api emits only these
# classes.
# ---------------------------------------------------------------------------
failure_classes:
  INVALID_REQUEST:        {http_status: 400, retryable: false, meaning: request fails schema/shape validation}
  UNAUTHORISED:           {http_status: 401, retryable: false, meaning: missing/invalid credentials}
  FORBIDDEN:              {http_status: 403, retryable: false, meaning: authenticated but not authorised; AL HARAS deny}
  DEPENDENCY_UNAVAILABLE: {http_status: 503, retryable: true,  meaning: declared dependency is down; bounded retry allowed}
  TIMEOUT:                {http_status: 504, retryable: true,  meaning: bounded wait exceeded; timeout never becomes success}
  CONTRACT_MISMATCH:      {http_status: 422, retryable: false, meaning: response/result violates the declared contract}
  VERSION_UNSUPPORTED:    {http_status: 400, retryable: false, meaning: unknown or unsupported schema/protocol major}
  STALE:                  {http_status: 409, retryable: true,  meaning: job/request superseded by a newer generation}
  INTEGRITY_FAILURE:      {http_status: 500, retryable: false, meaning: digest/proof/equivalence check failed}
  CUSTODY_FAILURE:        {http_status: 500, retryable: false, meaning: THESEUS custody could not be taken or verified}
  EXECUTION_FAILURE:      {http_status: 500, retryable: false, meaning: backend execution failed truthfully}
  VERIFICATION_FAILURE:   {http_status: 500, retryable: false, meaning: certificate/proof verification failed}
  EXTERNAL_REJECT:        {http_status: 502, retryable: false, meaning: external authority (pool) rejected}
  RATE_LIMITED:           {http_status: 429, retryable: true,  meaning: request rejected by a declared limit}
  NOT_CONFIGURED:         {http_status: 503, retryable: false, meaning: capability exists but is not configured}
  NOT_APPLICABLE:         {http_status: 400, retryable: false, meaning: operation not applicable to current state}
  INTERNAL_ERROR:         {http_status: 500, retryable: false, meaning: unexpected failure; evidence retained}
  NOT_FOUND:              {http_status: 404, retryable: false, meaning: no declared route/resource at this path}

# Every emitted error body MUST carry failure_class. Absence is a defect the
# constitution suite fails on.
error_envelope:
  required_keys: [failure_class]
  optional_keys: [ok, error, detail, retryable, evidence_ref, idempotent_replay]
  rule: HTTP status is transport truth; failure_class is machine truth. The
    class's declared http_status is the default for programmatic emitters; a
    route may refine the status when its own transport semantics differ
    (e.g. a reserved-namespace 404 carries NOT_FOUND, a 409 runner conflict
    carries NOT_APPLICABLE).

