name: Turing core

on:
  pull_request:
    paths:
      - "turing_universal_quantum_computer/**"
      - "kellogg/**"
      - "proofs/lean/**"
      - "scripts/turing_digest_fixture.py"
      - "scripts/turing_vqc_digest_fixture.py"
      - "scripts/turing_acceptance_gate.py"
      - "tests/test_turing_production_pipeline.py"
      - "tests/test_turing_acceptance_gate.py"
      - "tests/test_turing_release_packaging.py"
      - "packaging/turing/**"
      - "packaging/verify_release_candidates.py"
      - "packaging/kellogg-tensor/build_and_verify.py"
      - "mining/formal/**"
      - ".github/workflows/turing-core.yml"
      - ".github/workflows/turing-release.yml"
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install TURING with Kellogg from the checkout
        # hyba-kellogg-tensor is not on PyPI yet: install TURING without dependency
        # resolution and resolve Kellogg (and the repo packages) from the checkout.
        run: |
          pip install "numpy>=1.26,<3" "sympy>=1.12,<2" "pytest>=7.4,<10"
          pip install --no-deps -e ./turing_universal_quantum_computer
          echo "PYTHONPATH=${{ github.workspace }}:${{ github.workspace }}/chronus" >> "$GITHUB_ENV"
      - name: Exact specification and inventory tests
        run: >-
          python -m pytest -q
          turing_universal_quantum_computer/tests/test_turing_specification.py
          turing_universal_quantum_computer/tests/test_turing_inventory.py
          turing_universal_quantum_computer/tests/test_computation_certificates.py
          turing_universal_quantum_computer/tests/test_fold_certificate_exhaustive.py
          tests/test_turing_production_pipeline.py
          tests/test_turing_acceptance_gate.py
          tests/test_turing_release_packaging.py
      - name: Build deterministic digest fixture
        run: |
          python scripts/turing_digest_fixture.py > turing-digest-${{ matrix.python }}.txt
          python scripts/turing_vqc_digest_fixture.py \
            >> turing-digest-${{ matrix.python }}.txt
          COMMIT_TIME="$(git show -s --format=%cI "$GITHUB_SHA")"
          python -m turing_universal_quantum_computer.turing_core.inventory \
            . --commit "$GITHUB_SHA" --timestamp "$COMMIT_TIME" \
            --output turing-discovery-${{ matrix.python }}.json
          python scripts/turing_acceptance_gate.py \
            --report turing-discovery-${{ matrix.python }}.json \
            --output turing-acceptance-${{ matrix.python }}.json
          python -c 'import json; print(json.load(open("turing-discovery-${{ matrix.python }}.json"))["report_digest"])' \
            >> turing-digest-${{ matrix.python }}.txt
          python -c 'import json; print(json.load(open("turing-acceptance-${{ matrix.python }}.json"))["acceptance_digest"])' \
            >> turing-digest-${{ matrix.python }}.txt
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: turing-digest-${{ matrix.python }}
          path: |
            turing-digest-${{ matrix.python }}.txt
            turing-discovery-${{ matrix.python }}.json
            turing-acceptance-${{ matrix.python }}.json

  cross-version:
    name: Cross-version digest equality
    needs: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: turing-digest-*
          merge-multiple: true
      - name: Require one identical digest
        run: |
          test "$(sha256sum turing-digest-*.txt | cut -d' ' -f1 | sort -u | wc -l)" -eq 1
          test "$(sha256sum turing-discovery-*.json | cut -d' ' -f1 | sort -u | wc -l)" -eq 1
          test "$(sha256sum turing-acceptance-*.json | cut -d' ' -f1 | sort -u | wc -l)" -eq 1
          cat turing-digest-*.txt

  lean:
    name: Lean 4 proofs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: proofs/lean
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: turing_universal_quantum_computer/formal
