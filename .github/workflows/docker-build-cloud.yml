name: Docker Build Cloud Packages and Images

on:
  push:
    branches:
      - main
      - elevation/euclid-intelligence-elevation
    tags:
      - 'v*.*.*'
  pull_request:
    paths:
      - 'Dockerfile'
      - 'Dockerfile.hybrid'
      - 'chronus/**'
      - 'packages/**'
      - 'frontend/**'
      - '.github/workflows/docker-build-cloud.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        package:
          - name: pythia-control
            file: Dockerfile
            context: .
            description: Unified PYTHIA control plane and operator console
          - name: pythia-miner
            file: chronus/mla1517_platform/Dockerfile.headless_miner
            context: .
            description: Headless mining and execution engine
          - name: pythia-hybrid
            file: Dockerfile.hybrid
            context: .
            description: Hybrid CPU/iGPU/remote mining engine
          - name: chronus-one-igpu
            file: packages/chronos-one-igpu/Dockerfile
            context: .
            description: Chronus virtual one-iGPU acceleration package
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU for multi-platform build
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
          buildkitd-flags: --debug

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || 'phienterprise' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: phienterprise/${{ matrix.package.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,prefix=sha-
            type=ref,event=branch
            type=ref,event=tag

      - name: Build and push ${{ matrix.package.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.package.context }}
          file: ${{ matrix.package.file }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
