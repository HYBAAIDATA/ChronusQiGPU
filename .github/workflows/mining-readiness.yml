name: Mining regression checks
on:
  pull_request:
    paths:
      - src/chronus/**
      - tests/**
      - packages/hyba_mine/**
      - deploy/hyba-mine/**
      - pyproject.toml
      - Dockerfile
      - .dockerignore
      - packages/turing/**
      - tools/verify_galois_invariant.py
      - rules/ast-grep/**
      - .coderabbit.yaml
      - scripts/benchmarks/triad_grover_k32.py
      - .github/workflows/mining-readiness.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e packages/turing -e '.[dev,mining]'
      - name: Authored search and Stratum regression tests (synthetic work only)
        run: >-
          python -m pytest -q tests/test_mining_env_config.py tests/test_mining_readiness.py tests/test_behavioral_live_runner.py
          tests/test_behavioral_stratum_lifecycle.py tests/test_stratum_replay.py
          tests/test_stratum_pool.py tests/test_gatekeeper.py tests/test_bip310.py
          tests/test_sharding.py tests/test_endian_engine.py tests/test_rate_limiter.py
          tests/test_geometric_galois_miner.py tests/test_extension_search.py tests/test_hendrix_galois.py
          tests/test_hendrix_oracles.py tests/test_hendrix_structured.py
          tests/test_turing.py packages/turing/tests tests/test_scaling_paths.py
          tests/test_pv_scale_fleet.py tests/test_fleet_adapters.py tests/test_lattice.py
          tests/test_folded_state.py
      - name: Exact Galois parity and measured scale arithmetic
        run: python tools/verify_galois_invariant.py --output "$RUNNER_TEMP/mining-galois-invariant.json"
      - name: Retain measured Galois parity evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mining-galois-python-${{ matrix.python }}
          path: ${{ runner.temp }}/mining-galois-invariant.json
          if-no-files-found: error
      - run: python deploy/hyba-mine/bist.py
  image-selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: docker build --target miner-runtime -t mining-base .
      - run: docker build -f deploy/hyba-mine/Dockerfile --build-arg BASE_IMAGE=mining-base -t mining-test .
      - name: Known-answer self-test with networking disabled
        run: docker run --rm --network none mining-test python /opt/hyba-mine/bist.py
      - name: Build local Stratum validation image
        run: docker build --target mining-check -t mining-check .
      - name: Synthetic Stratum and runtime checks with external networking disabled
        run: docker run --rm --network none mining-check

  triad-paired-mainnet:
    name: Paired historical mainnet Grover benchmark (software only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        bits: [12, 16]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[dev]'
      - name: Run existing paired benchmark on all 500 verified headers
        shell: bash
        run: |
          set -euo pipefail
          export BITS="${{ matrix.bits }}"
          mkdir -p "$RUNNER_TEMP/triad-evidence"
          python scripts/benchmarks/triad_grover_k32.py --headers tests/vectors/mainnet_975565_976064.json --window-bits "$BITS" --workers 2 --state "$RUNNER_TEMP/triad-state-$BITS" --out "$RUNNER_TEMP/triad-evidence/paired-$BITS.json"
          python - <<'PY'
          import hashlib, json, os, platform, statistics, sys
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "triad-evidence"
          raw = root / ("paired-" + os.environ["BITS"] + ".json")
          data = json.loads(raw.read_text())
          rows = data["rows"]
          assert len(rows) == 500
          assert len({r["height"] for r in rows}) == 500
          assert all(r["journal_continuity"] for r in rows)
          assert all(r["in"]["correct"] and r["in"]["verified"] and r["in"]["linear_hit"] == r["true_nonce"] for r in rows)
          assert all(not r["overfit"]["found"] and r["overfit"]["linear_hit"] is None for r in rows)
          summary = {"classification": "offline historical bounded CPU, not live mining or prediction", "commit": os.environ["GITHUB_SHA"], "python": sys.version, "platform": platform.platform(), "cpu_count": os.cpu_count(), "workers": data["workers"], "window_bits": data["window_bits"], "rows": len(rows), "known_hits": 500, "excluded_hits": 0, "wall_ns": data["wall_ns"], "raw_sha256": hashlib.sha256(raw.read_bytes()).hexdigest(), "corpus_sha256": hashlib.sha256(Path("tests/vectors/mainnet_975565_976064.json").read_bytes()).hexdigest(), "reopened_handles": sum(x["restored"] for x in data["restart"])}
          for side in ("in", "overfit"):
              summary[side] = {key: statistics.mean(r[side][key] for r in rows) for key in ("triad_evaluations", "linear_evaluations", "triad_compressions", "linear_compressions", "full_pipeline_ns", "linear_ns")}
          (root / "summary.json").write_text(json.dumps(summary, indent=2) + "\n")
          print(json.dumps(summary, indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: paired-mainnet-grover-w${{ matrix.bits }}
          path: ${{ runner.temp }}/triad-evidence/
          if-no-files-found: error
