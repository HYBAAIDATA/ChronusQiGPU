name: TURING enterprise service control contracts
on:
  pull_request:
    paths:
      - 'services/turing-enterprise/**'
      - 'al_haras/**'
      - 'turing_universal_quantum_computer/**'
      - 'packaging/turing/**'
      - 'packaging/wheelhouse/**'
      - '.github/workflows/turing-enterprise-service.yml'
  push:
    branches: [main]
    paths:
      - 'services/turing-enterprise/**'
      - 'al_haras/**'
      - 'turing_universal_quantum_computer/**'
      - 'packaging/turing/**'
      - 'packaging/wheelhouse/**'
      - '.github/workflows/turing-enterprise-service.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  control-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e 'services/turing-enterprise[server,test]' black build
      - run: python -m black --check --line-length 100 services/turing-enterprise/src services/turing-enterprise/tests
      - run: python -m pytest services/turing-enterprise/tests -q --junitxml=turing-service-tests.xml
      - run: python -m build services/turing-enterprise
      - run: |
          python -m venv /tmp/turing-installed
          /tmp/turing-installed/bin/pip install services/turing-enterprise/dist/*.whl fastapi uvicorn "PyJWT[crypto]" cryptography pytest httpx
          /tmp/turing-installed/bin/python -m pytest services/turing-enterprise/tests -q
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: turing-service-tests-${{ matrix.python }}
          path: turing-service-tests.xml
      # No publish, deployment, credentials or external billing actions.

  installed-canonical-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build twine pytest
      - run: python packaging/turing/build_wheel.py
      - run: python -m pip install --find-links packaging/wheelhouse packaging/turing/dist/*.whl 'services/turing-enterprise[server,test]'
      - run: python -m pytest services/turing-enterprise/integration -q --junitxml=turing-installed-runtime.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: turing-installed-runtime-${{ matrix.python }}
          path: turing-installed-runtime.xml
  reference-image:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - run: docker build --build-arg SOURCE_COMMIT=${{ github.sha }} -f services/turing-enterprise/deploy/Dockerfile -t turing-service:test .
      - run: docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:rw,nosuid,nodev,noexec,size=256m --entrypoint python turing-service:test -c 'from hyba_turing_service.runtime import ProcessRuntime; r=ProcessRuntime().run({"qasm":"OPENQASM 2.0; qreg q[1]; h q[0];","shots":8,"seed":1}); assert r["verdict"] == "PASS" and r["certificate"]'

  portal-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --ignore-scripts playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - run: node services/turing-enterprise/tests/portal-smoke.cjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: turing-portal-fixture-previews
          path: /tmp/turing-portal-preview
