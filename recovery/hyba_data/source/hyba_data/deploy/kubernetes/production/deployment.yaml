apiVersion: apps/v1
kind: Deployment
metadata:
  name: phigrover-api
  namespace: phigrover
  annotations:
    chaos.alpha.kubernetes.io/experiments: "network-latency,service-failure"
spec:
  replicas: 8
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 0
  selector:
    matchLabels:
      app: phigrover-api
      tier: backend
  template:
    metadata:
      labels:
        app: phigrover-api
        tier: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: api
        image: phigrover/api:2.0.0
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: redis-secrets
              key: url
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: jwt-secrets
              key: secret
        - name: PHI_POWER
          value: "12"
        resources:
          requests:
            memory: "4Gi"
            cpu: "2"
          limits:
            memory: "16Gi"
            cpu: "8"
        livenessProbe:
          httpGet:
            path: /api/v2/system/liveness
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/v2/system/readiness
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
        volumeMounts:
        - name: config
          mountPath: /app/config
        - name: models
          mountPath: /app/models
      volumes:
      - name: config
        configMap:
          name: phigrover-config
      - name: models
        persistentVolumeClaim:
          claimName: models-pvc
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: phigrover-api-hpa
  namespace: phigrover
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: phigrover-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  - type: Pods
    pods:
      metric:
        name: api_latency_p95
      target:
        type: AverageValue
        averageValue: 50ms
---
apiVersion: v1
kind: Service
metadata:
  name: phigrover-api
  namespace: phigrover
  annotations:
    prometheus.io/scrape: "true"
spec:
  selector:
    app: phigrover-api
    tier: backend
  ports:
  - port: 8000
    targetPort: 8000
    name: http
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: phigrover-api-ingress
  namespace: phigrover
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-burst: "200"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - api.phigrover.io
    secretName: phigrover-tls
  rules:
  - host: api.phigrover.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: phigrover-api
            port:
              number: 8000
