groups:
  - name: chronus.rules
    rules:
      # Chronus API availability
      - alert: ChronusAPIDown
        expr: up{job="chronus-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Chronus API is down"
          description: "Chronus API has been unavailable for more than 2 minutes"

      # High error rate
      - alert: ChronusHighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High error rate detected"
          description: "Chronus API error rate exceeds 10%"

      # High latency
      - alert: ChronusHighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 1.0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High latency detected"
          description: "95th percentile latency exceeds 1 second"

      # Database connection pool exhaustion
      - alert: DBConnectionPoolExhaustion
        expr: chronus_db_connections_active > chronus_db_connections_pool_size * 0.9
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Database connection pool exhaustion"
          description: "Database connection pool is at 90% capacity"

      # No database heartbeat
      - alert: DatabaseUnhealthy
        expr: chronoitus_db_health_status != 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Database health check failed"
          description: "Database is unhealthy or unreachable"

      # Workload queue backlog
      - alert: WorkloadQueueBacklog
        expr: chronus_pending_workloads > 1000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Large workload backlog"
          description: "Pending workload queue has exceeded 1000 items"

      # Workload failures
      - alert: WorkloadFailureRate
        expr: rate(chronus_workload_failed_total[5m]) / rate(chronus_workload_total[5m]) > 0.05
        for: 5m
        labels:
          severity: info
        annotations:
          summary: "High workload failure rate"
          description: "Workload failure rate exceeds 5%"

      # Failure injection triggered
      - alert: FailureInjectionActive
        expr: chronus_failure_injections_active > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Active failure injection"
          description: "Chaos engineering failure injection is active"
