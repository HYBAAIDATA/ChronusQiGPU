name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  PYTHONUNBUFFERED: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  node:
    name: Node — typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - name: Typecheck (tsc --noEmit)
        run: npm run lint
      - name: Unit tests (vitest)
        run: npm run test:ts
      - name: Build (vite)
        run: npm run build

  python:
    name: Python — lint, unit tests, compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ./turing_universal_quantum_computer -e ".[ml,dev]"
      - name: Lint (flake8)
        # Ratchet: lint every Python file this change touches. A repo-wide
        # count fails on thousands of pre-existing violations the
        # consolidation inherited (measured: 9391 on main), so the gate
        # enforces lint-clean on files the change touches instead.
        run: |
          BASE="${{ github.base_ref || 'main' }}"
          git fetch --depth=1 origin "$BASE"
          CHANGED=$(git diff --name-only --diff-filter=d "origin/$BASE"...HEAD -- '*.py')
          if [ -n "$CHANGED" ]; then python -m flake8 --count $CHANGED; else echo "no changed .py files"; fi
      - name: Fatal lint gate (ruff E9/F)
        # Same ratchet as flake8: 209 pre-existing E9/F findings sit on main;
        # the fatal gate keeps its teeth on every file this change touches.
        run: |
          BASE="${{ github.base_ref || 'main' }}"
          git fetch --depth=1 origin "$BASE"
          CHANGED=$(git diff --name-only --diff-filter=d "origin/$BASE"...HEAD -- '*.py')
          if [ -n "$CHANGED" ]; then python -m ruff check --select E9,F $CHANGED; else echo "no changed .py files"; fi
      - name: Clean-wheel remote GPU smoke test
        run: |
          rm -rf dist /tmp/pythia-wheel-smoke
          python -m pip wheel . --no-deps --wheel-dir dist
          python -m venv /tmp/pythia-wheel-smoke
          # The wheel declares turing-universal-quantum-computer, which is not
          # on PyPI — install the in-tree package beside it (per pyproject).
          /tmp/pythia-wheel-smoke/bin/pip install --quiet numpy ./turing_universal_quantum_computer dist/*.whl
          cd /tmp
          /tmp/pythia-wheel-smoke/bin/python - <<'PY'
          import json
          import threading
          import urllib.request
          from mining.bitcoin_hasher import BitcoinHasher
          from chronus.mla1517.remote_gpu_agent import build_server
          assert BitcoinHasher
          server = build_server("127.0.0.1", 0)
          thread = threading.Thread(target=server.serve_forever, daemon=True)
          thread.start()
          try:
              url = f"http://127.0.0.1:{server.server_address[1]}/v1/health"
              payload = json.load(urllib.request.urlopen(url, timeout=5))
              assert payload["protocol"] == "remote_opencl_v2"
          finally:
              server.shutdown()
              server.server_close()
          PY
      - name: Import audit (every local import resolves; none hidden)
        run: python scripts/import_audit.py
      - name: Import graph (no new import cycles or layer violations)
        run: python scripts/import_graph.py cycles && python scripts/import_graph.py layers
      - name: Unit tests (pytest)
        run: python -m pytest tests/ -x -q
      # The virtual quantum computer is part of the miner; its own tests run
      # from its folder so the installed package, not the folder, is imported.
      - name: Virtual quantum computer tests
        working-directory: turing_universal_quantum_computer
        run: python -m pytest tests -q
      - name: Byte-compile all Python sources
        run: python -m compileall -q Intelligence core_engine mining hyba lucas pythagoras scripts tests chronus aethel l_hras bench experiments

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: pythia-coverage-report
          path: coverage.xml
          retention-days: 30

  deploy-sentry:
    name: Deploy sentry — config, dependency, native-build and CI wiring
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Scan for deploy pitfalls (errors fail; warnings are reported)
        run: python -m scripts.deploy_sentry
      - name: Enforce deployment claims boundary
        run: python -m scripts.deployment_claims_gate

  python-selftest:
    name: Python — Intelligence self-test (ML stack)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies with ML extras
        run: pip install -e ./turing_universal_quantum_computer -e ".[ml]"
      - name: Fetch NLTK resources (vader_lexicon for toe.PredictiveEngine)
        run: python -c "import nltk; nltk.download('vader_lexicon', quiet=True)"
      - name: Run Intelligence self-test
        run: python -u -X utf8 -m Intelligence.self_test
