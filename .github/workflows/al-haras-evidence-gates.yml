name: AL HARAS Evidence Gates

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  statuses: write
  pull-requests: read

concurrency:
  group: al-haras-evidence-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence-gates:
    name: Contracts, gates, and published evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bash scripts/ci_install.sh ""
      - name: Contract tests
        run: make assurance-gates
      - name: Execute all applicable gates
        run: make -k gates || true
        env:
          MEDIATION_MANIFEST_KEY: ${{ secrets.MEDIATION_MANIFEST_KEY || 'ci-mediation-manifest-key' }}
      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: al-haras-gate-results-${{ github.sha }}
          path: results/
      - name: Publish gate check runs
        if: always()
        run: make publish-checks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Enforce roll-up
        if: always()
        run: make gate-rollup
