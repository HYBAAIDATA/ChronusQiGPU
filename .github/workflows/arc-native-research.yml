name: ARC native runtime research execution
on:
  push:
    branches: [research/arc-native-20261023]
    paths:
      - .github/workflows/arc-native-research.yml
      - euclid/benchmarks/arc_agi_1/remote_preflight.py
permissions:
  contents: write
concurrency:
  group: arc-native-research
  cancel-in-progress: true
jobs:
  canonical-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Record actual job start before dependency installation
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p euclid/benchmarks/arc_agi_1/native_execution
          python - <<'PYMARK'
          import json, os, datetime
          from pathlib import Path
          Path('euclid/benchmarks/arc_agi_1/native_execution/started.json').write_text(json.dumps({'source_sha':os.environ['SOURCE_SHA'],'run_id':os.environ['RUN_ID'],'started_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'stage':'checkout-complete-before-install','runtime_instantiated':False},indent=2)+'\n')
          PYMARK
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- euclid/benchmarks/arc_agi_1/native_execution/started.json
          git commit -m "evidence(euclid): native research job started ${RUN_ID} [skip ci]"
          git fetch origin ${{ github.ref_name }}
          git rebase FETCH_HEAD
          git push origin HEAD:${{ github.ref_name }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install repository-defined distributions
        timeout-minutes: 8
        run: |
          mkdir -p euclid/benchmarks/arc_agi_1/native_execution
          set -o pipefail
          bash scripts/ci_install.sh '' 2>&1 | tee euclid/benchmarks/arc_agi_1/native_execution/install.log
      - name: Instantiate canonical runtime and record native interface evidence
        timeout-minutes: 6
        env:
          PYTHONHASHSEED: '0'
        run: |
          set -o pipefail
          python euclid/benchmarks/arc_agi_1/remote_preflight.py 2>&1 | tee euclid/benchmarks/arc_agi_1/native_execution/runtime.log
      - name: Preserve execution evidence on isolated research branch
        if: always()
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p euclid/benchmarks/arc_agi_1/native_execution
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path('euclid/benchmarks/arc_agi_1/native_execution/job.json').write_text(json.dumps({k:os.environ[k] for k in ('SOURCE_SHA','RUN_ID','JOB_STATUS')},indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- euclid/benchmarks/arc_agi_1/native_execution
          git diff --cached --quiet || git commit -m "evidence(euclid): native runtime execution ${RUN_ID} [skip ci]"
          git fetch origin ${{ github.ref_name }}
          git rebase FETCH_HEAD
          git push origin HEAD:${{ github.ref_name }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: euclid-native-preflight-${{ github.run_id }}
          path: euclid/benchmarks/arc_agi_1/native_execution
