name: Packages

# Builds and checks HYBA's internal distributions on every pull request and on
# main. hyba-chronus and hyba-turing must ship disjoint packages, carry the
# private classifier and contain only modules that compile, and the TURING
# tests must pass against the installed wheel with no access to the source tree.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wheels:
    name: Build and check internal wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install build twine
      - name: Build hyba-chronus and hyba-turing
        run: |
          python -m build --outdir dist/chronus .
          python -m build --outdir dist/turing packages/turing
      - run: twine check dist/chronus/* dist/turing/*
      - name: Private classifier, disjoint packages, compiling modules, no working files
        run: python scripts/ci/check_wheels.py dist/chronus dist/turing
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: internal-wheels
          path: dist/
          retention-days: 7

  turing-isolated:
    name: TURING from its wheel (Python ${{ matrix.python }})
    needs: wheels
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: internal-wheels
          path: dist
      - run: python -m pip install dist/turing/*.whl 'pytest>=8'
      - name: Run the TURING tests outside the source tree
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/turing-isolated"
          mkdir -p "$work"
          cp -r packages/turing/tests "$work/tests"
          cp tests/test_turing.py "$work/tests/test_exact_layer.py"
          cd "$work"
          python -m pytest -q -p no:cacheprovider tests
          python -c "import sys, turing; assert 'site-packages' in turing.__file__, turing.__file__; assert 'chronus' not in sys.modules; print('turing', turing.__version__, turing.__file__)"

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install ruff
      - name: No temporary or diagnostic workflows
        run: python scripts/ci/check_no_temporary_workflows.py
      - name: Lint the consolidated namespaces, TURING and the packaging scripts
        run: ruff check --select F src/chronus/hermes src/chronus/ovid src/chronus/theseus src/chronus/geodesic src/chronus/igpu packages/turing/src scripts/ci/check_wheels.py scripts/ci/check_no_temporary_workflows.py
      - name: Every module in the distributions compiles
        run: python -m compileall -q src/chronus packages/turing/src
