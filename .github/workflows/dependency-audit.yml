name: Dependency Audit & SBOM

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # Weekly Monday 06:00 UTC

permissions:
  contents: read

jobs:
  pip-audit:
    name: Python dependency advisory audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit
      - name: Audit Python dependencies
        run: |
          pip-audit -r <(pip install --dry-run -e "./turing_universal_quantum_computer" -e ".[dev,ml]" 2>&1 | grep "^Would install" | sed 's/Would install //;s/ /==/g') --strict || \
          pip-audit --strict --skip-editable
  npm-audit:
    name: Node dependency advisory audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Audit frontend dependencies
        run: |
          npm ci --prefix frontend
          npm audit --prefix frontend --audit-level=high

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install cyclonedx-bom
        run: pip install cyclonedx-bom
      - name: Generate Python SBOM (SPDX)
        run: |
          mkdir -p artifacts/sbom
          pip install --dry-run -e "./turing_universal_quantum_computer" -e ".[dev]" 2>/dev/null || true
          cyclonedx-py requirements -o artifacts/sbom/pythia-pip.spdx.json --schema-version 1.5 || true
      - name: Generate Node SBOM (SPDX)
        run: |
          npm ci --prefix frontend 2>/dev/null || true
          npx --yes @cyclonedx/cyclonedx-npm --prefix frontend --output-format json --output-file artifacts/sbom/pythia-npm.spdx.json || true
      - name: Verify SBOM artifacts
        run: |
          test -s artifacts/sbom/pythia-pip.spdx.json || echo "::warning::Python SBOM generation incomplete"
          test -s artifacts/sbom/pythia-npm.spdx.json || echo "::warning::Node SBOM generation incomplete"
      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pythia-sbom
          path: artifacts/sbom/
          retention-days: 90
