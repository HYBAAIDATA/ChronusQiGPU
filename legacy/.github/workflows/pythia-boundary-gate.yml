name: PYTHIA Boundary Contract Gate

on:
  push:
    branches: [main, codex/phidata2-pythia-literature-boundary, toe/elevation-expansion]
  pull_request:
    branches: [main]
    paths:
      - 'STRICT_QUANTUM_BOUNDARY.md'
      - 'mla1517_platform_v3.4/python/mla1517/mining/**'
      - 'mla1517_platform_v3.4/python/coordinator.py'
      - 'mla1517_platform_v3.4/python/test_literature_boundary.py'
      - '.github/workflows/pythia-boundary-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pythia-boundary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boundary-contracts:
    name: Boundary contracts — compile and focused tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mla1517_platform_v3.4
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install canonical test package
        run: python -m pip install --upgrade pip && python -m pip install -e '.[test]'
      - name: Compile canonical Python tree
        run: python -m compileall -q python
      - name: Run boundary contract tests
        env:
          PYTHONPATH: python
        run: python -m unittest discover -s python -p 'test_literature_boundary.py' -v
      - name: Run import-use boundary audit
        env:
          PYTHONPATH: python
        run: python scripts/literature_boundary_audit.py
      - name: Assert boundary categories and required citations
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('../STRICT_QUANTUM_BOUNDARY.md').read_text()
          required = (
              'SHA256d mining boundary',
              'Quantum-search theory',
              'Signature migration',
              'Quantum-sampling PoW',
              'Proof-of-quantum-work blockchains',
              'QRNG claims',
              '2401.10902',
              '2603.25519',
              '2606.14484',
              '2503.14462',
              '2110.00878',
              '2607.23952',
              '2403.08023',
          )
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'missing boundary evidence: {missing}')
          print('PASS — boundary categories and citations are present')
          PY
