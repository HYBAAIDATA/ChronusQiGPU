# Public naming is approved; first-public version is 1.0.0.
# Development/research version reconciled to the first-public identity.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hyba-pythia-mining-runtime"
version = "1.0.0"
description = "Truth-labelled Python mining control plane with MLA1517/OpenCL integration"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "pyyaml>=6.0,<7",
    # The virtual quantum computer (in-tree: ../turing_universal_quantum_computer)
    # is part of the miner: the Hendrix nonce order and the VQC policy audit.
    # Install it beside this package: pip install ../turing_universal_quantum_computer .
    "hyba-turing-vqc>=1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4,<10",
]
opencl = [
    "pyopencl>=2024.1",
]
telemetry = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29,<1",
]

[project.scripts]
mla1517 = "chronus.mla1517.cli:main"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["python"]
addopts = "-ra"

[tool.black]
line-length = 100
target-version = ["py311", "py312", "py313"]
