name: TOE Tensor Elevation

on:
  pull_request:
    paths:
      - "toe.py"
      - "Intelligence/toe_tensor_ml.py"
      - "Intelligence/toe_exact_field.py"
      - "Intelligence/toe_*.py"
      - "mla1517_platform_v3.4/python/control_api.py"
      - "mla1517_platform_v3.4/python/startup_contract.py"
      - "tests/test_toe_tensor_ml.py"
      - "tests/test_startup_contract.py"
      - "tests/test_toe_expansion_contract.py"
      - "CHANGELOG.md"
      - ".github/workflows/toe-tensor.yml"
  push:
    branches:
      - main
      - "toe/**"
    paths:
      - "toe.py"
      - "Intelligence/toe_tensor_ml.py"
      - "Intelligence/toe_exact_field.py"
      - "Intelligence/toe_*.py"
      - "mla1517_platform_v3.4/python/control_api.py"
      - "mla1517_platform_v3.4/python/startup_contract.py"
      - "tests/test_toe_tensor_ml.py"
      - "tests/test_startup_contract.py"
      - "tests/test_toe_expansion_contract.py"
      - "CHANGELOG.md"
      - ".github/workflows/toe-tensor.yml"

jobs:
  tensor-contracts:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install TOE test dependencies
        run: python -m pip install --upgrade pip numpy pandas
      - name: Compile Python sources
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/mla1517_platform_v3.4/python
        run: python -m py_compile toe.py Intelligence/toe_tensor_ml.py Intelligence/toe_exact_field.py mla1517_platform_v3.4/python/control_api.py mla1517_platform_v3.4/python/startup_contract.py
      - name: Run original TOE and tensor hardening suites
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/mla1517_platform_v3.4/python
        run: python -m unittest toe.py tests.test_toe_tensor_ml tests.test_startup_contract
      - name: Run TOE expansion suite
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/mla1517_platform_v3.4/python
        run: python tests/test_toe_expansion_contract.py
      - name: Enforce import purity
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/mla1517_platform_v3.4/python
        run: |
          python - <<'PY'
          import sys
          import toe
          forbidden = {"sklearn", "xgboost", "lightgbm", "joblib"}
          loaded = forbidden.intersection(sys.modules)
          assert not loaded, f"forbidden modules loaded: {sorted(loaded)}"
          assert toe.__version__ == "3.5.0"
          PY