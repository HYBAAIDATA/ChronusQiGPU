name: Hardware Acceptance
on:
  workflow_dispatch:
    inputs:
      device_id: {required: true, type: string}
      commit_sha: {required: true, type: string}
permissions:
  contents: read
  checks: write
  statuses: write
jobs:
  strict-hardware:
    runs-on: [self-hosted, opencl, '${{ inputs.device_id }}']
    environment: hardware-acceptance
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ inputs.commit_sha }}'}
      - name: Existing strict hardware gate
        id: strict_hardware
        continue-on-error: true
        run: MLA1517_STRICT_HARDWARE_CI=1 MLA1517_GPU_BACKEND=opencl make strict-hardware-gate
      - name: Chronus production measurement
        id: chronus_measurement
        continue-on-error: true
        run: >-
          python -m chronus.measurement.production
          --full
          --require-device
          --require-persistent-attestation
          --output results/chronus_production_measurement.json
        env:
          CHRONUS_MEASUREMENT_HMAC_KEY: '${{ secrets.CHRONUS_MEASUREMENT_HMAC_KEY }}'
      - name: Upload hardware evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 'strict-hardware-report-${{ inputs.device_id }}'
          path: |
            results/strict_hardware_report.json
            results/chronus_production_measurement.json
          if-no-files-found: warn
      - name: Publish check runs
        if: always()
        run: python scripts/publish_check_runs.py
        env: {GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
      - name: Enforce hardware acceptance result
        if: always()
        run: |
          test '${{ steps.strict_hardware.outcome }}' = 'success'
          test '${{ steps.chronus_measurement.outcome }}' = 'success'
