name: THESEUS and OVID publication preparation

on:
  pull_request:
    paths:
      - 'aethel/**'
      - 'hyba_db/**'
      - 'packaging/theseus/**'
      - 'packaging/ovid/**'
      - 'packaging/storage-release/**'
      - 'tests/test_storage_publication_preparation.py'
      - '.github/workflows/storage-publication-preparation.yml'
  workflow_dispatch:
    inputs:
      rc_sha:
        description: Full frozen storage candidate SHA, matching dispatch head
        required: true
        type: string

permissions:
  contents: read

env:
  RC_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  preparation-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RC_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify candidate identity and packaging guards
        run: |
          test "$(git rev-parse HEAD)" = "$RC_SHA"
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            test "${{ inputs.rc_sha }}" = "${{ github.sha }}"
          fi
          python -m unittest discover -s tests -p test_storage_publication_preparation.py -v

  installed-candidates:
    needs: preparation-guards
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RC_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install build and source-test tooling
        run: python -m pip install build twine pytest 'numpy>=1.26,<3'
      - name: Build unchanged canonical artifacts and execute installed voyages
        run: python packaging/storage-release/build_and_verify.py --product all --source-tests
      - name: Retain actual outcomes, including failed candidate diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storage-candidates-${{ matrix.python }}
          path: |
            packaging/theseus/dist/
            packaging/ovid/dist/
          if-no-files-found: error

# Deliberately no OIDC upload job. Public naming approval, real registry smoke,
# promotion receipts and publication authorization must be resolved separately.
# A successful preparation workflow is not a production certificate.
