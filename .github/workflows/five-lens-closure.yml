name: Five-lens closure
on:
  pull_request:
    paths:
      - 'src/chronus/service/ipmvp.py'
      - 'tests/test_ipmvp.py'
      - 'scripts/ci/check_five_lens_closure.py'
      - 'scripts/benchmarks/fold_residency_campaign.py'
      - 'tests/test_fold_residency_campaign.py'
      - 'docs/settlement/**'
      - 'docs/analysts/**'
      - 'docs/executive/**'
      - 'evidence/five_lens/**'
      - 'evidence/residency/**'
      - 'evidence/tei/**'
      - 'go_to_market/**'
      - 'deploy/reference_architectures/**'
      - 'claims/**'
      - 'STATUS.md'
      - '.github/workflows/five-lens-closure.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install project
        run: python -m pip install -e '.[test]'
      - name: Run exact arithmetic and paired trace tests
        run: python -m pytest -q -rs -o addopts= tests/test_ipmvp.py tests/test_fold_residency_campaign.py --junitxml=five-lens-tests.xml
      - name: Execute pre-registered residency campaign
        run: |
          python scripts/benchmarks/fold_residency_campaign.py --output-dir campaign-output
          cat campaign-output/*/campaign.json
          sha256sum campaign-output/*/campaign.json
      - name: Enforce closure (open findings fail)
        run: python scripts/ci/check_five_lens_closure.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: five-lens-evidence
          path: |
            five-lens-tests.xml
            campaign-output/**/campaign.json
            reference-evidence/five-lens-closure.json
          if-no-files-found: error
