# ---------------------------------------------------------------------------
# Critical user journeys (§6). Steps reference api_ids in the registry;
# journeys are the executive production indicators and the target of the
# production resilience voyages (§33).
# ---------------------------------------------------------------------------
journeys:
  journey_a_mining:
    title: Mining — stratum job to pool verdict to learning
    tier: R1
    steps: [stratum.v1, euclid.orchestration, pythia.mining.control, chronus.execution, pythia.worker_heartbeat, pythia.mining.evidence]
    voyage: voyage_1_healthy_mining
    executive_indicator: true
  journey_b_turing_certified:
    title: Certified TURING execution — request to custody-verified replay
    tier: R2
    steps: [euclid.orchestration, turing.vqc_pipeline, theseus.custody]
    voyage: voyage_3_specialist_unavailable
    executive_indicator: true
  journey_c_chronus_execution:
    title: CHRONUS execution — workload to custody receipt
    tier: R1
    steps: [chronus.execution, chronus.remote_opencl_v2, theseus.custody]
    voyage: voyage_4_execution_outage
    executive_indicator: true
  journey_d_kellogg_tensor:
    title: KELLOGG tensor — validated operation to provenance custody
    tier: R2
    steps: [kellogg.tensor.execute, kellogg.tensor.runtime, theseus.custody]
    executive_indicator: true
  journey_e_ovid_transform:
    title: OVID transformation — contract to equivalence to lineage custody
    tier: R2
    steps: [ovid.transform, theseus.custody]
    executive_indicator: true
  journey_f_salamander_recovery:
    title: SALAMANDER recovery — fault to verified remediation evidence
    tier: R3
    steps: [salamander.fault, salamander.control_plane, theseus.custody]
    executive_indicator: true
  journey_g_security_denial:
    title: Security denial — AL HARAS deny, zero downstream mutation, audit evidence
    tier: R0
    steps: [al_haras.security.evaluate, al_haras.guardian]
    voyage: voyage_5_security_denial
    executive_indicator: true

production_voyages:
  voyage_1_healthy_mining:
    journey: journey_a_mining
    description: operator → API → AL HARAS → PYTHIA → Hendrix → CHRONUS/TURING/KELLOGG as selected → SHA256d → Stratum → evidence
    status_local: executed via test_production_api_contract.py voyages + offline stratum fixtures
  voyage_2_authority_outage:
    journey: journey_a_mining
    description: THESEUS unavailable → custody-requiring operation fails → no false completion
    status_local: executed via tests/test_fault_injection.py
  voyage_3_specialist_unavailable:
    journey: journey_b_turing_certified
    description: TURING unavailable → explicit result → only authorised alternative selectable
    status_local: executed via tests/test_fault_injection.py
  voyage_4_execution_outage:
    journey: journey_c_chronus_execution
    description: CHRONUS unavailable → bounded failure → no fake execution → Salamander observes
    status_local: executed via tests/test_fault_injection.py
  voyage_5_security_denial:
    journey: journey_g_security_denial
    description: AL HARAS deny → zero downstream mutation
    status_local: executed via tests/test_fault_injection.py + contract suite denials
  voyage_6_recovery:
    description: mid-operation termination → restart → recover/reconcile → same authoritative state
    status_local: executed via tests/test_stateful_recovery.py

# ---------------------------------------------------------------------------
# SLO policy (§7-8). Dimensions are measured where a baseline exists;
# unmeasured targets are declared UNMEASURED, never invented.
# ---------------------------------------------------------------------------
