name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - name: Test and measure coverage
        env:
          CHRONUS_WORKLOAD_DB_PATH: ${{ runner.temp }}/chronus-tests.sqlite3
        run: python -m pytest -q --cov=chronus.execution --cov=chronus.backends --cov=chronus.service --cov=chronus.sdk --cov=chronus.security --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-python-${{ matrix.python }}
          path: coverage.xml
          if-no-files-found: warn

  quality-and-package:
    name: Lint, compile and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]' ruff build twine
      - name: Lint active implementation
        run: ruff check --select F src/chronus/execution src/chronus/backends src/chronus/service src/chronus/sdk src/chronus/security tests
      - name: Compile active implementation
        run: python -m compileall -q src/chronus/config.py src/chronus/execution src/chronus/backends src/chronus/service src/chronus/sdk src/chronus/security
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-distribution
          path: dist/

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pip-audit
      - run: pip-audit

  static-security:
    name: Static security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install bandit
      - run: bandit -q -r src/chronus/execution src/chronus/backends src/chronus/service src/chronus/sdk src/chronus/security -ll -ii

  infrastructure:
    name: Azure Bicep validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: az bicep build --file infra/azure/main.bicep --stdout > "$RUNNER_TEMP/azure-template.json"

  opencl-reference:
    name: OpenCL kernel on CPU reference runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq pocl-opencl-icd
      - run: python -m pip install -e '.[dev,accelerator]'
      - name: Require an OpenCL CPU device
        run: python -c "import pyopencl as cl; assert any(d.type & cl.device_type.CPU for p in cl.get_platforms() for d in p.get_devices())"
      - run: python -m pytest -q tests/test_opencl_kernel.py

  rtl-synthesis:
    name: Phi-ALU RTL simulation and Yosys synthesis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq yosys iverilog
      - name: Run known-answer testbenches
        run: |
          iverilog -g2012 -o tb_phi hw/tb_qigpu_phi_alu.sv hw/zeckendorf_norm_alu.sv
          ./tb_phi | tee rtl-testbench.log
          iverilog -g2012 -o tb_32lane hw/tb_zeckendorf_alu_32lane.sv hw/zeckendorf_alu_32lane.sv
          ./tb_32lane | tee -a rtl-testbench.log
          test "$(grep -c 'TB PASS' rtl-testbench.log)" -eq 2
      - name: Synthesize with Yosys
        run: |
          yosys -Q -T -p 'read_verilog -sv hw/zeckendorf_norm_alu.sv; hierarchy -check -top qigpu_phi_alu; synth -top qigpu_phi_alu; stat' | tee yosys-report.txt
          yosys -Q -T -p 'read_verilog -sv hw/zeckendorf_alu_32lane.sv; hierarchy -check -top qigpu_zeckendorf_alu_32lane; synth -top qigpu_zeckendorf_alu_32lane; stat' | tee -a yosys-report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rtl-synthesis-report
          path: |
            rtl-testbench.log
            yosys-report.txt
          if-no-files-found: error

  container:
    name: Container build and restart smoke test
    runs-on: ubuntu-latest
    env:
      CHRONUS_SMOKE_TOKEN: ci-example-token
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t chronus-ci:${{ github.sha }} .
      - name: Exercise authenticated workload and restart
        shell: bash
        run: |
          set -euo pipefail
          container_id=$(docker run -d -p 127.0.0.1::8000 -e 'CHRONUS_TENANT_TOKENS={"ci":"ci-example-token"}' chronus-ci:${{ github.sha }})
          trap 'docker rm -f "$container_id" >/dev/null' EXIT
          port=$(docker port "$container_id" 8000/tcp | sed 's/.*://')
          export CHRONUS_SMOKE_URL="http://127.0.0.1:$port"
          for attempt in {1..30}; do
            if curl -fsS "$CHRONUS_SMOKE_URL/health/ready" >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS "$CHRONUS_SMOKE_URL/health/ready" >/dev/null
          workload_id=$(python tests/container_smoke.py submit)
          docker restart "$container_id" >/dev/null
          port=$(docker port "$container_id" 8000/tcp | sed 's/.*://')
          export CHRONUS_SMOKE_URL="http://127.0.0.1:$port"
          for attempt in {1..30}; do
            if curl -fsS "$CHRONUS_SMOKE_URL/health/ready" >/dev/null; then break; fi
            sleep 1
          done
          python tests/container_smoke.py verify "$workload_id"
