apiVersion: v1
kind: ConfigMap
metadata:
  name: hyba-frontend-config
  namespace: hyba-frontend
  labels:
    app.kubernetes.io/name: hyba-frontend
    app.kubernetes.io/part-of: hyba-mining
data:
  NODE_ENV: "production"
  NEXT_TELEMETRY_DISABLED: "1"
  NEXT_PUBLIC_API_URL: "https://api.hybamine.com"
  NEXT_PUBLIC_WS_URL: "wss://api.hybamine.com/ws/manifold"
  NEXT_PUBLIC_TURING_WS_URL: "wss://api.hybamine.com/ws/manifold"
  NEXT_PUBLIC_GRAPHQL_URL: "https://api.hybamine.com/graphql"
  NEXT_PUBLIC_ENABLE_ANALYTICS: "true"
  NEXT_PUBLIC_ENABLE_INTELLIGENCE_METRICS: "true"
  NEXT_PUBLIC_ENABLE_QUANTUM_VISUALIZATION: "true"
  NEXT_PUBLIC_ENABLE_AUTH: "true"
  DB_NAME: "pythagoras"
  CORS_ORIGINS: "https://hybamine.com,https://www.hybamine.com"
