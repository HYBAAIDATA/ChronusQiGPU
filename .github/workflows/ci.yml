name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  PYTHONUNBUFFERED: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  node:
    name: Node — typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate private Devin plugins
        run: node scripts/validate-plugins.mjs
      - run: npm ci --prefix frontend
      - name: Typecheck (tsc --noEmit)
        run: npm run lint
      - name: Unit tests (vitest)
        run: npm run test:ts
      - name: Build (vite)
        run: npm run build

  python:
    name: Python — lint, unit tests, compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: bash scripts/ci_install.sh "ml,dev,graph"
      - name: Lint (flake8)
        run: |
          BASE="${{ github.base_ref || 'main' }}"
          git fetch --depth=1 origin "$BASE"
          CHANGED=$(git diff --name-only --diff-filter=d "origin/$BASE"...HEAD -- '*.py')
          if [ -n "$CHANGED" ]; then python -m flake8 --count $CHANGED; else echo "no changed .py files"; fi
      - name: Fatal lint gate (ruff E9/F)
        run: |
          BASE="${{ github.base_ref || 'main' }}"
          git fetch --depth=1 origin "$BASE"
          CHANGED=$(git diff --name-only --diff-filter=d "origin/$BASE"...HEAD -- '*.py')
          if [ -n "$CHANGED" ]; then python -m ruff check --select E9,F $CHANGED; else echo "no changed .py files"; fi
      - name: Clean-wheel remote GPU smoke test
        run: |
          rm -rf dist /tmp/pythia-wheel-smoke
          python -m pip wheel . --no-deps --wheel-dir dist
          python -m pip wheel ./turing_universal_quantum_computer --no-deps --wheel-dir dist
          python -m venv /tmp/pythia-wheel-smoke
          /tmp/pythia-wheel-smoke/bin/pip install --quiet --no-deps numpy dist/*.whl
          cd /tmp
          /tmp/pythia-wheel-smoke/bin/python - <<'PY'
          import json
          import threading
          import urllib.request
          from mining.bitcoin_hasher import BitcoinHasher
          from chronus.mla1517.remote_gpu_agent import build_server
          assert BitcoinHasher
          server = build_server("127.0.0.1", 0)
          thread = threading.Thread(target=server.serve_forever, daemon=True)
          thread.start()
          try:
              url = f"http://127.0.0.1:{server.server_address[1]}/v1/health"
              payload = json.load(urllib.request.urlopen(url, timeout=5))
              assert payload["protocol"] == "remote_opencl_v2"
          finally:
              server.shutdown()
              server.server_close()
          PY
      - name: Import audit (every local import resolves; none hidden)
        run: python scripts/import_audit.py
      - name: Import graph (no new import cycles or layer violations)
        run: python scripts/import_graph.py cycles && python scripts/import_graph.py layers
      - name: PULVINI data authority boundary
        run: python scripts/check_pulvini_data_boundary.py
      - name: Canonical PYTHIA structured-search doctrine
        run: python scripts/check_canonical_mining_search.py
      - name: Repository lane ownership — exactly one owner per tracked file
        run: python scripts/repo_ownership_gate.py
      - name: Repo-wide defect discovery inventory
        run: python scripts/repo_closure.py defects --output reports/DEFECT_REGISTER.json
      - name: Retain Agent H closure inventories
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-h-closure-inventories
          path: |
            reports/REPO_FILE_OWNERSHIP.json
            reports/DEFECT_REGISTER.json
            results/repo-ownership.json
          if-no-files-found: error
          retention-days: 30
      - name: API governance — service constitution and dependency graph
        run: >-
          python governance/render_service_constitution.py --check &&
          python governance/dependency_graph.py &&
          python -m pytest tests/test_service_constitution.py -q
      - name: PULVINI/THESEUS/mining/live-system hardening regression gate
        run: >-
          python -m pytest
          tests/test_pulvini_quantum_data_doctrine.py
          tests/test_pulvini_boundary_canonical_mining_paths.py
          tests/test_entangled_custody_lifecycle.py
          tests/test_geodesic_tensor_engine.py
          tests/test_hyba_intelligence.py
          tests/test_shared_system_relations_production.py
          tests/test_production_organism_shared_triad.py
          -q
      - name: Unit tests (pytest)
        run: python -m pytest tests/ -x -q
      - name: Virtual quantum computer tests
        working-directory: turing_universal_quantum_computer
        run: python -m pytest tests -q
      - name: Byte-compile all Python sources
        run: python -m compileall -q Intelligence core_engine mining hyba pythagoras scripts tests chronus aethel l_hras bench experiments quantum_compute_substrate python_backend tensor

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: pythia-coverage-report
          path: coverage.xml
          retention-days: 30

  deploy-sentry:
    name: Deploy sentry — config, dependency, native-build and CI wiring
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Scan for deploy pitfalls (errors fail; warnings are reported)
        run: python -m scripts.deploy_sentry
      - name: Enforce deployment claims boundary
        run: python -m scripts.deployment_claims_gate

  python-selftest:
    name: Python — Intelligence self-test (ML stack)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies with ML extras
        run: bash scripts/ci_install.sh "ml"
      - name: Fetch NLTK resources (vader_lexicon for toe.PredictiveEngine)
        run: python -c "import nltk; nltk.download('vader_lexicon', quiet=True)"
      - name: Run Intelligence self-test
        run: python -u -X utf8 -m Intelligence.self_test
