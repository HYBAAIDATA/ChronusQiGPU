name: HYBA evidence-first backend contracts
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hyba-evidence-contracts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  full-checkout-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install canonical development dependencies
        run: bash scripts/ci_install.sh "dev"
      - name: Focused security and HTTP contracts without isolated import stubs
        run: python scripts/verify_hyba_remediation.py
      - name: Canonical runtime, guardian and custody regression gates
        run: >-
          python -m pytest -q
          tests/test_runtime_config.py
          tests/test_privileged_mediation.py
          tests/test_theseus_fault_injection.py
          tests/test_ovid_exactness_verification.py
          tests/test_golden_stride.py
      - name: Compile changed backend modules
        run: >-
          python -m compileall -q
          chronus/mla1517_platform/python/enterprise_contract.py
          chronus/mla1517_platform/python/enterprise_api.py
          chronus/mla1517_platform/python/control_api.py
          chronus/mla1517_platform/python/runtime_config.py
          aethel/enterprise/custody.py aethel/enterprise/quarantine.py lucas/ladder.py
