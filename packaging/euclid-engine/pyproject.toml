[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "euclid-engine"
version = "17.0.0"
description = "EUCLID — governed, local-first integrated adaptive intelligence: Bayesian mechanism world model, causal discrimination, value-of-information metacognition, strategy meta-learning, structural analogy, hierarchical planning, primitive discovery and transfer, with a falsifiable research programme."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "HYBA Software Limited" }]
keywords = ["cognitive-architecture", "world-models", "causal-inference", "planning",
            "meta-learning", "program-synthesis", "fibonacci-search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# The v17 cognition stack is pure Python with no third-party dependency.
dependencies = []

[project.scripts]
euclid-v17-research = "euclid.cognition.research.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["euclid*", "hyba_substrate*", "resonance_intelligence*"]
exclude = ["euclid.tests*", "*.tests", "*.tests.*"]
