name: HYBA Mine deploy

# Builds HYBA Mine from this repository and runs, reports, stops or examines it on
# HYBA's Azure mining host (vm-qigpu-miner, UK West), where it mines.
#
# This workflow never mines. GitHub's terms prohibit cryptomining in Actions, on
# GitHub-hosted and self-hosted runners alike. The job builds the image, runs the
# built-in self-test and the miner's tests with networking disabled, pushes the
# image to the private registry and acts on the mining host through Azure
# run-command. For a campaign it then follows the host until the campaign ends,
# runs the examination for any attempt to look inside the miner, and lists the
# Azure activity on the mining resource group in the same window.
#
# Control: edit deploy/hyba-mine/control.env on branch hyba-mine/control and push,
# or run the workflow manually once it is on main. Azure sign-in is OpenID Connect
# to the managed identity id-hyba-mine-github (Reader on the mining resource group,
# AcrPush on the registry, Virtual Machine Contributor on the mining host), which
# trusts only this repository's refs/heads/hyba-mine/control and refs/heads/main.
# There are no stored secrets.
#
# Every run writes its report (step outcomes, self-test, host output and the
# examination; no credentials) to hyba-mine/runs/ on the private results branch.

on:
  push:
    branches: [hyba-mine/control]
    paths:
      - deploy/hyba-mine/**
      - .github/workflows/hyba-mine.yml
  workflow_dispatch:
    inputs:
      action:
        description: campaign, status, stop or examine
        required: true
        type: choice
        options: [status, campaign, stop, examine]
        default: status
      pools:
        description: Pools in stage order, one block each
        required: true
        type: string
        default: viabtc,braiins

permissions:
  contents: write
  id-token: write

concurrency:
  group: hyba-mine-deploy
  cancel-in-progress: false

env:
  AZURE_CLIENT_ID: 28711228-5d62-4df1-8e2b-d28606300006
  AZURE_TENANT_ID: 3fb37656-b746-4086-9a92-509c5efafad0
  AZURE_SUBSCRIPTION_ID: 94c968f4-d214-41a0-97ec-441261e12d61
  RESOURCE_GROUP: rg-cronusqigpu-demo
  MINING_HOST: vm-qigpu-miner
  REGISTRY: crcronusqigpudemohybadata
  REGISTRY_SERVER: crcronusqigpudemohybadata.azurecr.io
  KEY_VAULT: kv-cronusqigpu-demo-hyba
  RESULTS_BRANCH: cowork/supervisor-results-20261111

jobs:
  deploy:
    name: Build, self-test and act on the mining host
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Requested action
        id: req
        shell: bash
        env:
          INPUT_ACTION: ${{ inputs.action }}
          INPUT_POOLS: ${{ inputs.pools }}
        run: |
          set -euo pipefail
          {
            echo "== requested action"
            field() { sed -n "s/^$1=//p" deploy/hyba-mine/control.env | tr -d '[:space:]'; }
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              action="$INPUT_ACTION"; pools="$INPUT_POOLS"
            else
              action="$(field HYBA_MINE_ACTION)"; pools="$(field HYBA_MINE_POOLS)"
            fi
            max_run="$(field HYBA_MINE_MAX_RUN_SECONDS)"
            max_run="${max_run:-14400}"
            case "$action" in campaign|status|stop|examine) ;; *) echo "::error::unknown action '$action'"; exit 1 ;; esac
            case "$pools" in viabtc|braiins|viabtc,braiins|braiins,viabtc) ;; *) echo "::error::unknown pools '$pools'"; exit 1 ;; esac
            [[ "$max_run" =~ ^[0-9]+$ ]] || { echo "::error::HYBA_MINE_MAX_RUN_SECONDS must be a whole number"; exit 1; }
            echo "action=$action" >> "$GITHUB_OUTPUT"
            echo "pools=$pools" >> "$GITHUB_OUTPUT"
            echo "max_run=$max_run" >> "$GITHUB_OUTPUT"
            echo "campaign_id=${GITHUB_SHA::12}-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
            echo "Requested: $action, pools $pools, at most $max_run s"
          } 2>&1 | tee -a "$RUNNER_TEMP/hyba-mine-report.txt"

      - name: Build the image (documented miner image plus the HYBA Mine layer)
        id: build
        if: steps.req.outputs.action == 'campaign'
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "== build"
            if docker build --progress=plain --target miner-runtime -t "hyba-mine-base:${GITHUB_SHA}" . > "$RUNNER_TEMP/build.log" 2>&1 \
              && docker build --progress=plain -f deploy/hyba-mine/Dockerfile \
                   --build-arg "BASE_IMAGE=hyba-mine-base:${GITHUB_SHA}" -t "hyba-mine:${GITHUB_SHA}" . >> "$RUNNER_TEMP/build.log" 2>&1; then
              grep -E 'OpenCL runtime (not )?installed' "$RUNNER_TEMP/build.log" | grep -v -E '\|\||echo' | tail -n 2 || true
              echo "build ok"
            else
              tail -n 200 "$RUNNER_TEMP/build.log"
              exit 1
            fi
          } 2>&1 | tee -a "$RUNNER_TEMP/hyba-mine-report.txt"

      - name: Self-test and the miner's tests with networking disabled (no pool connection)
        id: bist
        if: steps.req.outputs.action == 'campaign'
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "== self-test"
            docker run --rm --network none "hyba-mine:${GITHUB_SHA}" python /opt/hyba-mine/bist.py
            echo "== miner tests"
            docker run --rm --network none "hyba-mine:${GITHUB_SHA}" \
              python -m unittest discover -s /opt/hyba-mine/tests -t /opt/hyba-mine
          } 2>&1 | tee -a "$RUNNER_TEMP/hyba-mine-report.txt"

      - name: Azure sign-in (OpenID Connect)
        id: login
        shell: bash
        run: |
          set -euo pipefail
          oidc="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange" \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["value"])')"
          echo "::add-mask::${oidc}"
          {
            echo "== azure sign-in"
            python3 -c 'import base64, json, sys; p = sys.argv[1].split(".")[1]; p += "=" * (-len(p) % 4); c = json.loads(base64.urlsafe_b64decode(p)); print("token subject:", c.get("sub"))' "${oidc}"
            for attempt in 1 2 3 4 5 6; do
              if az login --service-principal --username "$AZURE_CLIENT_ID" --tenant "$AZURE_TENANT_ID" \
                   --federated-token "${oidc}" --allow-no-subscriptions --output none; then break; fi
              if [ "$attempt" = 6 ]; then echo "azure sign-in failed"; exit 1; fi
              echo "sign-in attempt $attempt failed; retrying in 20 s"
              sleep 20
            done
            az account set --subscription "$AZURE_SUBSCRIPTION_ID"
            echo "signed in to subscription $AZURE_SUBSCRIPTION_ID"
          } 2>&1 | tee -a "$RUNNER_TEMP/hyba-mine-report.txt"

      - name: Push the image to the private registry
        id: push
        if: steps.req.outputs.action == 'campaign'
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "== registry"
            for attempt in 1 2 3 4 5 6 7 8; do
              if az acr login --name "$REGISTRY"; then break; fi
              if [ "$attempt" = 8 ]; then echo "registry sign-in failed"; exit 1; fi
              echo "registry sign-in attempt $attempt failed; retrying in 20 s"
              sleep 20
            done
            docker tag "hyba-mine:${GITHUB_SHA}" "$REGISTRY_SERVER/hyba-mine:${GITHUB_SHA}"
            docker push --quiet "$REGISTRY_SERVER/hyba-mine:${GITHUB_SHA}"
            echo "pushed $REGISTRY_SERVER/hyba-mine:${GITHUB_SHA}"
          } 2>&1 | tee -a "$RUNNER_TEMP/hyba-mine-report.txt"
          echo "IMAGE=$REGISTRY_SERVER/hyba-mine:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Act on the mining host
        id: host
        if: steps.req.outputs.action != 'examine'
        shell: bash
        env:
          ACTION: ${{ steps.req.outputs.action }}
          POOLS: ${{ steps.req.outputs.pools }}
          CAMPAIGN_ID: ${{ steps.req.outputs.campaign_id }}
          MAX_RUN: ${{ steps.req.outputs.max_run }}
        run: |
          set -euo pipefail
          {
            echo "== mining host ($ACTION)"
            date -u +%Y-%m-%dT%H:%M:%SZ > "$RUNNER_TEMP/started-at"
            out="$(az vm run-command invoke --resource-group "$RESOURCE_GROUP" --name "$MINING_HOST" \
              --command-id RunShellScript --scripts @deploy/hyba-mine/vm-hyba-mine.sh \
              --parameters "$ACTION" "$POOLS" "$KEY_VAULT" "$REGISTRY_SERVER" "$REGISTRY" "${IMAGE:-}" "$CAMPAIGN_ID" "$MAX_RUN" \
              --query 'value[0].message' --output tsv)"
            echo "$out"
            if grep -q 'MINER_ERROR' <<<"$out"; then
              echo "::error::$(grep -m1 'MINER_ERROR' <<<"$out")"
              exit 1
            fi
          } 2>&1 | tee -a "$RUNNER_TEMP/hyba-mine-report.txt"

      - name: Follow the campaign until it ends
        id: follow
        if: steps.req.outputs.action == 'campaign'
        shell: bash
        env:
          MAX_RUN: ${{ steps.req.outputs.max_run }}
        run: |
          set -uo pipefail
          report="$RUNNER_TEMP/hyba-mine-report.txt"
          limit=$(( MAX_RUN + 1800 ))
          if [ "$limit" -gt 18000 ]; then limit=18000; fi
          started=$(date +%s)
          poll=0
          while true; do
            sleep 120
            poll=$((poll + 1))
            out="$(az vm run-command invoke --resource-group "$RESOURCE_GROUP" --name "$MINING_HOST" \
              --command-id RunShellScript --scripts @deploy/hyba-mine/vm-hyba-mine.sh \
              --parameters status \
              --query 'value[0].message' --output tsv 2>&1 || true)"
            {
              echo "== status $(date -u +%Y-%m-%dT%H:%M:%SZ) (poll $poll)"
              echo "$out"
            } >> "$report"
            if grep -q -E 'MINER_STATE (exited|not running)' <<<"$out"; then
              echo "campaign ended" | tee -a "$report"
              break
            fi
            if [ $(( $(date +%s) - started )) -ge "$limit" ]; then
              echo "following stopped at the time limit; the host bounds the campaign itself" | tee -a "$report"
              break
            fi
            if [ $((poll % 3)) -eq 0 ]; then
              bash deploy/hyba-mine/publish-report.sh "$report" "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt" >/dev/null
            fi
          done

      - name: Examine the host for any attempt to look inside the miner
        id: examine
        if: always() && ((steps.req.outputs.action == 'examine' && steps.login.outcome == 'success') || steps.follow.outcome == 'success')
        shell: bash
        run: |
          set -uo pipefail
          {
            echo "== examination on the mining host"
            az vm run-command invoke --resource-group "$RESOURCE_GROUP" --name "$MINING_HOST" \
              --command-id RunShellScript --scripts @deploy/hyba-mine/vm-hyba-mine.sh \
              --parameters examine \
              --query 'value[0].message' --output tsv 2>&1
            since="$(cat "$RUNNER_TEMP/started-at" 2>/dev/null || date -u -d '-6 hours' +%Y-%m-%dT%H:%M:%SZ)"
            echo "== Azure activity on $RESOURCE_GROUP since $since (callers and operations)"
            az monitor activity-log list --resource-group "$RESOURCE_GROUP" --start-time "$since" \
              --query "[].[caller, operationName.value, status.value]" --output tsv 2>&1 \
              | sort | uniq -c | sort -rn | head -n 60
          } 2>&1 | tee -a "$RUNNER_TEMP/hyba-mine-report.txt"

      - name: Publish the run report to the private results branch
        if: always()
        shell: bash
        env:
          OUTCOMES: "requested=${{ steps.req.outcome }} build=${{ steps.build.outcome }} self-test=${{ steps.bist.outcome }} azure-sign-in=${{ steps.login.outcome }} registry=${{ steps.push.outcome }} host=${{ steps.host.outcome }} follow=${{ steps.follow.outcome }} examine=${{ steps.examine.outcome }}"
        run: |
          set -uo pipefail
          report="$RUNNER_TEMP/hyba-mine-report.txt"
          touch "$report"
          {
            echo "HYBA Mine deploy run $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT"
            echo "commit $GITHUB_SHA ref $GITHUB_REF event $GITHUB_EVENT_NAME at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "outcomes: $OUTCOMES"
            echo
            tail -c 300000 "$report"
          } > "$RUNNER_TEMP/final.txt"
          bash deploy/hyba-mine/publish-report.sh "$RUNNER_TEMP/final.txt" "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
