name: PYTHIA Canonical Push CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-python:
    name: Canonical Python compile and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install canonical test package
        working-directory: chronus/mla1517_platform
        run: python -m pip install --upgrade pip && python -m pip install -e ../../turing_universal_quantum_computer -e ".[test]"
      - name: Compile canonical Python tree
        working-directory: chronus/mla1517_platform
        run: python -m compileall -q python
      - name: Build the host driver and run its C contract tests
        working-directory: chronus/mla1517_platform
        run: make -C host all aethel-test primedb-storage-test primedb-boundary-test behavioral-gap-test
      # pytest also runs the unittest classes; unittest discovery silently
      # skipped every pytest-style module (about 150 tests).
      - name: Run canonical Python tests
        working-directory: chronus/mla1517_platform
        env:
          PYTHONPATH: python:../..
        run: python -m pytest python -q -rs
