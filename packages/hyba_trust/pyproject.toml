[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hyba-trust"
version = "0.1.0.dev0"
description = "Trust state machine, promotion authority and demotion cascade for derived knowledge atoms (HYBA Data, internal)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
classifiers = [
  "Private :: Do Not Upload",
  "License :: Other/Proprietary License",
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["hyba_trust*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
