apiVersion: apps/v1
kind: Deployment
metadata:
  name: pythia-resilience-gateway
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: pythia-resilience-gateway
  template:
    metadata:
      labels:
        app: pythia-resilience-gateway
    spec:
      terminationGracePeriodSeconds: 35
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: pythia-resilience-gateway:latest
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: WS_TICKET_SECRET
              valueFrom:
                secretKeyRef:
                  name: pythia-resilience-gateway-secrets
                  key: ticket-secret
            - name: GATEWAY_HTTP_REQUESTS_PER_MINUTE
              value: "120"
          ports:
            - containerPort: 3000
          livenessProbe:
            httpGet: { path: /healthz, port: 3000 }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: 3000 }
            periodSeconds: 5
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }