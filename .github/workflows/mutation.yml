name: Mutation check

# Do the tests fail when the intelligence's logic is wrong? Each module is
# mutated one planted mistake at a time; the score must stay above its
# floor, so test strength can only ratchet up. Survivors are listed in the
# job summary.
on:
  pull_request:
    paths:
      - "chronus/mla1517/mining/world_model.py"
      - "chronus/mla1517/mining/promotion.py"
      - "chronus/mla1517_platform/python/test_promotion_gate.py"
      - "chronus/mla1517/mining/operating_policy.py"
      - "chronus/mla1517/mining/loss_ledger.py"
      - "chronus/mla1517/mining/hashrate_governor.py"
      - "chronus/mla1517/learning.py"
      - "chronus/mla1517_platform/python/test_learning.py"
      - "chronus/mla1517_platform/python/test_*_logic.py"
      - "chronus/mla1517_platform/python/test_hashrate_governor.py"
      - "chronus/mla1517_platform/python/test_mining_intelligence.py"
      - "scripts/mutation_check.py"
      - "scripts/critical_mutation_gate.py"
      - "tests/test_critical_mutation_gate.py"
      - "tests/test_mining_consensus_recheck.py"
      - "tests/test_toe_runtime.py"
      - "chronus/mla1517_platform/python/test_hendrix_nonce_order.py"
      - "toe/runtime.py"
      - "chronus/mla1517/mining/hendrix_order.py"
      - "mining/hash_pipeline.py"
      - "turing_universal_quantum_computer/**"
      - ".github/workflows/mutation.yml"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    name: Mutation — ${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: hashrate_governor
            tests: chronus/mla1517_platform/python/test_hashrate_governor.py
            floor: "0.85"
          - module: world_model
            tests: >-
              chronus/mla1517_platform/python/test_world_model_logic.py
              chronus/mla1517_platform/python/test_mining_intelligence.py
            floor: "0.85"
          - module: operating_policy
            tests: >-
              chronus/mla1517_platform/python/test_operating_policy_logic.py
              chronus/mla1517_platform/python/test_mining_intelligence.py
            floor: "0.85"
          - module: loss_ledger
            tests: >-
              chronus/mla1517_platform/python/test_loss_ledger_logic.py
              chronus/mla1517_platform/python/test_mining_intelligence.py
            floor: "0.85"
          - module: promotion
            tests: chronus/mla1517_platform/python/test_promotion_gate.py
            floor: "0.85"
          - module: learning
            path: chronus/mla1517/learning.py
            tests: chronus/mla1517_platform/python/test_learning.py
            floor: "0.85"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # No install of the mutated package itself: the sandboxes must be what
      # imports. The virtual quantum computer is a dependency of the miner
      # (the default Hendrix order), installed as it is everywhere else.
      - run: >-
          python -m pip install "numpy>=1.26,<3" "pytest>=7.4,<10" "pyyaml>=6.0,<7"
          ./turing_universal_quantum_computer
      - name: Mutate ${{ matrix.module }}
        run: >-
          python scripts/mutation_check.py
          ${{ matrix.path || format('chronus/mla1517/mining/{0}.py', matrix.module) }}
          --tests ${{ matrix.tests }}
          --pythonpath chronus/mla1517_platform/python turing_universal_quantum_computer
          --workers 4
          --min-score ${{ matrix.floor }}
          --json mutation-${{ matrix.module }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-${{ matrix.module }}
          path: mutation-${{ matrix.module }}.json
          if-no-files-found: warn

  critical-sentinels:
    name: Critical mutation — ${{ matrix.mutation }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mutation:
          - toe-engine-fail-closed
          - toe-feedback-connected
          - toe-evidence-connected
          - hendrix-order-preserved
          - turing-measurement-collapse
          - sha256d-independent-recheck
          - sha256d-m32-independent-recheck
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project test dependencies
        run: bash scripts/ci_install.sh "dev"
      - name: Prove planted defect turns focused gate red
        run: >-
          python scripts/critical_mutation_gate.py
          --mutation ${{ matrix.mutation }}
          --json critical-mutation-${{ matrix.mutation }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: critical-mutation-${{ matrix.mutation }}
          path: critical-mutation-${{ matrix.mutation }}.json
          if-no-files-found: error
