name: Pure Quantum Mathematics

on:
  pull_request:
    paths:
      - "turing_universal_quantum_computer/**"
      - "kellogg/**"
      - "mining/fault_tolerant_asic.py"
      - "mining/deterministic_hashrate.py"
      - "mining/thermodynamics_exact.py"
      - "scripts/verify_pure_quantum_math.py"
      - ".github/workflows/pure-quantum-math.yml"
  push:
    branches: [main]
    paths:
      - "turing_universal_quantum_computer/**"
      - "kellogg/**"
      - "mining/fault_tolerant_asic.py"
      - "mining/deterministic_hashrate.py"
      - "mining/thermodynamics_exact.py"
      - "scripts/verify_pure_quantum_math.py"
      - ".github/workflows/pure-quantum-math.yml"

permissions:
  contents: read

jobs:
  exact-first-principles:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install exact virtual quantum computer
        # hyba-kellogg-tensor is not on PyPI yet: TURING installs without dependency
        # resolution and Kellogg, Mining and TOE resolve from the checkout.
        run: |
          python -m pip install "numpy>=1.26,<3" "sympy>=1.12,<2"
          python -m pip install --no-deps -e ./turing_universal_quantum_computer
          # mining/search.py imports chronos_one_igpu at module load (in-tree, not on PyPI).
          python -m pip install --no-deps ./chronus/packages/chronos-one-igpu
          # chronus/ after the root: first-party packages relocated under chronus/ (lucas, ...)
          echo "PYTHONPATH=${{ github.workspace }}:${{ github.workspace }}/chronus" >> "$GITHUB_ENV"
      - name: Compile exact implementation
        run: >-
          python -m py_compile
          kellogg/cyclotomic.py
          kellogg/exact_network.py
          kellogg/surface_code.py
          mining/fault_tolerant_asic.py
          mining/deterministic_hashrate.py
          mining/thermodynamics_exact.py
          turing_universal_quantum_computer/turing_universal_quantum_computer/surface_code_exact.py
          turing_universal_quantum_computer/turing_universal_quantum_computer/canonical_serialization.py
          turing_universal_quantum_computer/turing_universal_quantum_computer/exact_field_registry.py
          turing_universal_quantum_computer/turing_universal_quantum_computer/backends/mps.py
      - name: Run focused exact proof obligations
        run: |
          python -m unittest discover -v -s tests -p test_mining_fault_tolerant_asic.py
          python -m unittest discover -v -s tests -p test_mining_deterministic_hashrate.py
          python -m unittest discover -v -s tests -p test_mining_quantum_asic_integration.py
          python -m unittest discover -v -s tests -p test_mining_thermodynamics_exact.py
          tests=turing_universal_quantum_computer/tests
          python -m unittest discover -v -s "$tests" -p test_surface_code_exact.py
          python -m unittest discover -v -s "$tests" -p test_mps_exact_backend.py
          python -m unittest discover -v -s "$tests" -p test_canonical_serialization.py
          python -m unittest discover -v -s "$tests" -p test_exact_field_registry.py
      - name: Reproduce canonical proof bundle
        run: >-
          python scripts/verify_pure_quantum_math.py
          --output artifacts/pure-quantum-math/reproduction.json
      - uses: actions/upload-artifact@v4
        with:
          name: pure-quantum-math-${{ matrix.python-version }}
          path: artifacts/pure-quantum-math/reproduction.json
          if-no-files-found: error


  cross-version-reproduction:
    needs: exact-first-principles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pure-quantum-math-*
          path: reproductions
      - name: Require identical reproduction digests
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files = sorted(Path("reproductions").glob("**/reproduction.json"))
          if len(files) != 3:
              raise SystemExit(f"expected 3 reproduction artifacts, found {len(files)}")
          rows = [(str(path), json.loads(path.read_text())["reproduction_digest"]) for path in files]
          digests = {digest for _path, digest in rows}
          if len(digests) != 1:
              raise SystemExit(f"cross-version reproduction mismatch: {rows}")
          print(f"reproduction digest: {rows[0][1]}")
          PY

  lean-kernels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: turing_universal_quantum_computer/formal
