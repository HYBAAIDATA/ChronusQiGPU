  slo.constitutional:
    tier: R0
    measured: FAULT_INJECTION_EXECUTED
    dimensions: [availability, verdict latency, denial evidence completeness]
    targets: {availability: fail-closed-by-design, denial_latency_p95: measured-locally}
    error_budget: none — integrity failures are not budget-eligible
  slo.mining.control:
    tier: R1
    measured: FAULT_INJECTION_EXECUTED
    dimensions: [command acceptance rate, job-to-plan latency, stale-job cancellation latency]
    targets: {command_acceptance: measured-locally}
    error_budget: release-managed
  slo.mining.execution:
    tier: R1
    measured: LOCAL_HTTP_E2E_EXECUTED
    dimensions: [plan-to-execution latency, execution completion, verification completion]
    targets: {verification_pass: required-for-success}
    error_budget: release-managed
  slo.mining.read:
    tier: R1
    measured: LOCAL_HTTP_E2E_EXECUTED
    dimensions: [availability, latency_p95]
    targets: {}
    error_budget: release-managed
  slo.mining.plan:
    tier: R1
    measured: UNMEASURED
    dimensions: [plan latency, plan validity]
    targets: {}
    error_budget: release-managed
  slo.mining.telemetry:
    tier: R1
    measured: LOCAL_HTTP_E2E_EXECUTED
