name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python }} tests
    # Critical path: self-hosted Windows (see docs/ci/self-hosted-runner.md).
    # Short-circuit: push/workflow_dispatch never touch pull_request.*; fork PRs skip.
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    runs-on: [self-hosted, windows]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Runner doctor
        run: python scripts/ci/runner_doctor.py
      - run: python -m pip install -e '.[dev]'
      - name: Test and measure coverage
        env:
          CHRONUS_WORKLOAD_DB_PATH: ${{ runner.temp }}/chronus-tests.sqlite3
        run: python -m pytest -q --cov=chronus.execution --cov=chronus.backends --cov=chronus.service --cov=chronus.sdk --cov=chronus.security --cov=chronus.stratum --cov=chronus.math --cov=chronus.hw --cov=chronus.storage --cov=chronus.tensor --cov=chronus.ovid --cov=chronus.core --cov=chronus.triad --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage-python-${{ matrix.python }}
          path: coverage.xml
          if-no-files-found: warn

  quality-and-package:
    name: Lint, compile and package
    # Critical path: self-hosted Windows (see docs/ci/self-hosted-runner.md).
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    runs-on: [self-hosted, windows]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Runner doctor
        run: python scripts/ci/runner_doctor.py
      - run: python -m pip install -e '.[dev]' ruff build twine
      - name: Lint active implementation
        run: ruff check --select F src/chronus/core src/chronus/execution src/chronus/backends src/chronus/service src/chronus/sdk src/chronus/security src/chronus/stratum src/chronus/math src/chronus/hw src/chronus/storage src/chronus/tensor src/chronus/ovid src/chronus/triad.py scripts/ci/build_product_gates.py scripts/ci/evaluate_attested.py scripts/ci/require_release_qualification.py tests
      - name: Compile active implementation
        run: python -m compileall -q src/chronus/config.py src/chronus/core src/chronus/execution src/chronus/backends src/chronus/service src/chronus/sdk src/chronus/security src/chronus/stratum src/chronus/math src/chronus/hw src/chronus/storage src/chronus/tensor src/chronus/ovid src/chronus/triad.py scripts/ci
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distribution
          path: dist/

  provenance:
    name: SLSA build provenance attestation
    needs: quality-and-package
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    permissions:
      actions: read       # download artifacts from a previous job
      contents: read
      id-token: write     # Sigstore/Fulcio OIDC signing
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distribution
          path: dist
      # NOTE: artifact attestations require a public repo or an organization
      # with GitHub Advanced Security; on user-owned private repos the API
      # rejects them. continue-on-error keeps the pipeline green and the step
      # activates automatically once the repo qualifies.
      - name: Attest build provenance
        continue-on-error: true
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: dist/*

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e . pip-audit
      - run: pip-audit

  static-security:
    name: Static security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install bandit
      - run: bandit -q -r src/chronus/core src/chronus/execution src/chronus/backends src/chronus/service src/chronus/sdk src/chronus/security src/chronus/storage src/chronus/tensor src/chronus/ovid src/chronus/triad.py -ll -ii

  infrastructure:
    name: Azure Bicep validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: az bicep build --file infra/azure/main.bicep --stdout > "$RUNNER_TEMP/azure-template.json"

  opencl-reference:
    name: OpenCL kernel on CPU reference runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq pocl-opencl-icd
      - run: python -m pip install -e '.[dev,accelerator]'
      - name: Require an OpenCL CPU device
        run: python -c "import pyopencl as cl; assert any(d.type & cl.device_type.CPU for p in cl.get_platforms() for d in p.get_devices())"
      - run: python -m pytest -q tests/test_opencl_kernel.py

  purity-gate:
    name: Purity gate and software evidence dossier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Runner doctor
        run: python scripts/ci/runner_doctor.py
      - run: python -m pip install -e '.[dev]'
      - name: Block simulation, approximation, heuristics and quantum theatre
        run: python scripts/ci/purity_gate.py
      - name: Seal procurement OpenAPI surfaces
        run: python scripts/ci/check_openapi_seal.py
      - name: Mechanism seal gate (external surfaces)
        run: python scripts/ci/check_mechanism_seal.py
      - name: Meta-Test Invariant Mutation Harness (Test the Tests)
        run: python scripts/ci/test_the_tests.py
      - name: Generate software capability evidence dossier
        run: python scripts/ci/sovereign_attestation.py
      - name: Generate local software verification manifest
        run: python scripts/ci/manifest.py
      - name: Audit qualification manifests
        run: python scripts/ci/audit_manifests.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: software-evidence-dossiers
          path: |
            PRODUCTION_QUALIFIED.json
            SOVEREIGN_CAPABILITY_ATTESTATION.json

  dressing-gates:
    name: Evidence-first wording, test reality and quantum naming
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install pytest
      - name: Gate regression tests
        run: python -m pytest -q tests/test_dressing_gates.py
      - name: No dressing
        if: always()
        run: python scripts/ci/no_dressing.py --json > dressing-findings.json
      - name: Test reality
        if: always()
        run: python scripts/ci/test_reality.py --json > test-reality.json
      - name: Quantum naming
        if: always()
        run: python scripts/ci/quantum_naming.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: evidence-first-gates
          path: |
            dressing-findings.json
            test-reality.json
          if-no-files-found: warn

  rtl-synthesis:
    name: Phi-ALU RTL simulation and Yosys synthesis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq yosys iverilog
      - name: Run known-answer testbenches
        run: |
          iverilog -g2012 -o tb_phi hw/tb_qigpu_phi_alu.sv hw/zeckendorf_norm_alu.sv
          ./tb_phi | tee rtl-testbench.log
          iverilog -g2012 -o tb_32lane hw/tb_zeckendorf_alu_32lane.sv hw/zeckendorf_alu_32lane.sv
          ./tb_32lane | tee -a rtl-testbench.log
          iverilog -g2012 -o tb_pv hw/tb_pv_scale_32lane.sv hw/pv_scale_32lane.sv
          ./tb_pv | tee -a rtl-testbench.log
          test "$(grep -c 'TB PASS' rtl-testbench.log)" -eq 3
      - name: Synthesize with Yosys
        run: |
          yosys -Q -T -p 'read_verilog -sv hw/zeckendorf_norm_alu.sv; hierarchy -check -top qigpu_phi_alu; synth -top qigpu_phi_alu; stat' | tee yosys-report.txt
          yosys -Q -T -p 'read_verilog -sv hw/zeckendorf_alu_32lane.sv; hierarchy -check -top qigpu_zeckendorf_alu_32lane; synth -top qigpu_zeckendorf_alu_32lane; stat' | tee -a yosys-report.txt
          yosys -Q -T -p 'read_verilog -sv hw/pv_scale_32lane.sv; hierarchy -check -top qigpu_pv_scale_32lane; synth -top qigpu_pv_scale_32lane; stat' | tee -a yosys-report.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rtl-synthesis-report
          path: |
            rtl-testbench.log
            yosys-report.txt
          if-no-files-found: error

  container:
    name: Container build and restart smoke test
    runs-on: ubuntu-latest
    env:
      CHRONUS_SMOKE_TOKEN: ci-example-token
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build -t chronus-ci:${{ github.sha }} .
      - name: Exercise authenticated workload and restart
        shell: bash
        run: |
          set -euo pipefail
          container_id=$(docker run -d -p 127.0.0.1::8000 -e 'CHRONUS_TENANT_TOKENS={"ci":"ci-example-token"}' chronus-ci:${{ github.sha }})
          trap 'docker rm -f "$container_id" >/dev/null' EXIT
          port=$(docker port "$container_id" 8000/tcp | sed 's/.*://')
          export CHRONUS_SMOKE_URL="http://127.0.0.1:$port"
          for attempt in {1..30}; do
            if curl -fsS "$CHRONUS_SMOKE_URL/health/ready" >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS "$CHRONUS_SMOKE_URL/health/ready" >/dev/null
          workload_id=$(python tests/container_smoke.py submit)
          docker restart "$container_id" >/dev/null
          port=$(docker port "$container_id" 8000/tcp | sed 's/.*://')
          export CHRONUS_SMOKE_URL="http://127.0.0.1:$port"
          for attempt in {1..30}; do
            if curl -fsS "$CHRONUS_SMOKE_URL/health/ready" >/dev/null; then break; fi
            sleep 1
          done
          python tests/container_smoke.py verify "$workload_id"

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Build frontend
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: pnpm build

  qigpu-model:
    name: QiGPU model tests and implementation coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install coverage==7.17.2
      - name: Run QiGPU model tests and report per-function coverage
        shell: bash
        run: |
          set -euo pipefail
          python -m coverage erase
          python -m coverage run --branch docs/qigpu/pasted-text.txt 2>&1 | tee qigpu-test-output.txt
          python -m coverage json -o qigpu-coverage.json
          python - <<'PY'
          import ast,json
          from pathlib import Path
          source='docs/qigpu/pasted-text.txt'
          tree=ast.parse(Path(source).read_text())
          data=json.loads(Path('qigpu-coverage.json').read_text())['files'][source]
          skip=set()
          for n in tree.body:
              if isinstance(n,ast.ClassDef) and n.name.startswith('Test'):
                  skip.update(range(n.lineno,n.end_lineno+1))
          executed={n for n in data['executed_lines'] if n not in skip}
          missing={n for n in data['missing_lines'] if n not in skip}
          taken=[b for b in data['executed_branches'] if b[0] not in skip]
          untaken=[b for b in data['missing_branches'] if b[0] not in skip]
          statement=100*len(executed)/(len(executed)+len(missing))
          branch=100*len(taken)/(len(taken)+len(untaken))
          functions=[]
          for node in tree.body:
              if isinstance(node,ast.FunctionDef) and not node.name.startswith('_'):
                  functions.append((node.name,node))
              if isinstance(node,ast.ClassDef) and not node.name.startswith('Test'):
                  functions.extend((node.name+'.'+n.name,n) for n in node.body if isinstance(n,ast.FunctionDef) and not n.name.startswith('_'))
          report={}
          for name,n in functions:
              hit=sorted(i for i in executed if n.lineno<=i<=n.end_lineno)
              miss=sorted(i for i in missing if n.lineno<=i<=n.end_lineno)
              report[name]={'executed_lines':len(hit),'missing_lines':miss,'statement_percent':round(100*len(hit)/(len(hit)+len(miss)),2) if hit or miss else None}
          Path('qigpu-function-coverage.json').write_text(json.dumps({'method':'Executed statement lines by function; not proof of semantic coverage or seven-class completeness.','functions':report},indent=2,sort_keys=True)+'\n')
          print('Implementation coverage: statements %.2f%%; branches %.2f%%'%(statement,branch))
          print('Per-function report:',len(report),'public functions')
          if statement<90 or branch<90: raise SystemExit('Implementation coverage below 90%')
          PY
      - name: Audit coverage by public function and test class
        shell: python
        run: |
          import ast,collections,coverage,importlib.util,json,sys,unittest
          from importlib.machinery import SourceFileLoader
          from pathlib import Path
          source=Path('docs/qigpu/pasted-text.txt'); spec=importlib.util.spec_from_loader('qigpu_audit',SourceFileLoader('qigpu_audit',str(source)));mod=importlib.util.module_from_spec(spec);spec.loader.exec_module(mod)
          classes=['TestInvariant','TestProperty','TestAdversarial','TestEdge','TestUnit','TestIntegration','TestEndToEnd']
          cov=coverage.Coverage(data_file='.coverage_context',branch=True);cov.start()
          class AuditResult(unittest.TextTestResult):
           def startTest(self,test):
            cov.switch_context(test.__class__.__name__)
            super().startTest(test)
          suite=unittest.TestSuite(unittest.defaultTestLoader.loadTestsFromTestCase(getattr(mod,c)) for c in classes)
          with open('qigpu-context-tests.txt','w') as stream: result=unittest.TextTestRunner(stream=stream,resultclass=AuditResult,verbosity=1).run(suite)
          cov.stop();cov.save()
          if not result.wasSuccessful():sys.exit(1)
          data=cov.get_data(); name=next(x for x in data.measured_files() if x.endswith('pasted-text.txt'));line_context=data.contexts_by_lineno(name); statements=set(cov.analysis2(name)[1]);tree=ast.parse(source.read_text())
          public=[]
          for node in tree.body:
           if isinstance(node,ast.FunctionDef) and not node.name.startswith('_'):
            public.append((node.name,node))
           elif isinstance(node,ast.ClassDef) and not node.name.startswith('Test'):
            for n in node.body:
             if isinstance(n,(ast.FunctionDef,ast.AsyncFunctionDef)) and not n.name.startswith('_'):
              public.append((node.name+'.'+n.name,n))
          missing={x:[] for x in classes};covered={x:0 for x in classes}
          for name,node in public:
           contexts=set()
           for line in range(node.lineno,node.end_lineno+1):
            if line in statements: contexts.update(c.split('|')[-1] for c in line_context.get(line,[]))
           for c in classes:
            if c in contexts:covered[c]+=1
            else:missing[c].append(name)
          report={'test_count':result.testsRun,'classes':classes,'public_functions_count':len(public),'method':'Dynamic executed-line contexts attributed per unittest class; any executable line in a function counts as touched, not proof of full behavioral coverage. Abstract methods and methods not meaningful in a class are included.','public_functions_touched_count_by_class':covered,'public_functions_not_touched_by_class':missing,'finding':'The requested every-public-function-in-every-class criterion is not established; Passing tests and aggregate coverage do not imply it. Cross-module composition coverage is not exhaustive.'}
          Path('qigpu-seven-class-coverage.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          print('tests',result.testsRun,'public',len(public),'touched',covered)
      - name: State remaining acceptance gaps
        run: echo "::warning::Passing this job does not establish CFT scaling, general backend equivalence, or exhaustive seven-class coverage."
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: qigpu-model-evidence
          path: |
            qigpu-test-output.txt
            qigpu-coverage.json
            qigpu-function-coverage.json
            qigpu-seven-class-coverage.json
            qigpu-context-tests.txt
          if-no-files-found: warn

  offline-stratum-smoke:
    name: Offline Stratum smoke
    # Critical path: self-hosted Windows (see docs/ci/self-hosted-runner.md).
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    runs-on: [self-hosted, windows]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Runner doctor
        run: python scripts/ci/runner_doctor.py
      - run: python -m pip install -e '.[dev]'
      - name: Fake pool accept round-trip
        env:
          MINING_BRAIINS_USER: smoke.worker
          PYTHONPATH: src
        shell: pwsh
        run: |
          $pool = Start-Process -PassThru -NoNewWindow -FilePath python -ArgumentList @('scripts/smoke/fake_pool.py','--port','3333','--exit-after','30')
          $ready = $false
          foreach ($i in 1..50) {
            try {
              $client = New-Object System.Net.Sockets.TcpClient
              $iar = $client.BeginConnect('127.0.0.1', 3333, $null, $null)
              $ok = $iar.AsyncWaitHandle.WaitOne(200)
              if ($ok -and $client.Connected) { $ready = $true; $client.Close(); break }
              $client.Close()
            } catch { }
            Start-Sleep -Milliseconds 200
          }
          if (-not $ready) {
            if (-not $pool.HasExited) { Stop-Process -Id $pool.Id -Force }
            throw 'fake pool did not accept connections on 127.0.0.1:3333 within 10s'
          }
          $code = 0
          try {
            python scripts/smoke/stratum_smoke.py --target fake --submit-share --require-accept
            $code = $LASTEXITCODE
          } finally {
            if (-not $pool.HasExited) { Stop-Process -Id $pool.Id -Force }
          }
          exit $code
