# Single-host bounded pilot/reference topology. Not HA or autoscaling.
# Host config/secret files must be owned by uid 10001; secrets mode 0600.
# Behind an authenticated TLS ingress; restrict egress to IdP/Hermitten.
x-runtime: &runtime
  image: hyba/turing-enterprise:${TURING_IMAGE_TAG:?set immutable approved image tag}
  user: '10001:10001'
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 128
  mem_limit: 6g
  cpus: 2
  restart: unless-stopped
  stop_grace_period: 75s
  tmpfs: ['/tmp:rw,nosuid,nodev,noexec,size=256m,uid=10001,gid=10001']
  volumes:
    - service-state:/state
    - service-custody:/custody
    - ./service.json:/config/service.json:ro
    - ./secrets:/run/service-secrets:ro
    - ./approval:/approval:ro
services:
  api:
    <<: *runtime
    build:
      context: ../../..
      args:
        SOURCE_COMMIT: ${TURING_SOURCE_COMMIT:?set reviewed source commit}
      dockerfile: services/turing-enterprise/deploy/Dockerfile
    command: [serve, --config, /config/service.json]
    ports: ['127.0.0.1:8080:8080']
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/live', timeout=5)"]
      interval: 30s
      timeout: 6s
      retries: 3
  worker:
    <<: *runtime
    command: [worker, --config, /config/service.json]
    network_mode: none
    # DB WAL requires a local POSIX filesystem. Never put SQLite on NFS.
volumes:
  service-state: {}
  service-custody: {}
