name: Storage reference evidence
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Test harness and validate committed artifacts
        run: |
          python -m unittest discover -s tests -p 'test_capacity_harness.py' -v
          python -m unittest discover -s tests -p 'test_capacity_artifact_verifier.py' -v
          python scripts/ci/verify_capacity_artifacts.py
      - name: Run reference harness on runner
        run: |
          python -c 'import json,os,subprocess; cpu=next((x.split(":",1)[1].strip() for x in open("/proc/cpuinfo") if x.startswith("model name")), "not reported"); ram=next((x.strip() for x in open("/proc/meminfo") if x.startswith("MemTotal:")), "not reported"); disk=subprocess.check_output(["df","-T","."], text=True).strip(); json.dump({"cpu":cpu,"ram":ram,"disk":disk,"gpu":"not used"}, open(os.environ["RUNNER_TEMP"]+"/storage-hardware.json","w"))'
          python harness/capacity.py --data-dir artifacts/samples --labels harness/sample-labels.json --hardware "$RUNNER_TEMP/storage-hardware.json" --output-dir "$RUNNER_TEMP/capacity"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: storage-reference-measurement
          path: ${{ runner.temp }}/capacity/*.json
          if-no-files-found: error
