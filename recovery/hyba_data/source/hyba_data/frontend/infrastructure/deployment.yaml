apiVersion: apps/v1
kind: Deployment
metadata:
  name: hyba-frontend
  namespace: hyba-frontend
  labels:
    app.kubernetes.io/name: hyba-frontend
    app.kubernetes.io/part-of: hyba-mining
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hyba-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: hyba-frontend
        app.kubernetes.io/name: hyba-frontend
        app.kubernetes.io/part-of: hyba-mining
    spec:
      # Non-root security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001

      containers:
        - name: frontend
          image: hybaacr.azurecr.io/hyba-frontend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP

          # Environment from ConfigMap (non-sensitive)
          envFrom:
            - configMapRef:
                name: hyba-frontend-config

          # Sensitive values from Kubernetes Secret (populated via Azure Key Vault CSI)
          env:
            - name: TURING_BACKEND_URL
              valueFrom:
                secretKeyRef:
                  name: hyba-frontend-secrets
                  key: TURING_BACKEND_URL
            - name: MONGO_URL
              valueFrom:
                secretKeyRef:
                  name: hyba-frontend-secrets
                  key: MONGO_URL
            - name: APPLICATIONINSIGHTS_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: hyba-frontend-secrets
                  key: APPLICATIONINSIGHTS_CONNECTION_STRING
                  optional: true

          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"

          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          # Container-level security hardening
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          volumeMounts:
            # Next.js requires a writable cache directory at runtime
            - name: nextjs-cache
              mountPath: /app/.next/cache
            # Writable /tmp for any transient writes
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: nextjs-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}

      # Spread pods across availability zones
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: hyba-frontend

      terminationGracePeriodSeconds: 30
