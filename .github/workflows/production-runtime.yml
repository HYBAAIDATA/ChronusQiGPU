name: Production Runtime Provisioning & Miner Launch

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run pre-flight checks only without starting miner'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: production-runtime-ignition
  cancel-in-progress: false

jobs:
  run-miner:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          bash scripts/ci_install.sh "hardware"

      - name: Execute pre-flight validation
        env:
          VIABTC_USER: ${{ secrets.VIABTC_USER }}
          VIABTC_PASSWORD: ${{ secrets.VIABTC_PASSWORD }}
          BRAIINS_USER: ${{ secrets.BRAIINS_USER }}
          BRAIINS_PASSWORD: ${{ secrets.BRAIINS_PASSWORD }}
          PHYLAXIS_DB_HOST: ${{ vars.PHYLAXIS_DB_HOST }}
          PHYLAXIS_DB_PORT: ${{ vars.PHYLAXIS_DB_PORT }}
          PHYLAXIS_DB_USER: ${{ vars.PHYLAXIS_DB_USER }}
          PHYLAXIS_DB_PASSWORD: ${{ secrets.PHYLAXIS_DB_PASSWORD }}
          PHYLAXIS_STORAGE_ENDPOINT: ${{ vars.PHYLAXIS_STORAGE_ENDPOINT }}
          PHYLAXIS_STORAGE_KEY: ${{ secrets.PHYLAXIS_STORAGE_KEY }}
          PHYLAXIS_STORAGE_SECRET: ${{ secrets.PHYLAXIS_STORAGE_SECRET }}
          PHYLAXIS_ENVIRONMENT: ${{ vars.PHYLAXIS_ENVIRONMENT || 'production' }}
        run: python scripts/production_runtime_start.py --dry-run

      - name: Boot canonical production runtime
        if: ${{ !inputs.dry_run }}
        env:
          VIABTC_USER: ${{ secrets.VIABTC_USER }}
          VIABTC_PASSWORD: ${{ secrets.VIABTC_PASSWORD }}
          BRAIINS_USER: ${{ secrets.BRAIINS_USER }}
          BRAIINS_PASSWORD: ${{ secrets.BRAIINS_PASSWORD }}
          PHYLAXIS_DB_HOST: ${{ vars.PHYLAXIS_DB_HOST }}
          PHYLAXIS_DB_PORT: ${{ vars.PHYLAXIS_DB_PORT }}
          PHYLAXIS_DB_USER: ${{ vars.PHYLAXIS_DB_USER }}
          PHYLAXIS_DB_PASSWORD: ${{ secrets.PHYLAXIS_DB_PASSWORD }}
          PHYLAXIS_STORAGE_ENDPOINT: ${{ vars.PHYLAXIS_STORAGE_ENDPOINT }}
          PHYLAXIS_STORAGE_KEY: ${{ secrets.PHYLAXIS_STORAGE_KEY }}
          PHYLAXIS_STORAGE_SECRET: ${{ secrets.PHYLAXIS_STORAGE_SECRET }}
          PHYLAXIS_ENVIRONMENT: ${{ vars.PHYLAXIS_ENVIRONMENT || 'production' }}
        run: python scripts/production_runtime_start.py --host 0.0.0.0 --port 3000
