name: PYTHIA Canonical Push CI

on:
  push:
    branches: [toe/elevation-expansion]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-python:
    name: Canonical Python compile and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install canonical test package
        working-directory: mla1517_platform_v3.4
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"
      - name: Compile canonical Python tree
        working-directory: mla1517_platform_v3.4
        run: python -m compileall -q python
      - name: Run canonical Python tests
        working-directory: mla1517_platform_v3.4
        env:
          PYTHONPATH: python
        run: python -m unittest discover -s python -p "test*.py" -v
