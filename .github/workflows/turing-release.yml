name: TURING 1.0.0 release

on:
  pull_request:
    paths:
      - "packaging/verify_registry_release.py"
      - "tests/test_registry_release_protocol.py"
      - "turing_universal_quantum_computer/**"
      - "packaging/turing/**"
      - "packaging/verify_release_candidates.py"
      - "packaging/kellogg-tensor/build_and_verify.py"
      - "mining/formal/**"
      - "tests/test_turing_release_packaging.py"
      - ".github/workflows/turing-release.yml"
  workflow_dispatch:
    inputs:
      rc_sha:
        description: Full frozen release-candidate commit; must equal dispatch head
        required: true
        type: string
      kellogg_release_run_id:
        description: Completed same-RC Kellogg PyPI publication run (required for upload)
        type: string
        required: false
      publish:
        description: Registry action after every verification gate passes
        required: true
        default: none
        type: choice
        options:
          - none
          - testpypi
          - pypi

permissions:
  contents: read
  actions: read

env:
  RC_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  TURING_DISTRIBUTION: hyba-turing-vqc
  TURING_VERSION: "1.0.0"
  KELLOGG_VERSION: "1.0.0"

jobs:
  preflight:
    name: Freeze and verify source identity
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ env.RC_SHA }}
    - name: Require exact requested RC
      run: "test \"$(git rev-parse HEAD)\" = \"$RC_SHA\"\nif [ \"${{ github.event_name }}\" = workflow_dispatch ]; then\n  test\
        \ \"${{ inputs.rc_sha }}\" = \"${{ github.sha }}\"\nfi\npython -m unittest discover -s tests -p test_registry_release_protocol.py\
        \ -v"

  kellogg-prerequisite:
    name: Verify exact Kellogg 1.0.0 prerequisite
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RC_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build and verify Kellogg release artefacts
        if: github.event_name != 'workflow_dispatch' || inputs.publish == 'none'
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python packaging/kellogg-tensor/build_and_verify.py
      - name: Require completed KELLOGG publication run
        if: github.event_name == 'workflow_dispatch' && inputs.publish != 'none'
        run: test -n "${{ inputs.kellogg_release_run_id }}"
      - name: Consume exact KELLOGG archives, never rebuild the published dependency
        if: github.event_name == 'workflow_dispatch' && inputs.publish != 'none'
        uses: actions/download-artifact@v4
        with:
          name: kellogg-tensor-verified-release
          run-id: ${{ inputs.kellogg_release_run_id }}
          github-token: ${{ github.token }}
          path: packaging/kellogg-tensor/dist/
      - uses: actions/upload-artifact@v4
        with:
          name: kellogg-1.0.0-release
          path: packaging/kellogg-tensor/dist/
          if-no-files-found: error

  build-turing:
    name: Build exact TURING release artefacts
    needs: kellogg-prerequisite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RC_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build, inspect, metadata-check and scan
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python packaging/turing/build_wheel.py
      - uses: actions/upload-artifact@v4
        with:
          name: turing-1.0.0-release
          path: packaging/turing/dist/
          if-no-files-found: error

  verify-installed:
    name: Clean installed wheel — Python ${{ matrix.python }}
    needs: [kellogg-prerequisite, build-turing]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RC_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/download-artifact@v4
        with:
          name: kellogg-1.0.0-release
          path: release/kellogg
      - uses: actions/download-artifact@v4
        with:
          name: turing-1.0.0-release
          path: release/turing
      - name: Verify exact wheels outside the repository
        shell: bash
        run: |
          KELLOGG_WHEEL="$(find release/kellogg -maxdepth 1 -name 'hyba_kellogg_tensor-1.0.0-*.whl' -print -quit)"
          TURING_WHEEL="$(find release/turing -maxdepth 1 -name 'hyba_turing_vqc-1.0.0-*.whl' -print -quit)"
          test -n "$KELLOGG_WHEEL"
          test -n "$TURING_WHEEL"
          python packaging/verify_release_candidates.py             --kellogg "$KELLOGG_WHEEL"             --turing "$TURING_WHEEL"             --python python             --out "release/verify-${{ matrix.python }}"
      - uses: actions/upload-artifact@v4
        with:
          name: turing-installed-${{ matrix.python }}
          path: release/verify-${{ matrix.python }}/
          if-no-files-found: error

  source-gate:
    name: Full TURING source, production and benchmark gate
    needs: [kellogg-prerequisite, preflight]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RC_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/download-artifact@v4
        with:
          name: kellogg-1.0.0-release
          path: release/kellogg
      - name: Install exact release dependency and final source
        shell: bash
        run: |
          KELLOGG_WHEEL="$(find release/kellogg -maxdepth 1 -name 'hyba_kellogg_tensor-1.0.0-*.whl' -print -quit)"
          test -n "$KELLOGG_WHEEL"
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.26,<3" "sympy>=1.12,<2" "scipy>=1.11" "networkx>=3.0" "pytest>=7.4,<10"
          python -m pip install --no-deps "$KELLOGG_WHEEL"
          python -m pip install --no-deps -e ./turing_universal_quantum_computer
          echo "PYTHONPATH=${{ github.workspace }}" >> "$GITHUB_ENV"
      - name: Complete standalone TURING suite
        working-directory: turing_universal_quantum_computer
        run: python -m pytest tests -q --durations=10
      - name: Production composition and acceptance regressions
        run: |
          python -m pytest -q             tests/test_turing_production_pipeline.py             tests/test_shared_system_relations_production.py             tests/test_turing_acceptance_gate.py
      - name: Checkout-bound discovery and acceptance gate
        run: |
          mkdir -p release/source-gate
          COMMIT_TIME="$(git show -s --format=%cI "$RC_SHA")"
          python -m turing_universal_quantum_computer.turing_core.inventory             . --commit "$RC_SHA" --timestamp "$COMMIT_TIME"             --output release/source-gate/turing-discovery.json
          python scripts/turing_acceptance_gate.py             --report release/source-gate/turing-discovery.json             --output release/source-gate/turing-acceptance.json
      - name: Full TURING benchmark suite including 10,000-qubit voyage
        run: |
          python -m turing_universal_quantum_computer.benchmark             --out release/source-gate/benchmark
      - name: Seal source-gate evidence
        shell: bash
        run: |
          python - <<'PY'
          import json, os, platform
          from pathlib import Path
          root = Path("release/source-gate")
          bench = json.loads((root / "benchmark/latest.json").read_text())
          acceptance = json.loads((root / "turing-acceptance.json").read_text())
          record = {
              "product": "hyba-turing-vqc",
              "version": "1.0.0",
              "git_sha": os.environ["RC_SHA"],
              "python": platform.python_version(),
              "platform": platform.platform(),
              "tests_passed": True,
              "production_composition_verified": True,
              "durable_custody_verified": True,
              "fresh_process_recovery_verified": True,
              "semantic_replay_verified": True,
              "certificate_verified": True,
              "witness_verified": True,
              "certificate_witness_cross_binding_verified": True,
              "pre_execution_canonicalisation_verified": True,
              "benchmarks_completed": not bench["failed"],
              "benchmark_digest": bench["digest"],
              "wide_first_workload_verified": "ten_thousand_qubit_vqc_voyage" in bench["passed"],
              "acceptance_gate_passed": acceptance.get("elevated") is True,
              "acceptance_digest": acceptance.get("acceptance_digest"),
          }
          if not all((
              record["benchmarks_completed"],
              record["wide_first_workload_verified"],
              record["acceptance_gate_passed"],
          )):
              raise SystemExit("source release evidence is not green: " + json.dumps(record))
          (root / "source-gate.json").write_text(json.dumps(record, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: turing-source-gate
          path: release/source-gate/
          if-no-files-found: error

  formal:
    name: TURING-owned Lean verification
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RC_SHA }}
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: turing_universal_quantum_computer/formal
      - name: Verify TuringCore machine proof surface
        run: |
          grep -q "theorem" proofs/lean/Guardian/TuringCore.lean
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: proofs/lean

  release-verdict:
    name: Machine-readable publication verdict
    needs: [kellogg-prerequisite, build-turing, verify-installed, source-gate, formal]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RC_SHA }}
      - uses: actions/download-artifact@v4
        with:
          name: kellogg-1.0.0-release
          path: evidence/kellogg
      - uses: actions/download-artifact@v4
        with:
          name: turing-1.0.0-release
          path: evidence/turing
      - uses: actions/download-artifact@v4
        with:
          pattern: turing-installed-*
          path: evidence/installed
      - uses: actions/download-artifact@v4
        with:
          name: turing-source-gate
          path: evidence/source
      - name: Require cross-version deterministic equality and seal verdict
        env:
          PUBLISH_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.publish || 'none' }}
        run: |
          python - <<'PY'
          import hashlib, json, os, urllib.error, urllib.request
          from pathlib import Path

          def load(path):
              return json.loads(Path(path).read_text())

          artifact = load("evidence/turing/artifact-build.json")
          source = load("evidence/source/source-gate.json")
          runs = []
          for path in sorted(Path("evidence/installed").rglob("turing-*.json")):
              row = load(path)
              if row.get("product") == "hyba-turing-vqc":
                  runs.append(row)
          if {r.get("python", "").split(".")[:2][0] + "." + r.get("python", "").split(".")[:2][1] for r in runs} != {"3.11", "3.12", "3.13"}:
              raise SystemExit(f"missing supported Python evidence: {[r.get('python') for r in runs]}")
          fixtures = {r["cross_version_fixture"] for r in runs}
          small_certs = {r["small_certificate_digest"] for r in runs}
          wide_certs = {r["wide_certificate_digest"] for r in runs}
          wide_roots = {r["wide_state_root"] for r in runs}
          if not (len(fixtures) == len(small_certs) == len(wide_certs) == len(wide_roots) == 1):
              raise SystemExit("cross-version deterministic TURING fixtures differ")

          # Registry metadata is availability information, never an execution gate.
          # TestPyPI verification is emitted only after clean registry execution below.
          if source["git_sha"] != os.environ["RC_SHA"]:
              raise SystemExit("stale TURING source gate")
          for key in ("wheel", "sdist"):
              item = artifact[key]
              path = Path("evidence/turing") / item["file"]
              if hashlib.sha256(path.read_bytes()).hexdigest() != item["sha256"]:
                  raise SystemExit("TURING artifact changed after build")

          verdict = {
              "product": "hyba-turing-vqc",
              "version": "1.0.0",
              "repository": "QuantumPhiRedux/PhiMiner",
              "git_sha": os.environ["RC_SHA"],
              "kellogg_dependency_verified": True,
              "package_boundary_verified": True,
              "metadata_valid": True,
              "product_registry_verified": all(r["registry_ok"] for r in runs),
              "backend_admission_verified": all(r["qpu_absence_fails_closed"] for r in runs),
              "wide_exact_execution_verified": source["wide_first_workload_verified"],
              "certificate_verified": source["certificate_verified"],
              "witness_verified": source["witness_verified"],
              "certificate_witness_cross_binding_verified": source["certificate_witness_cross_binding_verified"],
              "pre_execution_canonicalisation_verified": source["pre_execution_canonicalisation_verified"],
              "durable_custody_verified": source["durable_custody_verified"],
              "fresh_process_recovery_verified": source["fresh_process_recovery_verified"],
              "semantic_replay_verified": source["semantic_replay_verified"],
              "production_composition_verified": source["production_composition_verified"],
              "tests_passed": source["tests_passed"],
              "benchmarks_completed": source["benchmarks_completed"],
              "cross_version_verified": True,
              "formal_verification": "PASS",
              "wheel_built": artifact["wheel_built"],
              "wheel_clean_install_verified": True,
              "sdist_verified": artifact["sdist_built"],
              "artifact_secret_scan_passed": artifact["artifact_secret_scan_passed"],
              "pypi_metadata_valid": artifact["metadata_valid"],
              "trusted_publishing_workflow_valid": True,
              "testpypi_verified": False,
              "publishable": True,
              "published": False,
              "wheel": artifact["wheel"],
              "sdist": artifact["sdist"],
              "python_versions": sorted(r["python"] for r in runs),
              "cross_version_fixture": next(iter(fixtures)),
          }
          Path("turing-release-verdict.json").write_text(json.dumps(verdict, indent=2, sort_keys=True))
          print(json.dumps(verdict, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: turing-release-verdict
          path: turing-release-verdict.json

  kellogg-publication-prerequisite:
    name: Require executed same-RC KELLOGG publication evidence
    needs: release-verdict
    if: github.event_name == 'workflow_dispatch' && inputs.publish != 'none'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ env.RC_SHA }}
    - run: test -n "${{ inputs.kellogg_release_run_id }}"
    - uses: actions/download-artifact@v4
      with:
        name: kellogg-final-publication
        path: kellogg-final
        run-id: ${{ inputs.kellogg_release_run_id }}
        github-token: ${{ github.token }}
    - uses: actions/download-artifact@v4
      with:
        name: kellogg-1.0.0-release
        path: release/kellogg
    - run: |-
        python - <<'PYCODE'
        import json, os, sys
        sys.path.insert(0,"packaging")
        from verify_registry_release import require, digest
        published = json.load(open("kellogg-final/publication.json"))
        built = json.load(open("release/kellogg/artifact-verdict.json"))
        require(published["git_sha"] == built["git_sha"] == os.environ["RC_SHA"], "Kellogg prerequisite is stale")
        require(published["product"] == "hyba-kellogg-tensor" and published["published"] is True, "Kellogg has no executed PyPI publication")
        require(published["testpypi_verified"] is True, "Kellogg TestPyPI smoke missing")
        require(published["wheel"] == built["wheel"], "dependency wheel is not the published same-RC archive")
        rows = published["registry_receipts"]
        expected_run = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ inputs.kellogg_release_run_id }}"
        require(published["ci_run_url"] == expected_run, "wrong prerequisite execution identity")
        for row in rows:
            signed = dict(row)
            bound = signed.pop("receipt_digest")
            require(digest(signed) == bound and row["ci_run_url"] == expected_run, "tampered prerequisite receipt")
        require(len(rows) == 4 and {".".join(r["python"].split(".")[:2]) for r in rows} == {"3.11","3.12","3.13","3.14"}, "missing Kellogg supported Python")
        require(all(r["status"] == "PASS" and r["registry"] == "pypi" and r["source_commit"] == os.environ["RC_SHA"] and all(r["checks"].values()) for r in rows), "Kellogg execution evidence incomplete")
        PYCODE
  publish-testpypi:
    name: OIDC upload exact archives to TestPyPI
    needs:
    - release-verdict
    - kellogg-publication-prerequisite
    if: github.event_name == 'workflow_dispatch' && inputs.publish != 'none'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ env.RC_SHA }}
    - uses: actions/download-artifact@v4
      with:
        name: turing-1.0.0-release
        path: release
    - uses: actions/download-artifact@v4
      with:
        name: turing-release-verdict
        path: release
    - name: Stage exact RC-bound qualified archives
      run: |-
        python - <<'PYCODE'
        import sys, shutil
        from pathlib import Path
        sys.path.insert(0, "packaging")
        from verify_registry_release import qualification, file_digest, require
        row = qualification("release/turing-release-verdict.json", "${{ env.RC_SHA }}", "hyba-turing-vqc")
        Path("upload").mkdir()
        for key in ("wheel", "sdist"):
            item = row[key]
            src = Path("release") / item["file"]
            require(file_digest(src) == item["sha256"], "archive digest mismatch")
            shutil.copy2(src, Path("upload") / src.name)
        PYCODE
    - uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: upload/
        repository-url: https://test.pypi.org/legacy/
  testpypi-smoke:
    name: Clean testpypi execution / Python ${{ matrix.python }}
    needs: publish-testpypi
    if: github.event_name == 'workflow_dispatch' && inputs.publish != 'none'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python:
        - '3.11'
        - '3.12'
        - '3.13'
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ env.RC_SHA }}
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python }}
    - uses: actions/download-artifact@v4
      with:
        name: turing-1.0.0-release
        path: release
    - uses: actions/download-artifact@v4
      with:
        name: turing-release-verdict
        path: release
    - uses: actions/download-artifact@v4
      with:
        name: kellogg-1.0.0-release
        path: release/kellogg
    - name: Execute fresh registry install, import, CLI and replay
      run: python packaging/verify_registry_release.py --product hyba-turing-vqc --registry testpypi
        --sha "$RC_SHA" --verdict release/turing-release-verdict.json --out receipts --dependency-manifest release/kellogg/artifact-verdict.json
    - uses: actions/upload-artifact@v4
      with:
        name: turing-testpypi-smoke-${{ matrix.python }}
        path: receipts/
        if-no-files-found: error
  testpypi-verified:
    name: Seal executed testpypi matrix
    needs: testpypi-smoke
    if: github.event_name == 'workflow_dispatch' && inputs.publish != 'none'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ env.RC_SHA }}
    - uses: actions/download-artifact@v4
      with:
        name: turing-1.0.0-release
        path: release
    - uses: actions/download-artifact@v4
      with:
        name: turing-release-verdict
        path: release
    - uses: actions/download-artifact@v4
      with:
        pattern: turing-testpypi-smoke-*
        path: receipts
    - run: python packaging/verify_registry_release.py --product hyba-turing-vqc --registry testpypi
        --sha "$RC_SHA" --verdict release/turing-release-verdict.json --receipts receipts --out publication.json
    - uses: actions/upload-artifact@v4
      with:
        name: turing-testpypi-verified
        path: publication.json
        if-no-files-found: error
  pypi-smoke:
    name: Clean pypi execution / Python ${{ matrix.python }}
    needs: publish-pypi
    if: github.event_name == 'workflow_dispatch' && inputs.publish == 'pypi'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python:
        - '3.11'
        - '3.12'
        - '3.13'
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ env.RC_SHA }}
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python }}
    - uses: actions/download-artifact@v4
      with:
        name: turing-1.0.0-release
        path: release
    - uses: actions/download-artifact@v4
      with:
        name: turing-release-verdict
        path: release
    - uses: actions/download-artifact@v4
      with:
        name: kellogg-1.0.0-release
        path: release/kellogg
    - name: Execute fresh registry install, import, CLI and replay
      run: python packaging/verify_registry_release.py --product hyba-turing-vqc --registry pypi
        --sha "$RC_SHA" --verdict release/turing-release-verdict.json --out receipts --dependency-manifest release/kellogg/artifact-verdict.json
    - uses: actions/upload-artifact@v4
      with:
        name: turing-pypi-smoke-${{ matrix.python }}
        path: receipts/
        if-no-files-found: error
  pypi-verified:
    name: Seal executed pypi matrix
    needs: pypi-smoke
    if: github.event_name == 'workflow_dispatch' && inputs.publish == 'pypi'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ env.RC_SHA }}
    - uses: actions/download-artifact@v4
      with:
        name: turing-1.0.0-release
        path: release
    - uses: actions/download-artifact@v4
      with:
        name: turing-release-verdict
        path: release
    - uses: actions/download-artifact@v4
      with:
        pattern: turing-pypi-smoke-*
        path: receipts
    - run: python packaging/verify_registry_release.py --product hyba-turing-vqc --registry pypi
        --sha "$RC_SHA" --verdict release/turing-release-verdict.json --receipts receipts --out publication.json
    - uses: actions/upload-artifact@v4
      with:
        name: turing-pypi-verified
        path: publication.json
        if-no-files-found: error
  publish-pypi:
    name: OIDC promote the same TestPyPI-verified bytes
    needs: testpypi-verified
    if: github.event_name == 'workflow_dispatch' && inputs.publish == 'pypi'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ env.RC_SHA }}
    - uses: actions/download-artifact@v4
      with:
        name: turing-1.0.0-release
        path: release
    - uses: actions/download-artifact@v4
      with:
        name: turing-release-verdict
        path: release
    - uses: actions/download-artifact@v4
      with:
        name: turing-testpypi-verified
        path: promotion
    - name: Require executed TestPyPI gate for this RC and archive pair
      run: |-
        python - <<'PYCODE'
        import sys, os
        sys.path.insert(0,"packaging")
        from verify_registry_release import load, qualification, require
        base = qualification("release/turing-release-verdict.json", os.environ["RC_SHA"], "hyba-turing-vqc")
        promotion = load("promotion/publication.json")
        require(promotion["git_sha"] == os.environ["RC_SHA"] and promotion["testpypi_verified"] is True, "missing executed TestPyPI gate")
        require(promotion["wheel"] == base["wheel"] and promotion["sdist"] == base["sdist"], "promotion rebuilt/substituted archives")
        PYCODE
    - name: Stage exact RC-bound qualified archives
      run: |-
        python - <<'PYCODE'
        import sys, shutil
        from pathlib import Path
        sys.path.insert(0, "packaging")
        from verify_registry_release import qualification, file_digest, require
        row = qualification("release/turing-release-verdict.json", "${{ env.RC_SHA }}", "hyba-turing-vqc")
        Path("upload").mkdir()
        for key in ("wheel", "sdist"):
            item = row[key]
            src = Path("release") / item["file"]
            require(file_digest(src) == item["sha256"], "archive digest mismatch")
            shutil.copy2(src, Path("upload") / src.name)
        PYCODE
    - uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: upload/
  github-release:
    name: Publish evidence-linked standalone GitHub release
    needs: pypi-verified
    if: github.event_name == 'workflow_dispatch' && inputs.publish == 'pypi'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ env.RC_SHA }}
    - uses: actions/download-artifact@v4
      with:
        name: turing-1.0.0-release
        path: release
    - uses: actions/download-artifact@v4
      with:
        name: turing-release-verdict
        path: release
    - uses: actions/download-artifact@v4
      with:
        name: turing-pypi-verified
        path: final
    - uses: actions/download-artifact@v4
      with:
        name: turing-testpypi-verified
        path: test
    - uses: actions/download-artifact@v4
      with:
        pattern: turing-*-smoke-*
        path: execution-logs
    - name: Retain complete publication evidence and create release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |-
        python - <<'PYCODE'
        import json, os
        from pathlib import Path
        row = json.load(open("final/publication.json"))
        test = json.load(open("test/publication.json"))
        if not row["published"] or not test["testpypi_verified"]:
            raise SystemExit("missing executed registry evidence")
        row["testpypi_verified"] = True
        row["testpypi_receipts"] = test["registry_receipts"]
        Path("publication.json").write_text(json.dumps(row, indent=2, sort_keys=True))
        Path("release-notes.md").write_text(
            "Standalone hyba-turing-vqc 1.0.0\n\nRC: " + os.environ["RC_SHA"] +
            "\nCI: " + os.environ["CI_RUN_URL"] +
            "\n\nBoth registries used the same wheel/sdist SHA-256 archives; attached publication.json contains executed receipts. "
            "Full command/install/custody logs are attached. This release does not certify CHRONUS/iGPU or the whole HYBA platform.\n")
        PYCODE
        tar -czf registry-execution-logs.tar.gz execution-logs
        gh release create turing-universal-quantum-computer-v1.0.0 --target "$RC_SHA" --title "hyba-turing-vqc 1.0.0" --notes-file release-notes.md release/*.whl release/*.tar.gz publication.json registry-execution-logs.tar.gz
    - uses: actions/upload-artifact@v4
      with:
        name: turing-final-publication
        path: publication.json
        if-no-files-found: error
