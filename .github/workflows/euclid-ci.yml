name: EUCLID governed runtime

on:
  pull_request:
    paths:
      - "euclid/**"
      - "tests/test_euclid_runtime.py"
      - "tests/test_pi01_readiness_regressions.py"
      - "Intelligence/chain_verification.py"
      - "docs/EUCLID_KAIROS_RUNTIME.md"
      - "pyproject.toml"
      - ".github/workflows/euclid-ci.yml"
  push:
    branches: [main]
    paths:
      - "euclid/**"
      - "tests/test_euclid_runtime.py"
      - "tests/test_pi01_readiness_regressions.py"
      - "Intelligence/chain_verification.py"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  governed-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        # production() imports Intelligence.* which needs the declared
        # pyproject dependencies (numpy, pyyaml, sympy, the in-tree VQC
        # package); the job previously ran tests with no install step, so
        # the two production-path tests always errored.
        run: |
          bash scripts/ci_install.sh ""
      - name: Compile
        run: python -m compileall -q euclid tests/test_euclid_runtime.py
      - name: Focused tests
        run: python -m unittest -v tests.test_euclid_runtime tests.test_pi01_readiness_regressions