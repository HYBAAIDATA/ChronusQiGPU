id: exact-pv-kernel
language: C
severity: error
message: PV field kernels require exact arithmetic and residue storage of at least
  16 bits.
files:
- src/chronus/kernels/pv_lattice.cl
- src/chronus/kernels/pv_folded.cl
rule:
  any:
  - kind: number_literal
    regex: '[0-9]\.[0-9]|[0-9][eE][+-]?[0-9]'
  - all:
    - any:
      - kind: primitive_type
      - kind: type_identifier
    - regex: ^(float|double|char|uchar|uint8_t)$
