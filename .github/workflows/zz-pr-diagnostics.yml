# TEMPORARY: posts failing-check output to the pull request so it can be
# diagnosed without Actions log access. Remove before merging.
name: PR diagnostics (temporary)

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install
        run: python -m pip install -e '.[dev]' bandit coverage==7.17.2 > install.log 2>&1 || true
      - name: Python tests
        env:
          CHRONUS_WORKLOAD_DB_PATH: ${{ runner.temp }}/chronus-tests.sqlite3
        run: python -m pytest -q -rfE --tb=short -p no:cacheprovider > pytest.log 2>&1; echo "pytest exit=$?" >> pytest.log
      - name: Purity gate job steps
        run: |
          {
            python scripts/ci/purity_gate.py; echo "purity exit=$?"
            python scripts/ci/test_the_tests.py | tail -n 4; echo "test_the_tests exit=${PIPESTATUS[0]}"
            python scripts/ci/sovereign_attestation.py | tail -n 6; echo "attestation exit=${PIPESTATUS[0]}"
            python scripts/ci/manifest.py 2>&1 | tail -n 30; echo "manifest exit=${PIPESTATUS[0]}"
          } > purity.log 2>&1 || true
      - name: QiGPU model
        run: python -m coverage run --branch docs/qigpu/pasted-text.txt > qigpu.log 2>&1; echo "qigpu exit=$?" >> qigpu.log
      - name: Static security scan
        run: bandit -q -r src/chronus/execution src/chronus/backends src/chronus/service src/chronus/sdk src/chronus/security -ll -ii > bandit.log 2>&1; echo "bandit exit=$?" >> bandit.log
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Frontend build
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: (pnpm install --frozen-lockfile && pnpm build) > ../frontend.log 2>&1; echo "frontend exit=$?" >> ../frontend.log
      - name: Post diagnostics to the pull request
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "## Temporary CI diagnostics for ${GITHUB_SHA}"
            echo "### pytest (failures and errors)"
            echo '```'
            grep -E "^(FAILED|ERROR) " pytest.log | head -n 120 || true
            tail -n 3 pytest.log
            echo '```'
            echo "### pytest (first tracebacks)"
            echo '```'
            awk '/^=+ FAILURES =+$/{f=1} f' pytest.log | head -n 160 || true
            echo '```'
            for name in purity qigpu bandit frontend; do
              echo "### ${name}"
              echo '```'
              tail -n 70 "${name}.log" || true
              echo '```'
            done
          } > body.md
          head -c 60000 body.md > body-trimmed.md
          gh pr comment "$PR_NUMBER" --body-file body-trimmed.md
