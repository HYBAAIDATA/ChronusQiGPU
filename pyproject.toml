[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chronus-quantum-igpu"
version = "36.0.1"
description = "Chronus Quantum iGPU — Representation-Aware Computational Substrate & CIaaS Platform"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "cryptography>=41.0",
    "fastapi>=0.162.2,<0.163",
    "starlette>=1.3.1,<2",
    "httpx>=0.28,<1",
    "pydantic>=2.9,<3",
    "uvicorn[standard]>=0.27",
    "PyJWT[crypto]>=2.8,<3",
    "opentelemetry-api>=1.25,<2",
    "opentelemetry-sdk>=1.25,<2",
    "SQLAlchemy>=2.0,<3",
    "greenlet>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "hypothesis>=6.100",
]
postgres = [
    "asyncpg>=0.29",
    "alembic>=1.13",
]
accelerator = [
    "numpy>=1.26,<3",
    "pyopencl>=2024.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["chronus*"]

[tool.setuptools.package-data]
"chronus.kernels" = ["*.cl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--basetemp=.pytest_temp"
