name: Resident Hendrix ONE iGPU integration
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resident-route:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install canonical and isolated standalone products
        run: |
          python -m pip install -e ./turing_universal_quantum_computer -e '.[ml,dev]'
          python -m pip install ./packages/chronos-one-igpu
      - name: Canonical resident geometry and real hash tests
        run: python -m pytest tests/test_resident_hendrix.py -q --junitxml=resident-results.xml
      - name: Preserved standalone source regression suite
        working-directory: packages/chronos-one-igpu
        env:
          PYTHONPATH: src
        run: python -m pytest tests -q --junitxml=standalone-results.xml
      - name: Broad canonical repository suite
        env:
          PYTHONPATH: chronus/mla1517_platform/python
        run: python -m pytest tests/ -x -q --junitxml=canonical-results.xml
      - name: Retain actual test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resident-hendrix-test-evidence
          path: |
            resident-results.xml
            canonical-results.xml
            packages/chronos-one-igpu/standalone-results.xml
