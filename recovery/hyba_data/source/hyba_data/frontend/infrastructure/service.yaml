apiVersion: v1
kind: Service
metadata:
  name: hyba-frontend
  namespace: hyba-frontend
  labels:
    app.kubernetes.io/name: hyba-frontend
    app.kubernetes.io/part-of: hyba-mining
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  selector:
    app: hyba-frontend
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
