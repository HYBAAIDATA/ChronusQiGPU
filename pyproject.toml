# Public naming is approved; first-public version is 1.0.0.
# Development/research version reconciled to the first-public identity.
[project]
name = "hyba-pythia-mining"
version = "1.0.0"
description = "PYTHIA operational mining backend with the canonical MLA1517 execution path."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "HYBA Software Limited" }]
keywords = ["mining", "stratum", "opencl", "mla1517", "verification"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "numpy>=1.26,<3",
    "pyyaml>=6.0,<7",
    "sympy>=1.12,<2",
    # The virtual quantum computer (in-tree: turing_universal_quantum_computer/)
    # is part of the miner: the Hendrix nonce order and the VQC policy audit.
    # Install it beside this package: pip install ./turing_universal_quantum_computer .
    "hyba-turing-vqc>=1.0",
    # The resident Chronus iGPU execution contract (in-tree: chronus/packages/chronos-one-igpu/)
    "hyba-chronos-one-igpu>=1.0",
    # KELLOGG tensor substrate ships as its own distribution (packaging/kellogg-tensor/);
    # the umbrella must not vendor it — RECORD overlap is a release blocker.
    "hyba-kellogg-tensor>=1.0",
]

[project.scripts]
pythia = "main:main"
pythia-api = "control_api:main"
pythia-mine = "mining_runtime:main"
pythia-gpu-readiness = "gpu.readiness:main"
chronus-readiness = "chronus.readiness:main"
pythia-storage-db-gate = "hyba_db.production_gate:main"
pythagoras-v12 = "pythagoras.run_pythagoras:main"

[project.optional-dependencies]
hardware = [
    "pyopencl>=2024.1",
]
# Salamander's opt-in LLM repair stage (HYBA_SELF_REPAIR_LLM_ENABLED=true).
llm = [
    "anthropic>=0.45",
]
# Apple silicon accelerators (Intelligence/apple_features.py, hyba/inventory.py); macOS only.
apple = [
    "coremltools>=7.0; sys_platform == 'darwin'",
    "metalcompute>=0.2; sys_platform == 'darwin'",
    "mlx>=0.18; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
# Intelligence.asi.manifold_bridge.adjacency_to_digraph's networkx view.
graph = [
    "networkx>=3.0",
]
ml = [
    "scikit-learn>=1.3",
    # millennium.millennium_reasoning_service imports fastapi at module load.
    "fastapi>=0.110",
]
dev = [
    "pytest>=7.4,<10",
    "pytest-asyncio>=0.24,<3",
    "hypothesis>=6.0,<7",
    "black>=24.0,<27",
    "flake8>=7.0,<8",
    # self_repair measures coverage when pytest-cov is present.
    "pytest-cov>=6.1",
    "ruff>=0.8",
    "radon>=6.0",
    "mypy>=1.11",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = false
package-dir = {"" = "chronus/mla1517_platform/python", "euclid" = "euclid", "Intelligence" = "Intelligence", "mining" = "mining", "aethel" = "aethel", "gpu" = "gpu", "hyba" = "hyba", "toe" = "toe", "python_backend" = "python_backend", "al_haras" = "al_haras", "chronus" = "chronus", "chronos" = "chronus/chronos", "quantum_compute_substrate" = "quantum_compute_substrate", "l_hras" = "l_hras", "lucas" = "chronus/lucas", "millennium" = "millennium", "tensor" = "tensor", "hyba_profiles" = "hyba_profiles", "hyba_contracts" = "hyba_contracts", "hyba_services" = "hyba_services", "salamander" = "salamander", "hyba_db" = "hyba_db", "hyba_substrate" = "hyba_substrate", "conformance" = "conformance", "pythagoras" = "pythagoras", "compiler" = "chronus/compiler", "format" = "chronus/format", "tools" = "chronus/tools", "kernels" = "kernels", "isa" = "chronus/isa", "manifests" = "manifests", "artifacts" = "artifacts"}
packages = ["euclid", "euclid.core", "euclid.search", "euclid.discovery", "euclid.transfer", "euclid.validation", "euclid.geometry", "euclid.surrogate", "euclid.agents", "euclid.enterprise", "euclid.benchmarks", "euclid.tests", "euclid.cognition", "euclid.cognition.worlds", "euclid.cognition.integrated", "euclid.cognition.research", "Intelligence", "mining", "lucas", "millennium", "aethel", "gpu", "gpu.backends", "hyba", "hyba.hybrid", "hyba.math_ir", "hyba.operating_model", "toe", "toe.intelligences", "toe.unified", "python_backend", "python_backend.pythia_mining", "python_backend.mathematical_foundation", "python_backend.hyba", "python_backend.hyba.runtime", "python_backend.core_modules", "al_haras", "chronus", "chronus.virtual_igpu", "chronus.measurement", "chronus.measurement.attestation", "chronus.measurement.efficiency", "chronus.measurement.profiling", "chronus.measurement.roofline", "chronus.measurement.stability", "chronus.measurement.store", "chronus.measurement.system", "chronus.measurement.topology", "chronus.measurement.workload", "chronus.paradigm", "chronos", "chronos.academic", "quantum_compute_substrate", "chronus.seam", "chronus.mla1517", "chronus.mla1517.mining", "chronus.v33", "chronus.v33.academic", "chronus.v33.compression", "chronus.v33.control", "chronus.v33.environment", "chronus.v33.fields", "chronus.v33.graphics", "chronus.v33.memory", "chronus.v33.theory", "chronus.v33.benchmarks", "chronus.v33.examples", "l_hras", "l_hras.foundations", "l_hras.experimental", "l_hras.experimental.blueprint", "l_hras.experimental.blueprint.core", "l_hras.experimental.blueprint.substrate", "l_hras.experimental.blueprint.fold", "l_hras.experimental.blueprint.intelligences", "l_hras.experimental.blueprint.modes", "l_hras.experimental.blueprint.modules", "l_hras.experimental.blueprint.layers", "l_hras.experimental.blueprint.floor", "l_hras.experimental.blueprint.aethel", "l_hras.experimental.blueprint.guardian", "l_hras.experimental.blueprint.mining", "l_hras.experimental.blueprint.security", "l_hras.experimental.blueprint.asic", "l_hras.experimental.blueprint.blueprint_tests", "tensor", "tensor.backends", "hyba_profiles", "hyba_contracts", "hyba_services", "salamander", "hyba_db", "hyba_substrate", "aethel.enterprise", "conformance", "conformance.generators", "conformance.tests", "pythagoras", "pythagoras.agents", "pythagoras.benchmarks", "pythagoras.core", "pythagoras.domains", "pythagoras.engine", "pythagoras.enterprise", "pythagoras.experiments", "pythagoras.integration", "pythagoras.tests", "Intelligence.asi", "Intelligence.consciousness", "Intelligence.self_healing", "Intelligence.tests", "quantum_compute_substrate.applications", "quantum_compute_substrate.cathedral", "quantum_compute_substrate.hardware_codesign", "quantum_compute_substrate.interop", "quantum_compute_substrate.phi_infinity_tensor", "quantum_compute_substrate.post_quantum", "quantum_compute_substrate.pulvini", "quantum_compute_substrate.quantum_2026", "quantum_compute_substrate.scaling_study", "quantum_compute_substrate.tests", "quantum_compute_substrate.visualization", "quantum_compute_substrate.quantum_2026.classics", "euclid.curriculum", "euclid.organ_adapters", "toe.adapters", "compiler", "compiler.geometry", "format", "tools", "tools.asm", "tools.disasm", "kernels", "isa", "manifests", "artifacts.pythia_training"]
py-modules = [
    "al_haras_pythia",
    "autonomous_supervisor",
    "control_api",
    "coordinator",
    "discovery_runtime",
    "euclid_core",
    "extended_algebra",
    "failure_taxonomy",
    "headless_miner",
    "main",
    "manifold_pool_coordinator",
    "m3_mining_guard",
    "mining_runtime",
    "policy_bench",
    "pool_catalog",
    "pythia_client",
    "worker_lifecycle",
    "runtime_config",
    "turing_core",
    "pythia_turing_math",
    "startup_contract",
    "system_fabric",
    "reference_test",
    "run_conformance",
    "run_cpp_host_overlay",
    "salamander_control",
    "salamander_engine",
    "telemetry_daemon",
]

[tool.setuptools.package-data]
"chronus.mla1517" = ["seeds/*.yaml"]
aethel = ["py.typed", "*.md", "capabilities.json"]
gpu = ["py.typed", "README.md", "BLUEPRINT_AUDIT.md"]
chronus = ["py.typed", "README.md", "GPU_CAPABILITY_MANIFEST.json", "CONVERGENCE_MANIFEST.json", "kernels/*.cl", "deploy/*.yml", "spec/*.json"]
chronos = ["README.md"]
"chronus.v33" = ["CAPABILITY_MANIFEST.json", "docs/*.md", "benchmarks/*.json"]
hyba_db = ["CAPABILITY_MANIFEST.json"]
tensor = ["py.typed", "README.md", "CAPABILITY_MANIFEST.md"]
l_hras = ["py.typed", "README.md", "config.example.toml"]
toe = ["py.typed", "default_propagators.json", "CAPABILITY_MANIFEST.json", "CLAIM_REGISTER.json"]
millennium = ["*.ts", "rtl/*.sv", "docs/*.md"]
python_backend = ["*.csv"]
pythagoras = ["README.md"]
compiler = ["*.json", "cases/*.json"]
format = ["*.md"]
kernels = ["*.cl", "*.s"]
isa = ["*.json", "*.md"]
# dev-signing.key deliberately excluded: dev-only material, never shipped.
manifests = ["*.json", "*.yaml", "*.key.README", "chronus105/*.json", "chronus106/*.json", "chronus107/*.json", "salamander108/*.json", "euclid_genesis_and_kairos_qualification/*.json"]
"artifacts.pythia_training" = ["*.csv", "*.json"]

[tool.pytest.ini_options]
testpaths = ["chronus/mla1517_platform/python", "tests"]

[tool.black]
line-length = 100
target-version = ["py312"]
# Vendored skill grafts are kept byte-exact (Intelligence/skill_graft.py).
extend-exclude = "Intelligence/skills/"
exclude = '''
/(
    \.git
  | \.pytest_cache
  | __pycache__
  | node_modules
  | dist
  | models
  | logs
  | legacy
  | \.venv
  | venv
)/
'''