name: Storage and fold closeout reference
on:
  pull_request:
    paths:
      - 'src/chronus/storage/**'
      - 'scripts/benchmarks/storage_closeout.py'
      - 'benchmarks/qualify_storage_performance.py'
      - 'tests/test_storage_device_qualification.py'
      - 'docs/production/DEVICE_STORAGE_QUALIFICATION.md'
      - 'tests/test_storage_research_closeout.py'
      - 'docs/production/STORAGE_RESEARCH_CLOSEOUT_20261116.md'
      - '.github/workflows/storage-closeout-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  storage-fold-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install project and pytest
        run: python -m pip install -e '.[test]'
      - name: Run storage, triad and research closeout tests
        run: python -m pytest -q tests/test_storage_research_closeout.py tests/test_storage_device_qualification.py tests/test_storage_closeout_benchmark.py tests/test_storage.py tests/test_triad_production.py tests/test_prime_codec.py tests/test_pulvini_research_locked.py
      - name: Run controlled reference on this commit
        run: python scripts/benchmarks/storage_closeout.py --records 64 --payload-bytes 1024 --elements 10648 --depth 20 --output-json reference-evidence/storage-fold-reference.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: storage-fold-reference
          path: reference-evidence/storage-fold-reference.json
          if-no-files-found: error
