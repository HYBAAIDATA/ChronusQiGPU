name: TURING package organization

on:
  pull_request:
    paths:
      - 'turing_universal_quantum_computer/**'
      - 'kellogg/**'
      - 'packaging/kellogg-tensor/**'
      - 'scripts/run_turing_tests.py'
      - '.github/workflows/turing-package.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install locked research environment
        run: |
          python -m pip install uv==0.13.1
          uv sync --project turing_universal_quantum_computer --locked --group research
      - name: API and package organization tests
        run: |
          turing_universal_quantum_computer/.venv/bin/python scripts/run_turing_tests.py . turing_universal_quantum_computer/tests/test_package_organization.py
      - name: Affected engine conformance tests
        run: |
          turing_universal_quantum_computer/.venv/bin/python scripts/run_turing_tests.py . turing_universal_quantum_computer/tests/test_product_boundary.py turing_universal_quantum_computer/tests/test_backend_boundary.py turing_universal_quantum_computer/tests/test_stabilizer_measurement.py turing_universal_quantum_computer/tests/test_production_release_gate.py
      - name: Build dependency wheel and TURING distributions
        run: |
          uv run --project turing_universal_quantum_computer --locked --group research python -m build --wheel --no-isolation packaging/kellogg-tensor --outdir "$RUNNER_TEMP/turing-dist"
          uv run --project turing_universal_quantum_computer --locked --group research python -m build --no-isolation turing_universal_quantum_computer --outdir "$RUNNER_TEMP/turing-dist"
      - name: Validate installed wheels outside the checkout
        run: |
          uv export --project turing_universal_quantum_computer --locked --group research --no-emit-project --no-emit-package hyba-kellogg-tensor --format requirements-txt > "$RUNNER_TEMP/turing-requirements.txt"
          uv venv --python "$(command -v python)" "$RUNNER_TEMP/turing-installed"
          uv pip install --python "$RUNNER_TEMP/turing-installed/bin/python" -r "$RUNNER_TEMP/turing-requirements.txt"
          uv pip install --python "$RUNNER_TEMP/turing-installed/bin/python" --no-deps "$RUNNER_TEMP"/turing-dist/*.whl
          cp turing_universal_quantum_computer/tests/test_public_api_dropin.py "$RUNNER_TEMP/test_turing_installed.py"
          cp turing_universal_quantum_computer/examples/turing_pipeline.py "$RUNNER_TEMP/turing_pipeline.py"
          cd "$RUNNER_TEMP"
          unset PYTHONPATH
          turing-installed/bin/python -I -m pytest test_turing_installed.py -q
          turing-installed/bin/python -I turing_pipeline.py
      - name: Generate commit-bound validation evidence and tables
        run: |
          uv run --project turing_universal_quantum_computer --locked --group research python turing_universal_quantum_computer/experiments/run_experiment.py > "$RUNNER_TEMP/turing-manifest-path"
          uv run --project turing_universal_quantum_computer --locked --group research python turing_universal_quantum_computer/experiments/analyze_results.py "$(cat "$RUNNER_TEMP/turing-manifest-path")" --output turing_universal_quantum_computer/results/local/analysis
      - uses: actions/upload-artifact@v4
        with:
          name: turing-package-validation-py${{ matrix.python }}
          path: |
            turing_universal_quantum_computer/results/local/
            ${{ runner.temp }}/turing-dist/

# Deliberately no publication step. Existing turing-release.yml remains the
# release authority; these focused checks do not replace its broader gates.
