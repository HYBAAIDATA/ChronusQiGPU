global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: euclid-core
    metrics_path: /metrics
    static_configs:
      # Must match the PORT env var (default 3000). In Docker, use the service name.
      - targets: ["euclid-core:3000", "localhost:3000"]
