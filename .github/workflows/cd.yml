name: CD - Continuous Deployment

on:
  push:
    branches: [main]
  release:
    types: [published]

env:
  PYTHON_VERSION: "3.10"
  REGISTRY: ghcr.io
  IMAGE_NAME: chronus-quantum-igpu

jobs:
  # =========================================================================
  # Build & Push Docker Image
  # =========================================================================
  docker:
    name: Build & Push Docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================================================================
  # Deploy to Kubernetes
  # =========================================================================
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: v1.28.0

      - name: Set up kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Update deployment image
        run: |
          VERSION="${GITHUB_SHA::7}"
          kubectl set image deployment/chronus-quantum-igpu \
            chronus-quantum-igpu=${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}:${VERSION} --namespace=chronus

      - name: Roll deployment
        run: |
          kubectl rollout status deployment/chronus-quantum-igpu --namespace=chronus --timeout=300s

  # =========================================================================
  # Database Migration
  # =========================================================================
  migrate:
    name: Run Database Migrations
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: chronus
          POSTGRES_PASSWORD: chronus
          POSTGRES_DB: chronus_quantum
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run database migrations
        run: |
          python -m chronus.database.migrate

  # =========================================================================
  # Notification
  # =========================================================================
  notify:
    name: Notify Slack
    runs-on: ubuntu-latest
    needs: [docker, deploy, migrate]
    if: always()

    steps:
      - name: Send notification
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          STATUS="SUCCESS"
          if [ "${{ needs.docker.result }}" != "success" ] || \
             [ "${{ needs.deploy.result }}" != "success" ] || \
             [ "${{ needs.migrate.result }}" != "success" ]; then
            STATUS="FAILURE"
          fi

          MESSAGE="Chronus Quantum i GPU v36.0 Deployment ${STATUS}\n"\
                  "• Docker Image: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}\n"\
                  "• Commit: ${{ github.sha }}\n"\
                  "• Branch: ${{ github.ref_name }}\n"\
                  "• Status: ${STATUS}"

          curl -s -X POST \
            -H 'Content-type: application/json' \
            --data "{\"text\":\"${MESSAGE}\"}" \
            $SLACK_WEBHOOK
