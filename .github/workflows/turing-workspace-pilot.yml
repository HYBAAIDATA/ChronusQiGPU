name: TURING workspace pilot checks
on:
  pull_request:
    paths:
      - "frontend/src/turing/**"
      - "frontend/src/main.tsx"
      - "chronus/mla1517_platform/python/turing_workspace.py"
      - "chronus/mla1517_platform/python/control_api.py"
      - "chronus/mla1517_platform/python/al_haras_pythia.py"
      - "tests/test_turing_workspace_pilot.py"
      - "frontend/tsconfig.turing.json"
      - "docs/turing/**"
      - ".github/workflows/turing-workspace-pilot.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the existing locked TURING environment
        run: |
          python -m pip install uv==0.13.1
          uv sync --project turing_universal_quantum_computer --locked --group research
      - name: Adapter regressions and real native smoke (no fake engine in smoke)
        env:
          TURING_RUN_ENGINE_SMOKE: "1"
        run: |
          turing_universal_quantum_computer/.venv/bin/python -m unittest discover -s tests -p test_turing_workspace_pilot.py -v
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run lint
      - name: Strictly type-check new workspace modules
        working-directory: frontend
        run: npx --no-install tsc --noEmit -p tsconfig.turing.json
      - run: npm --prefix frontend run test:ts -- src/turing/
      - run: npm --prefix frontend run build
