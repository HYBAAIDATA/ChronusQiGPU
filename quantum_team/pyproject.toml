[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-team"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[tool.setuptools]
packages = ["quantum", "team"]
py-modules = ["loop"]

# Own pytest settings so the parent Chronus configuration does not apply.
# "../src" lets the fold cross-check test import Chronus's canonical M15; that
# test is skipped when Chronus is not importable.
[tool.pytest.ini_options]
testpaths = ["."]
pythonpath = [".", "../src"]
