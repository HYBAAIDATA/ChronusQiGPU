global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - chronus-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: chronus-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - chronus-api:8000

  - job_name: postgres
    static_configs:
      - targets:
          - postgres:5432

  - job_name: redis
    static_configs:
      - targets:
          - redis:6379

  - job_name: node
    static_configs:
      - targets:
          - localhost:9100
