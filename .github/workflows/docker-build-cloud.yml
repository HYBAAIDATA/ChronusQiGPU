name: Build and publish Docker packages

on:
  push:
    branches:
      - main
      - elevation/euclid-intelligence-elevation
    tags:
      - 'v*.*.*'
  pull_request:
    paths:
      - 'Dockerfile'
      - 'Dockerfile.hybrid'
      - 'chronus/**'
      - 'packages/**'
      - 'frontend/**'
      - 'scripts/ci_install.sh'
      - 'pyproject.toml'
      - '.github/workflows/docker-build-cloud.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    name: ${{ matrix.package.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        package:
          - name: pythia-control
            file: Dockerfile
            context: .
            description: Unified PYTHIA control plane and operator console
          - name: pythia-miner
            file: Dockerfile.headless_miner
            context: chronus/mla1517_platform
            description: Headless mining and execution engine
          - name: pythia-hybrid
            file: Dockerfile.hybrid
            context: .
            description: Hybrid CPU/iGPU/remote mining engine
          - name: chronus-one-igpu
            file: Dockerfile
            context: packages/chronos-one-igpu
            description: Chronus virtual one-iGPU acceleration package
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Normalize package owner for GHCR
        id: owner
        shell: bash
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ steps.owner.outputs.value }}/${{ matrix.package.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,prefix=sha-
            type=ref,event=branch
            type=ref,event=tag
          labels: |
            org.opencontainers.image.title=${{ matrix.package.name }}
            org.opencontainers.image.description=${{ matrix.package.description }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and publish ${{ matrix.package.name }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.package.context }}
          file: ${{ matrix.package.context }}/${{ matrix.package.file }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.package.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.package.name }}
          provenance: mode=max
          sbom: true
