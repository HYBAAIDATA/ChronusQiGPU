name: Repo Hygiene, IP Boundary and Gate G2
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  root-allowlist-and-ip-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/ci/check_repo_hygiene.py --report artifacts/repo_hygiene_report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repo-hygiene-report-${{ github.sha }}
          path: artifacts/repo_hygiene_report.json
  gitleaks-secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
  theseus-gate-g2-custody:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]" blake3
      - name: Gate G2 deterministic fault tests
        run: python -m pytest -v --strict-markers tests/test_theseus_gate_g2_fenced_custody.py
      - name: Lifecycle and schema regressions
        if: always()
        run: python -m pytest -v --strict-markers tests/test_theseus_lifecycle.py tests/test_wiring_entrypoints.py
      - name: Regression qualification
        if: always()
        run: |
          python -m pytest -q tests/test_triad_production.py tests/test_triad_capability_manifest.py tests/test_geodesic_tensor_migration.py tests/test_qualification.py tests/test_product_gates.py tests/test_release_gate.py
      - name: Working tree
        if: always()
        run: git status --short
