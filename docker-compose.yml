services:
  chronus-api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      CHRONUS_TENANT_TOKENS: "${CHRONUS_TENANT_TOKENS:?Set CHRONUS_TENANT_TOKENS to a tenant-token JSON object}"
    volumes:
      - chronus_data:/var/lib/chronus
    restart: unless-stopped

volumes:
  chronus_data:
