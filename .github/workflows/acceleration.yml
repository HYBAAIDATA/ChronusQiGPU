name: Acceleration bounded checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fourier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install 'numpy>=1.26,<3' 'pytest>=7' 'pytest-cov>=4' 'hypothesis>=6.100'
      - name: Test seven classes and enforce coverage
        env:
          PYTHONPATH: src
        run: python -m pytest -v tests/acceleration/test_fourier.py --cov=chronus.acceleration.fourier --cov-branch --cov-fail-under=90 --cov-report=term-missing --cov-report=xml:acceleration-coverage.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: acceleration-coverage
          path: acceleration-coverage.xml
          if-no-files-found: warn
  state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install 'numpy>=1.26,<3' 'pytest>=7' 'pytest-cov>=4' 'hypothesis>=6.100'
      - name: Test seven classes and enforce state coverage
        env:
          PYTHONPATH: src
        run: python -m pytest -v tests/acceleration/test_state.py --cov=chronus.acceleration.state --cov-branch --cov-fail-under=90 --cov-report=term-missing --cov-report=xml:state-coverage.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: acceleration-state-coverage
          path: state-coverage.xml
          if-no-files-found: warn
